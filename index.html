<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 總名單管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-4xl w-full rounded-xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
        <header class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-blue-400">
                    📋 Artale 總名單管理
                </h1>
                <p id="sync-status" class="mt-1 text-xs text-slate-500">☁ Firebase 連線中...</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:bg-slate-700 transition">
                    📤 匯出資料
                </button>
                <label class="cursor-pointer rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:bg-slate-700 transition">
                    📥 匯入資料 <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- 新增 / 編輯成員表單 -->
        <div class="mb-6 rounded-lg border border-slate-800 bg-slate-950 p-4">
            <h2 id="form-title" class="mb-3 text-sm font-bold text-blue-400">➕ 新增遠征隊成員</h2>
            <form id="pool-form" onsubmit="handlePoolSubmit(event)" class="grid grid-cols-1 md:grid-cols-6 gap-3">
                <input type="hidden" id="edit-player-id">
                <div class="md:col-span-1">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">名字 / ID <span class="text-rose-500">*</span></label>
                    <input type="text" id="player-name" required placeholder="角色名稱" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">等級 (Lv.)</label>
                    <input type="text" id="player-level" placeholder="例: 120" maxlength="3" inputmode="numeric" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">職業</label>
                    <select id="player-job" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                        <option value="">選擇職業</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">AD / AP</label>
                    <input type="text" id="player-position" placeholder="例: AD" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">本/分號綁定</label>
                    <select id="player-group" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-amber-400 font-bold focus:border-blue-500 focus:outline-none">
                        <option value="">無綁定</option>
                    </select>
                </div>
                <div class="md:col-span-1 flex items-end">
                    <button type="submit" id="submit-btn" class="w-full rounded bg-blue-600 py-1.5 text-xs font-bold text-white hover:bg-blue-500 transition shadow">
                        新增
                    </button>
                </div>
                <div class="md:col-span-6">
                    <input type="text" id="player-note" placeholder="備註說明 (選填)" class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
            </form>
            <div id="cancel-edit-container" class="mt-2 hidden">
                <button type="button" onclick="cancelEdit()" class="text-xs text-slate-400 hover:text-slate-200 underline">取消編輯</button>
            </div>
        </div>

        <!-- 總名單列表 -->
        <div class="rounded-lg border border-slate-800 bg-slate-950 p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-slate-200">👥 現有總名單成員 (<span id="pool-count">0</span>)</h2>
                <div class="flex gap-2">
                    <input type="text" id="search-pool" oninput="renderPoolList()" placeholder="搜尋成員/職業..." class="rounded border border-slate-700 bg-slate-900 px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="overflow-x-auto max-h-[500px]">
                <table class="w-full text-left text-xs">
                    <thead class="sticky top-0 bg-slate-900 text-slate-400 uppercase border-b border-slate-800">
                        <tr>
                            <th class="p-2.5">名字</th>
                            <th class="p-2.5">等級</th>
                            <th class="p-2.5">職業</th>
                            <th class="p-2.5">AD/AP</th>
                            <th class="p-2.5">綁定群組</th>
                            <th class="p-2.5">備註</th>
                            <th class="p-2.5 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="pool-table-body" class="divide-y divide-slate-800/60">
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const JOB_LIST = ["黑騎士", "聖騎士", "英雄", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        let database = null;
        let globalData = { pool: [] };

        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }

        function initPage() {
            // 初始化職業選單
            const jobSelect = document.getElementById("player-job");
            JOB_LIST.forEach(j => {
                const opt = document.createElement("option");
                opt.value = j;
                opt.textContent = j;
                jobSelect.appendChild(opt);
            });

            // 初始化群組選單
            const groupSelect = document.getElementById("player-group");
            for (let i = 1; i <= 10; i++) {
                const opt = document.createElement("option");
                opt.value = `g${i}`;
                opt.textContent = `本/分號 ${i}`;
                groupSelect.appendChild(opt);
            }

            if (database) {
                const statusEl = document.getElementById("sync-status");
                database.ref(".info/connected").on("value", snap => {
                    if (snap.val() === true) {
                        statusEl.textContent = "🟢 Firebase 連線正常 (即時同步中)";
                        statusEl.className = "mt-1 text-xs text-emerald-400 font-semibold";
                    } else {
                        statusEl.textContent = "🔴 Firebase 斷線中...";
                        statusEl.className = "mt-1 text-xs text-rose-400 font-semibold";
                    }
                });

                database.ref(FIREBASE_PATH).on("value", snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        globalData = data;
                        if (!globalData.pool) globalData.pool = [];
                        renderPoolList();
                    }
                });
            }
        }

        function renderPoolList() {
            const tbody = document.getElementById("pool-table-body");
            const search = document.getElementById("search-pool").value.trim().toLowerCase();
            const pool = globalData.pool || [];

            const filtered = pool.filter(p => {
                if (!search) return true;
                return (p.name && p.name.toLowerCase().includes(search)) ||
                       (p.job && p.job.toLowerCase().includes(search)) ||
                       (p.position && p.position.toLowerCase().includes(search));
            });

            document.getElementById("pool-count").textContent = pool.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">目前沒有成員資料</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(p => `
                <tr class="hover:bg-slate-900/50 transition">
                    <td class="p-2.5 font-bold text-slate-200">${escapeHtml(p.name)}</td>
                    <td class="p-2.5 text-slate-400">${escapeHtml(p.level || "-")}</td>
                    <td class="p-2.5 text-blue-400">${escapeHtml(p.job || "-")}</td>
                    <td class="p-2.5 text-slate-300">${escapeHtml(p.position || "-")}</td>
                    <td class="p-2.5 text-amber-400 font-bold">${p.groupId ? `本/分號 ${p.groupId.replace('g','')}` : "-"}</td>
                    <td class="p-2.5 text-slate-400 truncate max-w-[150px]">${escapeHtml(p.note || "-")}</td>
                    <td class="p-2.5 text-right space-x-2">
                        <button onclick="editPlayer('${p.id}')" class="text-blue-400 hover:text-blue-300 font-semibold">編輯</button>
                        <button onclick="deletePlayer('${p.id}')" class="text-rose-400 hover:text-rose-300 font-semibold">刪除</button>
                    </td>
                </tr>
            `).join("");
        }

        async function handlePoolSubmit(e) {
            e.preventDefault();
            if (!database) {
                alert("未連線至資料庫");
                return;
            }

            const id = document.getElementById("edit-player-id").value;
            const name = document.getElementById("player-name").value.trim();
            const level = document.getElementById("player-level").value.trim();
            const job = document.getElementById("player-job").value;
            const position = document.getElementById("player-position").value.trim();
            const groupId = document.getElementById("player-group").value;
            const note = document.getElementById("player-note").value.trim();

            const ref = database.ref(FIREBASE_PATH);
            try {
                await ref.transaction(currentData => {
                    if (!currentData) currentData = { pool: [] };
                    if (!currentData.pool) currentData.pool = [];

                    if (id) {
                        const idx = currentData.pool.findIndex(p => p.id === id);
                        if (idx !== -1) {
                            currentData.pool[idx].name = name;
                            currentData.pool[idx].level = level;
                            currentData.pool[idx].job = job;
                            currentData.pool[idx].position = position;
                            currentData.pool[idx].groupId = groupId;
                            currentData.pool[idx].note = note;
                        }
                    } else {
                        currentData.pool.push({
                            id: Date.now() + "-" + Math.random().toString(36).substring(2, 10),
                            name, level, job, position, groupId, note,
                            availability: {}
                        });
                    }
                    return currentData;
                });

                cancelEdit();
            } catch (err) {
                console.error("儲存失敗", err);
                alert("儲存失敗，請再試一次。");
            }
        }

        function editPlayer(id) {
            const p = (globalData.pool || []).find(x => x.id === id);
            if (!p) return;

            document.getElementById("edit-player-id").value = p.id;
            document.getElementById("player-name").value = p.name || "";
            document.getElementById("player-level").value = p.level || "";
            document.getElementById("player-job").value = p.job || "";
            document.getElementById("player-position").value = p.position || "";
            document.getElementById("player-group").value = p.groupId || "";
            document.getElementById("player-note").value = p.note || "";

            document.getElementById("form-title").textContent = "✏️ 編輯成員資料";
            document.getElementById("submit-btn").textContent = "儲存修改";
            document.getElementById("cancel-edit-container").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById("pool-form").reset();
            document.getElementById("edit-player-id").value = "";
            document.getElementById("form-title").textContent = "➕ 新增遠征隊成員";
            document.getElementById("submit-btn").textContent = "新增";
            document.getElementById("cancel-edit-container").classList.add("hidden");
        }

        async function deletePlayer(id) {
            if (!confirm("確定要刪除這位成員嗎？")) return;
            const ref = database.ref(FIREBASE_PATH);
            try {
                await ref.transaction(currentData => {
                    if (!currentData || !currentData.pool) return currentData;
                    currentData.pool = currentData.pool.filter(p => p.id !== id);
                    return currentData;
                });
            } catch (err) {
                console.error("刪除失敗", err);
                alert("刪除失敗");
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `artale_pool_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (confirm("確定要匯入並覆蓋目前的資料嗎？")) {
                        await database.ref(FIREBASE_PATH).set(parsed);
                        alert("匯入成功！");
                    }
                } catch (err) {
                    alert("檔案格式錯誤，無法匯入。");
                }
                e.target.value = "";
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        initPage();
    </script>
</body>
</html>
