<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 總名單管理</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-5xl">
        <header class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-blue-400 md:text-3xl flex items-center gap-2">
                    <span>📋</span> Artale 總名單維護與管理
                </h1>
                <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="teams.html" target="_blank" class="rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-xs font-bold text-slate-200 hover:bg-slate-700 transition">
                    ⚔️ 開啟隊伍分配頁面 ↗
                </a>
            </div>
        </header>

        <!-- 週別切換區塊（供填寫各週出席狀況） -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換檢視週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none">
                </select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
            </div>
            <div class="text-xs text-slate-400">
                💡 在此設定成員的<span class="text-blue-400 font-semibold">等級/職業/名字/ADAP/分號綁定</span>全週通用，各週出席時間獨立。
            </div>
        </div>

        <main class="space-y-6">
            <div id="master-view-container"></div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const STORAGE_KEY = "artale_party_local_v3";
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const JOB_LIST = ["黑騎士", "聖騎士", "英雄", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        let database = null;
        let firebaseEnabled = false;
        let sortableInstance = null;

        let poolSortState = { field: null, direction: 'desc' };
        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            pool: [],
            weeksData: {}
        };

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            let diffToTuesday = (day >= 2) ? (2 - day) : (2 - day - 7);
            date.setDate(date.getDate() + diffToTuesday);
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return weekKey;
            const start = new Date(parts[0], parts[1] - 1, parts[2]);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            const year = start.getFullYear();
            const startM = String(start.getMonth() + 1).padStart(2, '0');
            const startD = String(start.getDate()).padStart(2, '0');
            const startW = weekdays[start.getDay()];
            const endM = end.getMonth() + 1;
            const endD = String(end.getDate()).padStart(2, '0');
            const endW = weekdays[end.getDay()];
            return `${year} ${startM}/${startD}(${startW}) ~${endM}/${endD}(${endW})`;
        }

        function makeId() {
            return Date.now() + "-" + Math.random().toString(36).substring(2, 10);
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (!el) return;
            el.className = `mt-1 ${className}`;
            el.textContent = text;
        }

        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            firebaseEnabled = true;
        } catch (error) {
            firebaseEnabled = false;
            setSyncStatus("⚠ Firebase 初始化失敗，使用本機儲存", "text-[11px] text-rose-400");
        }

        if (firebaseEnabled) {
            database.ref(".info/connected").on("value", snapshot => {
                if (snapshot.val() === true) {
                    setSyncStatus("☁ 已連線到 Firebase", "text-[11px] text-emerald-400");
                } else {
                    setSyncStatus("☁ Firebase 連線中...", "text-[11px] text-amber-400");
                }
            });
        }

        function isLevel(value) { return /^(?:lv\.?\s*)?\d+$/i.test(String(value || "").trim()); }
        function normalizeLevel(value) { const m = String(value || "").trim().match(/\d+/); return m ? m[0] : ""; }

        function getPlayerLevel(player) {
            if (!player) return "";
            for (const v of [player.level, player.lv, player["等級"]]) {
                if (isLevel(v)) return normalizeLevel(v);
            }
            return "";
        }

        function normalizeAvailabilityArray(arr) {
            const defaultArr = ["", "", "", "", "", "", ""];
            if (!Array.isArray(arr)) return defaultArr;
            return defaultArr.map((_, i) => typeof arr[i] === "string" ? arr[i] : "");
        }

        function normalizePlayerAvailability(availObjOrArr, activeWeekKey) {
            if (Array.isArray(availObjOrArr)) return { [activeWeekKey]: normalizeAvailabilityArray(availObjOrArr) };
            if (availObjOrArr && typeof availObjOrArr === "object") {
                const res = {};
                for (const wk in availObjOrArr) res[wk] = normalizeAvailabilityArray(availObjOrArr[wk]);
                return res;
            }
            return { [activeWeekKey]: ["", "", "", "", "", "", ""] };
        }

        function getPlayerWeekAvailability(player, weekKey) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) return normalizeAvailabilityArray(player.availability);
            if (typeof player.availability === "object") return normalizeAvailabilityArray(player.availability[weekKey]);
            return ["", "", "", "", "", "", ""];
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const currentWeekKey = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            return {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "").trim(),
                position: String(player.position || player["AD/AP"] || "").trim(),
                groupId: String(player.groupId || "").trim(),
                availability: normalizePlayerAvailability(player.availability, currentWeekKey),
                note: String(player.note || player["備註"] || "").trim()
            };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            if (!data || typeof data !== "object") return { activeWeek: defaultWeekKey, pool: [], weeksData: {} };
            let activeWeek = typeof data.activeWeek === "string" && data.activeWeek ? data.activeWeek : defaultWeekKey;
            const pool = Array.isArray(data.pool) ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean) : [];
            return { activeWeek, weeksData: data.weeksData || {}, pool };
        }

        function applyFirebaseDataToLocal(data) {
            const normalized = normalizeFirebaseData(data);
            state.activeWeek = normalized.activeWeek;
            state.pool = normalized.pool;
            state.weeksData = normalized.weeksData;
        }

        function saveLocalState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData }));
            } catch (e) {}
        }

        function loadLocalState() {
            try {
                applyFirebaseDataToLocal(JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"));
            } catch (e) { applyFirebaseDataToLocal(null); }
            render();
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const localData = normalizeFirebaseData({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData });
                if (mutator(localData) !== false) {
                    applyFirebaseDataToLocal(localData);
                    saveLocalState();
                    render();
                }
                return;
            }
            try {
                const ref = database.ref(FIREBASE_PATH);
                const res = await ref.transaction(curr => {
                    const fresh = curr === null ? { activeWeek: state.activeWeek, pool: [], weeksData: {} } : normalizeFirebaseData(curr);
                    return mutator(fresh) === false ? curr : fresh;
                });
                if (res && res.snapshot) {
                    applyFirebaseDataToLocal(res.snapshot.val());
                    render();
                }
            } catch (e) { alert("同步失敗，請檢查網路連線。"); }
        }

        function initFirebaseListener() {
            if (!firebaseEnabled) { loadLocalState(); return; }
            database.ref(FIREBASE_PATH).on("value", snapshot => {
                applyFirebaseDataToLocal(snapshot.val());
                render();
            });
        }

        function selectWeek(weekKey) {
            if (!weekKey) return;
            transactionUpdate(data => { data.activeWeek = weekKey; return true; });
        }

        function switchWeekRelative(delta) {
            const parts = state.activeWeek.split('-').map(Number);
            const curr = parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();
            curr.setDate(curr.getDate() + delta * 7);
            selectWeek(formatDateKey(curr));
        }

        function jumpToCurrentWeek() { selectWeek(formatDateKey(getTuesdayOfWeek())); }

        function getJobColorClass(job) {
            switch (job) {
                case "黑騎士": case "聖騎士": case "英雄": return "bg-rose-900/80 border-rose-500 text-rose-200 font-bold";
                case "火毒": case "冰雷": case "主教": return "bg-sky-900/80 border-sky-500 text-sky-200 font-bold";
                case "箭神": case "神射手": return "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold";
                case "夜使者": case "暗影神偷": return "bg-orange-900/80 border-orange-500 text-orange-200 font-bold";
                case "槍神": case "拳霸": return "bg-emerald-900/80 border-emerald-500 text-emerald-200 font-bold";
                default: return "bg-slate-900 border-slate-800 text-slate-400";
            }
        }

        function getJobOptionStyle(job) {
            switch (job) {
                case "黑騎士": case "聖騎士": case "英雄": return "background-color: #881337; color: #fecdd3;";
                case "火毒": case "冰雷": case "主教": return "background-color: #075985; color: #bae6fd;";
                case "箭神": case "神射手": return "background-color: #701a75; color: #f5d0fe;";
                case "夜使者": case "暗影神偷": return "background-color: #7c2d12; color: #ffedd5;";
                case "槍神": case "拳霸": return "background-color: #064e3b; color: #a7f3d0;";
                default: return "background-color: #0f172a; color: #94a3b8;";
            }
        }

        function renderJobSelectOptions(currentJob) {
            let html = `<option value="" style="background-color: #0f172a; color: #94a3b8;" ${!currentJob ? "selected" : ""}>職業</option>`;
            JOB_LIST.forEach(job => {
                html += `<option value="${job}" style="${getJobOptionStyle(job)}" ${currentJob === job ? "selected" : ""}>${job}</option>`;
            });
            return html;
        }

        function renderGroupSelectOptions(currentGroupId) {
            let html = `<option value="" class="bg-slate-900 text-slate-500" ${!currentGroupId ? "selected" : ""}>無綁定</option>`;
            for (let i = 1; i <= 10; i++) {
                html += `<option value="g${i}" class="bg-slate-900 text-amber-400 font-bold" ${currentGroupId === `g${i}` ? "selected" : ""}>本/分號 ${i}</option>`;
            }
            return html;
        }

        function updatePlayerField(id, field, val) {
            const norm = field === "level" ? normalizeLevel(val) : String(val || "");
            transactionUpdate(data => {
                const p = data.pool.find(x => String(x.id) === String(id));
                if (p) p[field] = norm;
                return true;
            });
        }

        function updatePlayerAvailability(id, dayIdx, val) {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                const p = data.pool.find(x => String(x.id) === String(id));
                if (p) {
                    if (!p.availability) p.availability = {};
                    if (Array.isArray(p.availability)) p.availability = { [wk]: [...p.availability] };
                    if (!p.availability[wk]) p.availability[wk] = ["", "", "", "", "", "", ""];
                    p.availability[wk][dayIdx] = String(val || "");
                }
                return true;
            });
        }

        function addEmptyPoolPlayer() {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                data.pool.push({
                    id: makeId(), level: "", name: "", job: "", position: "", groupId: "",
                    availability: { [wk]: ["", "", "", "", "", "", ""] }, note: ""
                });
                return true;
            });
        }

        function deletePoolPlayer(id) {
            const p = state.pool.find(x => String(x.id) === String(id));
            if (!p || !confirm(`確定要刪除「${p.name || '未命名'}」嗎？`)) return;
            transactionUpdate(data => {
                data.pool = data.pool.filter(x => String(x.id) !== String(id));
                return true;
            });
        }

        function sortPoolBy(field) {
            if (poolSortState.field === field) {
                poolSortState.direction = poolSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                poolSortState.field = field;
                poolSortState.direction = field === 'level' ? 'desc' : 'asc';
            }
            const dir = poolSortState.direction === 'asc' ? 1 : -1;
            transactionUpdate(data => {
                data.pool.sort((a, b) => {
                    if (field === 'level') return ((Number(getPlayerLevel(a)) || 0) - (Number(getPlayerLevel(b)) || 0)) * dir;
                    if (field === 'job') return String(a.job || '').localeCompare(String(b.job || ''), 'zh-TW') * dir;
                    return 0;
                });
                return true;
            });
        }

        function escapeHtml(v) {
            return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
        }

        function render() {
            const weekSelect = document.getElementById("week-select");
            if (weekSelect) {
                const keys = Array.from(new Set([...Object.keys(state.weeksData || {}), state.activeWeek])).sort();
                weekSelect.innerHTML = keys.map(k => `<option value="${k}" ${k === state.activeWeek ? "selected" : ""}>${getWeekDisplayTitle(k)}</option>`).join("");
            }

            const getSortIcon = f => poolSortState.field !== f ? '↕️' : (poolSortState.direction === 'asc' ? '▲' : '▼');

            let html = `
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
                        <h2 class="flex items-center gap-2 text-lg font-bold text-slate-200"><span>👥</span> 總名單成員（檢視週別：<span class="text-blue-400">${getWeekDisplayTitle(state.activeWeek)}</span>）</h2>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                                <span class="text-slate-400 px-1">排序：</span>
                                <button onclick="sortPoolBy('level')" class="rounded border border-slate-700 bg-slate-800 px-2 py-0.5 text-slate-200 hover:bg-slate-700">等級 ${getSortIcon('level')}</button>
                                <button onclick="sortPoolBy('job')" class="rounded border border-slate-700 bg-slate-800 px-2 py-0.5 text-slate-200 hover:bg-slate-700">職業 ${getSortIcon('job')}</button>
                            </div>
                            <button onclick="addEmptyPoolPlayer()" class="rounded-lg border border-blue-600/50 bg-blue-600/20 px-3 py-1 text-xs font-semibold text-blue-300 hover:bg-blue-600/40">➕ 新增成員</button>
                            <span class="rounded-full bg-blue-950 px-2.5 py-1 text-xs font-semibold text-blue-400">${state.pool.length} 人</span>
                        </div>
                    </div>
                    <div id="pool-list" class="flex flex-col gap-2">
            `;

            if (state.pool.length === 0) {
                html += `<p class="py-6 text-center text-sm text-slate-500">目前總名單為空，請點擊上方「新增成員」。</p>`;
            } else {
                state.pool.forEach((player, index) => {
                    const level = getPlayerLevel(player);
                    const availArr = getPlayerWeekAvailability(player, state.activeWeek);
                    html += `
                        <div data-id="${escapeHtml(player.id)}" class="flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 p-2.5 text-sm">
                            <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                                <span class="text-xs font-semibold text-slate-500 w-6">#${index + 1}</span>
                                <div class="flex items-center">
                                    <span class="text-xs text-slate-500">Lv.</span>
                                    <input type="text" value="${escapeHtml(level)}" placeholder="-" maxlength="3" inputmode="numeric" onchange="updatePlayerField('${player.id}', 'level', this.value)" class="w-8 rounded border border-slate-800 bg-slate-900 px-1 py-0.5 text-center text-xs font-semibold text-blue-400">
                                </div>
                                <select onchange="updatePlayerField('${player.id}', 'job', this.value)" class="w-20 rounded border px-1 py-0.5 text-xs ${getJobColorClass(player.job)}">
                                    ${renderJobSelectOptions(player.job)}
                                </select>
                                <input type="text" value="${escapeHtml(player.name)}" placeholder="名字" onchange="updatePlayerField('${player.id}', 'name', this.value)" class="w-20 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs font-bold text-slate-200">
                                <input type="text" value="${escapeHtml(player.position)}" placeholder="AD/AP" onchange="updatePlayerField('${player.id}', 'position', this.value)" class="w-14 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-300">
                                
                                <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded border border-slate-800/80">
                                    ${WEEKDAYS.map((day, i) => `
                                        <div class="flex flex-col items-center">
                                            <span class="text-[10px] text-blue-400 font-semibold mb-0.5">${day}</span>
                                            <select onchange="updatePlayerAvailability('${player.id}', ${i}, this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-0.5 py-0.5 text-[11px] text-slate-200">
                                                <option value="" ${availArr[i] === "" ? "selected" : ""}></option>
                                                <option value="20:00~" ${availArr[i] === "20:00~" ? "selected" : ""}>20:00~</option>
                                                <option value="21:00~" ${availArr[i] === "21:00~" ? "selected" : ""}>21:00~</option>
                                            </select>
                                        </div>
                                    `).join("")}
                                </div>

                                <select onchange="updatePlayerField('${player.id}', 'groupId', this.value)" class="w-20 rounded border border-amber-900/80 bg-amber-950/40 px-1 py-0.5 text-xs text-amber-300">
                                    ${renderGroupSelectOptions(player.groupId)}
                                </select>

                                <input type="text" value="${escapeHtml(player.note || '')}" placeholder="備註" onchange="updatePlayerField('${player.id}', 'note', this.value)" class="w-32 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400">
                            </div>
                            <button onclick="deletePoolPlayer('${player.id}')" class="ml-2 rounded bg-slate-900 border border-slate-800 px-2.5 py-1 text-xs text-rose-400 hover:bg-rose-950 transition">✕ 刪除</button>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            document.getElementById("master-view-container").innerHTML = html;
        }

        initFirebaseListener();
    </script>
</body>
</html>
