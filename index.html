<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 突襲報名</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .share-export-title {
            font-size: 34px;
            font-weight: 900;
            text-align: center;
            padding: 4px 20px 8px;
            color: #f8fafc;
            letter-spacing: 2px;
        }

        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: max-content;
            pointer-events: none;
        }
        .share-card-inner {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
            padding: 28px;
            background: #111111;
            color: #d1d5db;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        /* 匯出圖片的團隊欄位橫向排列；標題獨立放在最上方置中。 */
        .share-export-columns {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
        }
        .share-group-column {
            width: 330px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 14px 16px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .share-group-header-text {
            font-size: 22px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }
        .share-team-wrapper {
            display: flex;
            flex-direction: column;
        }
        .share-team-title-text {
            font-size: 17px;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 0px;
            margin-bottom: 3px;
            line-height: 21px;
        }
        .share-row-item {
            display: flex;
            align-items: center;
            min-height: 28px;
            height: 28px;
            padding: 0;
            line-height: 20px;
            font-size: 15px;
            color: #e5e7eb;
            margin-bottom: 1px;
            overflow: visible;
        }
        .share-divider-line {
            height: 1px;
            background-color: #3b82f6;
            margin: 6px 0;
            opacity: 0.8;
        }
        .share-col-level {
            width: 48px;
            text-align: right;
            margin-right: 6px;
            color: #93c5fd;
            font-weight: 600;
            flex-shrink: 0;
        }
        .share-col-job {
            width: 72px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .share-col-name {
            width: 110px;
            margin-right: 6px;
            overflow: visible;
            text-overflow: clip;
            white-space: nowrap;
            line-height: 20px;
            min-height: 20px;
            flex-shrink: 0;
        }
        .share-col-part {
            width: 60px;
            color: #fde047;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* 總名單獨立版：保留原始隊伍程式與資料結構，但畫面只顯示總名單。 */
        #btn-delete-week { display: none !important; }
        body > div > div.grid.grid-cols-3 { display: none !important; }
        #tab-content-master { display: block !important; }
        #tab-content-teams, #tab-content-teams2 { display: none !important; }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-7xl">
        <!-- 頂部標題區 -->
        <header class="mb-6 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wide text-blue-400 md:text-4xl">Artale 突襲報名</h1>
            <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
        </header>

        <!-- 週別切換區塊 -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none"></select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
                <button id="btn-delete-week" onclick="deleteCurrentWeek()" class="rounded-lg border border-rose-900 bg-rose-950/80 px-2.5 py-1.5 text-xs font-semibold text-rose-300 hover:bg-rose-900 transition">🗑️ 刪除此週</button>
            </div>
            <div class="text-xs text-slate-400">
                💡 切換週別時，<span class="text-blue-400 font-semibold">等級/職業/名字/ADAP</span> 全週保留，僅<span class="text-emerald-400 font-semibold">填寫時間與隊伍分配</span>按週獨立。
            </div>
        </div>

        <!-- 分頁切換區塊 -->
        <div class="mb-6 grid grid-cols-3 gap-2 rounded-xl border border-slate-800 bg-slate-900/90 p-1.5 shadow-md">
            <button id="tab-btn-master" onclick="switchTab('master')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>📋</span> 總名單 <span id="master-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0人</span>
            </button>
            <button id="tab-btn-teams" onclick="switchTab('teams')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>⚔️</span> 6人隊伍分配 <span id="teams-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0/18</span>
            </button>
            <button id="tab-btn-teams2" onclick="switchTab('teams2')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>⚔</span> 12人隊伍分配 <span id="teams2-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0/18</span>
            </button>
        </div>

        <!-- 主內容區 -->
        <main class="space-y-6">
            <!-- 總名單頁面 -->
            <div id="tab-content-master" class="space-y-6 hidden">
                <div id="master-view-container"></div>
            </div>

            <!-- 隊伍分配頁面 1 (6人) -->
            <div id="tab-content-teams" class="space-y-6 hidden">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-base font-bold text-slate-200">遠征團管理 (6人)</h2>
                    </div>
                    <div id="group-tabs" class="mt-4 flex flex-wrap gap-3"></div>
                </div>

                <!-- 隊伍管理操作列 -->
                <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900 px-5 py-3 shadow-sm">
                    <div class="text-xs text-slate-400">
                        📌 當前遠征團共有 <span id="current-teams-count" class="text-blue-400 font-bold">3</span> 支隊伍
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addTeamToCurrentGroup(false)" class="rounded-lg border border-emerald-800 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-900/50 transition">➕ 新增隊伍</button>
                        <button onclick="removeTeamFromCurrentGroup(false)" class="rounded-lg border border-rose-900 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-900 transition">➖ 減少最後一隊</button>
                    </div>
                </div>

                <div id="teams-cards-container" class="space-y-6"></div>
                <div id="teams-pool-container"></div>

                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <button onclick="openImageGenModal(false)" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                        <button onclick="clearCurrentGroup(false)" class="rounded-lg border border-slate-800 bg-slate-800 px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-700">🧹 清空當前團隊伍</button>
                    </div>
                </div>
            </div>

            <!-- 隊伍分配頁面 2 (12人，兩欄式緊湊版面) -->
            <div id="tab-content-teams2" class="space-y-6 hidden">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-base font-bold text-slate-200">遠征團管理 (12人)</h2>
                    </div>
                    <div id="group-tabs-2" class="mt-4 flex flex-wrap gap-3"></div>
                </div>

                <!-- 隊伍管理操作列 -->
                <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900 px-5 py-3 shadow-sm">
                    <div class="text-xs text-slate-400">
                        📌 當前遠征團共有 <span id="current-teams-count-2" class="text-blue-400 font-bold">3</span> 支隊伍
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addTeamToCurrentGroup(true)" class="rounded-lg border border-emerald-800 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-900/50 transition">➕ 新增隊伍</button>
                        <button onclick="removeTeamFromCurrentGroup(true)" class="rounded-lg border border-rose-900 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-900 transition">➖ 減少最後一隊</button>
                    </div>
                </div>

                <div id="teams-cards-container-2" class="space-y-6"></div>
                <div id="teams-pool-container-2"></div>

                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <button onclick="openImageGenModal(true)" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                        <button onclick="clearCurrentGroup(true)" class="rounded-lg border border-slate-800 bg-slate-800 px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-700">🧹 清空當前團隊伍</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 圖片匯出暫存容器 -->
    <div id="share-card"></div>

    <!-- 圖片預覽 Modal -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="relative flex max-h-[90vh] w-full max-w-5xl flex-col rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">團隊圖片預覽</h3>
                <button onclick="closeModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
            </div>
            <div class="mb-3 flex flex-wrap items-center gap-2 rounded-lg border border-slate-800 bg-slate-950 p-3">
                <span class="text-xs font-bold text-slate-300 mr-1">圖片標籤</span>
                <div id="image-export-title" class="flex flex-wrap gap-2"></div>
                <span class="text-xs text-slate-500">點一下立即更新圖片，標題會置中顯示在圖片最上方</span>
            </div>
            <div class="relative flex flex-1 items-center justify-center overflow-auto rounded-lg bg-slate-950 p-2">
                <img id="modal-img" class="max-h-[65vh] rounded object-contain shadow-lg" src="" alt="團隊圖片預覽">
            </div>
            <div class="mt-4 border-t border-slate-800 pt-4">
                <div id="image-day-buttons" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="mt-4 flex items-center justify-end gap-2 border-t border-slate-800 pt-4">
                <button id="btn-copy-img" onclick="copyModalImage()" class="rounded-lg border border-blue-600 bg-blue-600/20 px-3 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-600/40 transition-colors">📋 複製圖片</button>
                <button onclick="downloadModalImage()" class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500">💾 下載圖片</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 1. 常數與設定值
        // 這裡集中放 Firebase、週別、職業等固定設定。
        // ==========================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const STORAGE_KEY = "artale_party_local_v3";
        const MAX_GROUPS = 7;
        const GROUP_NAMES = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const WEEKDAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];
        
        const JOB_LIST = ["黑騎士", "英雄", "聖騎士", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        const JOB_STYLE_MAP = {
            "黑騎士":   { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "聖騎士":   { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "英雄":     { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "火毒":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "冰雷":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "主教":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "箭神":     { class: "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold", style: "background-color: #701a75; color: #f5d0fe;" },
            "神射手":   { class: "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold", style: "background-color: #701a75; color: #f5d0fe;" },
            "夜使者":   { class: "bg-orange-900/80 border-orange-500 text-orange-200 font-bold", style: "background-color: #7c2d12; color: #ffedd5;" },
            "暗影神偷": { class: "bg-orange-900/80 border-orange-500 text-orange-200 font-bold", style: "background-color: #7c2d12; color: #ffedd5;" },
            "槍神":     { class: "bg-emerald-900/80 border-emerald-500 text-emerald-200 font-bold", style: "background-color: #064e3b; color: #a7f3d0;" },
            "拳霸":     { class: "bg-emerald-900/80 border-emerald-500 text-emerald-200 font-bold", style: "background-color: #064e3b; color: #a7f3d0;" }
        };

        const DEFAULT_JOB_CLASS = "bg-slate-900 border-slate-800 text-slate-400";
        const DEFAULT_JOB_STYLE = "background-color: #0f172a; color: #94a3b8;";

        // ========================================== 
        // 共用標籤設定
        // 之後新增標籤，只要在這裡增加一筆即可。
        // key：玩家資料使用的欄位
        // filterLabel：總名單／成員名單的篩選文字
        // imageLabel：圖片標題按鈕文字
        // activeClass：標籤被選取時的顏色
        // ========================================== 
        const SHARED_TAGS = [
            { key: "treeKing", filterLabel: "樹王", imageLabel: "克雷塞爾『樹王』", activeClass: "bg-emerald-600 border-emerald-500 text-white", playerClass: "bg-emerald-950 border-emerald-600 text-emerald-300" },
            { key: "dragonKing", filterLabel: "龍王", imageLabel: "闇黑龍王『龍王』", activeClass: "bg-amber-600 border-amber-500 text-white", playerClass: "bg-amber-950 border-amber-500 text-amber-300" },
            { key: "hardLotus", filterLabel: "困拉", imageLabel: "『困難拉圖斯』", activeClass: "bg-pink-600 border-pink-500 text-white", playerClass: "bg-violet-950 border-violet-600 text-violet-300" },
            { key: "poisonButterfly", filterLabel: "毒蝴蝶", imageLabel: "艾畢奈亞『毒蝴蝶』", activeClass: "bg-violet-600 border-violet-500 text-white", playerClass: "bg-pink-950 border-pink-600 text-pink-300" },
            //{ key: "iceButterfly", filterLabel: "冰蝴蝶", imageLabel: "艾畢奈亞『冰蝴蝶』", activeClass: "bg-cyan-600 border-cyan-500 text-white", playerClass: "bg-cyan-950 border-cyan-600 text-cyan-300" }
        ];

        // ==========================================
        // 2. 全域狀態變數 (Global State)
        // ==========================================
        let database = null;
        let firebaseEnabled = false;
        let sortableInstances = [];
        let currentTab = "master";
        let previewImages = [];
        let currentImageIndex = 0;
        let poolSortState = { field: null, direction: 'desc' };
        let poolJobFilters = [];
        let poolTagFilter = "all";
        // 6人／12人隊伍頁面的成員名單日期篩選：-1=全部，0~6=週二~週一
        let poolDayFilter = -1;
        let pendingImageGenIsTeams2 = false;

        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            activeGroup: 0,
            activeGroup2: 0,
            filterAvailableOnly: true,
            pool: [],
            weeksData: {}
        };

        // ==========================================
        // 3. 通用工具與日期輔助函式 (Helper Utilities)
        // ==========================================
        function makeId() { 
            return Date.now() + "-" + Math.random().toString(36).substring(2, 10); 
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function isLevel(val) { 
            return /^(?:lv\.?\s*)?\d+$/i.test(String(val || "").trim()); 
        }

        function normalizeLevel(val) { 
            const match = String(val || "").trim().match(/\d+/); 
            return match ? match[0] : ""; 
        }

        function getPlayerLevel(player) {
            if (!player) return "";
            for (const v of [player.level, player.lv, player["等級"], player.levelText]) {
                if (isLevel(v)) return normalizeLevel(v);
            }
            return "";
        }

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            date.setDate(date.getDate() + ((day >= 2) ? (2 - day) : (2 - day - 7)));
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const [y, m, d] = weekKey.split('-').map(Number);
            if (!y) return weekKey;
            
            const start = new Date(y, m - 1, d);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            
            const rangeStr = `${start.getFullYear()} ${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')} ~ ${end.getMonth() + 1}/${String(end.getDate()).padStart(2, '0')}`;
            const thisKey = formatDateKey(getTuesdayOfWeek());
            
            if (weekKey === thisKey) return `${rangeStr} (本週)`;
            
            const nextTue = getTuesdayOfWeek(); 
            nextTue.setDate(nextTue.getDate() + 7);
            if (weekKey === formatDateKey(nextTue)) return `${rangeStr} (下週)`;
            
            const lastTue = getTuesdayOfWeek(); 
            lastTue.setDate(lastTue.getDate() - 7);
            if (weekKey === formatDateKey(lastTue)) return `${rangeStr} (上週)`;
            
            return rangeStr;
        }

        function getWeekday(date) {
            const parts = String(date).split("/");
            if (parts.length < 2) return "";
            const d = new Date(new Date().getFullYear(), Number(parts[0]) - 1, Number(parts[1]));
            return isNaN(d) ? "" : WEEKDAY_NAMES[d.getDay()];
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (el) { 
                el.className = `mt-1 ${className}`; 
                el.textContent = text; 
            }
        }

        // ==========================================
        // 4. 預設資料結構產生器 (Default Generators)
        // ==========================================
        function createDefaultTeams(isTeams2 = false) {
            // 6人隊伍預設「連14場」；12人隊伍預設「連7場」。
            const defaultCon = !isTeams2;
            return [
                { name: "第1隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] },
                { name: "第2隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] },
                { name: "第3隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] }
            ];
        }

        function createDefaultWeekGroups(weekKey, isTeams2 = false) {
            const [y, m, d] = (weekKey || formatDateKey(getTuesdayOfWeek())).split('-').map(Number);
            const startDate = y ? new Date(y, m - 1, d) : getTuesdayOfWeek();
            return Array.from({ length: MAX_GROUPS }, (_, i) => {
                const targetDate = new Date(startDate);
                targetDate.setDate(startDate.getDate() + i);
                return { teams: createDefaultTeams(isTeams2), date: `${targetDate.getMonth() + 1}/${targetDate.getDate()}` };
            });
        }

        function createEmptyFirebaseData() {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            return { 
                activeWeek: defaultWeekKey, 
                pool: [], 
                weeksData: { [defaultWeekKey]: { groups: createDefaultWeekGroups(defaultWeekKey, false), groups2: createDefaultWeekGroups(defaultWeekKey, true) } } 
            };
        }

        // ==========================================
        // 5. 資料規格化邏輯
        // Firebase / 舊資料載入時，統一整理成目前程式使用的格式。
        // ==========================================
        function normalizeAvailabilityArray(arr) {
            const def = ["", "", "", "", "", "", ""];
            return Array.isArray(arr) ? def.map((_, i) => typeof arr[i] === "string" ? arr[i] : "") : def;
        }

        function normalizePlayerAvailability(avail, wk) {
            if (Array.isArray(avail)) return { [wk]: normalizeAvailabilityArray(avail) };
            if (avail && typeof avail === "object") {
                const res = {};
                for (const k in avail) res[k] = normalizeAvailabilityArray(avail[k]);
                return res;
            }
            return { [wk]: ["", "", "", "", "", "", ""] };
        }

        function getPlayerWeekAvailability(player, wk) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) return normalizeAvailabilityArray(player.availability);
            return normalizeAvailabilityArray(player.availability[wk]);
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const wk = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            return {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "").trim(),
                position: String(player.position || player["AD/AP"] || "").trim(),
                rounds: String(player.rounds || "7").trim(),
                groupId: String(player.groupId || "").trim(),
                part: String(player.part || ""),
                treeKing: Boolean(player.treeKing), 
                dragonKing: Boolean(player.dragonKing), 
                ...Object.fromEntries(SHARED_TAGS.map(tag => [tag.key, Boolean(player[tag.key])])),
                availability: normalizePlayerAvailability(player.availability, wk),
                note: String(player.note || player["備註"] || "").trim()
            };
        }

        function normalizeGroupsData(rawGroups, wk, isTeams2 = false) {
            let groups = Array.isArray(rawGroups) ? rawGroups.slice(0, MAX_GROUPS) : [];
            const defGroups = createDefaultWeekGroups(wk, isTeams2);
            
            while (groups.length < MAX_GROUPS) {
                groups.push(defGroups[groups.length]);
            }

            return groups.map((g, idx) => {
                const teams = Array.isArray(g?.teams) ? g.teams.map((t, tIdx) => ({
                    name: t.name || `第${tIdx + 1}隊`,
                    emoji: t.emoji || "⚔️",
                    time: t.time || "20:00",
                    con: Boolean(t.con),
                    members: Array.isArray(t.members) ? t.members.map(p => normalizePlayer(p, wk)).filter(Boolean) : []
                })) : createDefaultTeams(isTeams2);
                
                return { teams, date: typeof g?.date === "string" && g.date ? g.date : defGroups[idx].date };
            });
        }

        function normalizeWeekGroupData(weekData, wk) {
            return {
                groups: normalizeGroupsData(weekData?.groups, wk, false),
                groups2: normalizeGroupsData(weekData?.groups2 || weekData?.groups, wk, true)
            };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            if (!data || typeof data !== "object") return createEmptyFirebaseData();
            
            const activeWeek = typeof data.activeWeek === "string" && data.activeWeek ? data.activeWeek : defaultWeekKey;
            const weeksData = {};
            
            if (data.weeksData && typeof data.weeksData === "object") {
                for (const wk in data.weeksData) {
                    weeksData[wk] = normalizeWeekGroupData(data.weeksData[wk], wk);
                }
            }
            if (!weeksData[activeWeek]) {
                weeksData[activeWeek] = { groups: createDefaultWeekGroups(activeWeek, false), groups2: createDefaultWeekGroups(activeWeek, true) };
            }
            
            const pool = Array.isArray(data.pool) ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean) : [];
            return { activeWeek, weeksData, pool };
        }

        function applyFirebaseDataToLocal(data) {
            const norm = normalizeFirebaseData(data);
            state = {
                activeWeek: norm.activeWeek,
                activeGroup: Math.min(Math.max(state.activeGroup || 0, 0), MAX_GROUPS - 1),
                activeGroup2: Math.min(Math.max(state.activeGroup2 || 0, 0), MAX_GROUPS - 1),
                filterAvailableOnly: typeof state.filterAvailableOnly === "boolean" ? state.filterAvailableOnly : true,
                pool: norm.pool,
                weeksData: norm.weeksData
            };
        }

        function currentWeekData() { 
            return state.weeksData[state.activeWeek] || { groups: createDefaultWeekGroups(state.activeWeek, false), groups2: createDefaultWeekGroups(state.activeWeek, true) }; 
        }
        
        function currentGroup(isTeams2 = false) { 
            const w = currentWeekData();
            return (isTeams2 ? w.groups2 : w.groups)[isTeams2 ? state.activeGroup2 : state.activeGroup] || { teams: createDefaultTeams(), date: "" }; 
        }

        // ==========================================
        // 6. 資料庫與狀態同步
        // Firebase 開啟時同步雲端；失敗時退回 localStorage。
        // ==========================================
        function saveLocalState() {
            try { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData })); 
            } catch(e) {}
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const local = normalizeFirebaseData(state);
                if (mutator(local) !== false) { 
                    applyFirebaseDataToLocal(local); 
                    saveLocalState(); 
                    render(); 
                }
                return;
            }
            try {
                const ref = database.ref(FIREBASE_PATH);
                const res = await ref.transaction(cur => {
                    const latest = normalizeFirebaseData(cur);
                    return mutator(latest) === false ? cur : latest;
                });
                if (res?.snapshot) { 
                    applyFirebaseDataToLocal(res.snapshot.val()); 
                    render(); 
                }
            } catch(err) { 
                alert("資料同步失敗"); 
            }
        }

        function initFirebaseListener() {
            try {
                if (typeof firebase !== "undefined" && !firebase.apps.length) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                }
                database = firebase.database();
                firebaseEnabled = true;
            } catch (error) {
                firebaseEnabled = false;
                setSyncStatus("⚠ Firebase 初始化失敗，使用本機儲存", "text-[11px] text-rose-400");
            }

            if (!firebaseEnabled) { 
                loadLocalState(); 
                return; 
            }

            database.ref(".info/connected").on("value", snap => {
                const isConn = snap.val() === true;
                setSyncStatus(isConn ? "☁ 已連線到 Firebase" : "☁ Firebase 連線中...", isConn ? "text-[11px] text-emerald-400" : "text-[11px] text-amber-400");
            });

            database.ref(FIREBASE_PATH).on("value", snap => { 
                applyFirebaseDataToLocal(snap.val()); 
                render(); 
            });
            
            database.ref(FIREBASE_PATH).transaction(cur => cur === null ? createEmptyFirebaseData() : cur);
        }

        function loadLocalState() {
            try { 
                applyFirebaseDataToLocal(JSON.parse(localStorage.getItem(STORAGE_KEY))); 
            } catch(e) { 
                applyFirebaseDataToLocal(null); 
            }
            render();
        }

        // ==========================================
        // 7. 商業邏輯運算
        // 隊伍限制、玩家是否已安排等「規則」集中在這裡。
        // ==========================================
        function getPlayerWeeklyTeamCount(playerId, weekData) {
            if (!weekData) return 0;
            let count = 0;
            const checkGroups = (gs) => {
                if (!gs) return;
                gs.forEach(group => {
                    (group.teams || []).forEach(team => {
                        if (team && team.members && team.members.some(p => String(p.id) === String(playerId))) {
                            count += team.con ? 2 : 1;
                        }
                    });
                });
            };
            checkGroups(weekData.groups);
            checkGroups(weekData.groups2);
            return count;
        }

        // ----------------------------------------------------------
        // 取得玩家在「12人隊伍」中的排隊狀態
        // 規則：只要玩家已經被排進本週任何一個 12 人隊伍，
        // 就不再顯示於 12 人頁面的「待排名單」。
        // 移出 12 人隊伍後，玩家會自動重新出現在名單。
        // ----------------------------------------------------------
        function isPlayerAssignedTo12Team(playerId, weekData) {
            if (!weekData?.groups2) return false;

            return weekData.groups2.some(group =>
                (group.teams || []).some(team =>
                    (team.members || []).some(member =>
                        String(member.id) === String(playerId)
                    )
                )
            );
        }

        function hasReachedWeeklyLimit(player, weekData) {
            const rounds = String(player.rounds || "7");
            const assignedCount = getPlayerWeeklyTeamCount(player.id, weekData);
            if (rounds === "14" && assignedCount >= 2) return true;
            if (rounds === "7" && assignedCount >= 1) return true;
            return false;
        }

        function sortPoolBy(field) {
            if (poolSortState.field === field) {
                poolSortState.direction = poolSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                poolSortState.field = field;
                poolSortState.direction = field === 'level' ? 'desc' : 'asc';
            }
            const dir = poolSortState.direction === 'asc' ? 1 : -1;

            transactionUpdate(data => {
                const groupsMap = new Map();
                data.pool.forEach((player, idx) => {
                    const gId = player.groupId ? String(player.groupId).trim() : null;
                    if (gId) {
                        if (!groupsMap.has(gId)) groupsMap.set(gId, []);
                        groupsMap.get(gId).push(player);
                    } else {
                        groupsMap.set(`_single_${idx}_${player.id}`, [player]);
                    }
                });

                const groupList = Array.from(groupsMap.values()).map(members => {
                    let sortKey;
                    if (field === 'level') {
                        const levels = members.map(m => Number(getPlayerLevel(m)) || 0);
                        sortKey = dir === 1 ? Math.min(...levels) : Math.max(...levels);
                    } else if (field === 'job') {
                        const getJobIndex = (jobName) => {
                            const idx = JOB_LIST.indexOf(jobName);
                            return idx === -1 ? 999 : idx;
                        };
                        const indices = members.map(m => getJobIndex(String(m.job || '')));
                        sortKey = dir === 1 ? Math.min(...indices) : Math.max(...indices);
                    }
                    return { members, sortKey };
                });

                groupList.sort((a, b) => {
                    if (field === 'level') return (a.sortKey - b.sortKey) * dir;
                    if (field === 'job') return (a.sortKey - b.sortKey) * dir;
                    return 0;
                });

                data.pool = [];
                groupList.forEach(group => data.pool.push(...group.members));
                return true;
            });
        }

        // ==========================================
        // 8. 介面事件處理與動作
        // 按鈕、拖曳、玩家資料修改等操作都在這裡。
        // ==========================================
        function toggleJobFilter(job) {
            const idx = poolJobFilters.indexOf(job);
            if (idx > -1) {
                poolJobFilters.splice(idx, 1);
            } else {
                poolJobFilters.push(job);
            }
            render();
        }

        function clearAllJobFilters() {
            poolJobFilters = [];
            render();
        }

        function setPoolTagFilter(val) {
            poolTagFilter = val;
            render();
        }

        function setPoolDayFilter(dayIdx) {
            poolDayFilter = Number(dayIdx);
            render();
        }

        function moveEntireTeamToTargetGroup(sTeamIdx, targetGroupIdx, isTeams2 = false) {
            if (targetGroupIdx === "" || isNaN(targetGroupIdx)) return;
            const targetGIdx = parseInt(targetGroupIdx, 10);
            const activeG = isTeams2 ? state.activeGroup2 : state.activeGroup;
            if (targetGIdx === activeG) {
                alert("該隊伍已經在當前星期！");
                return;
            }

            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const srcGroup = groupsArr[activeG];
                const targetGroup = groupsArr[targetGIdx];

                if (!srcGroup || !srcGroup.teams[sTeamIdx]) return false;

                const movingTeam = srcGroup.teams[sTeamIdx];
                if (!targetGroup.teams) targetGroup.teams = [];

                const emptyTeamIdx = targetGroup.teams.findIndex(t => !t.members || t.members.length === 0);

                if (emptyTeamIdx !== -1) {
                    targetGroup.teams[emptyTeamIdx].members = JSON.parse(JSON.stringify(movingTeam.members || []));
                    targetGroup.teams[emptyTeamIdx].con = Boolean(movingTeam.con);
                } else {
                    const newTeam = JSON.parse(JSON.stringify(movingTeam));
                    newTeam.name = `第${targetGroup.teams.length + 1}隊`;
                    targetGroup.teams.push(newTeam);
                }

                srcGroup.teams[sTeamIdx].members = [];
                srcGroup.teams[sTeamIdx].con = false;

                alert(`成功將【${movingTeam.name}】成員搬移至 ${GROUP_NAMES[targetGIdx]}！`);
                return true;
            });
        }

        function moveTeamToTeam(sTeamIdx, targetTeamIdxStr, isTeams2 = false) {
            if (targetTeamIdxStr === "") return;
            const targetTeamIdx = parseInt(targetTeamIdxStr, 10);
            if (sTeamIdx === targetTeamIdx) {
                alert("無法移動至同一隊！");
                return;
            }

            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const teams = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams;
                if (!teams[sTeamIdx] || !teams[targetTeamIdx]) return false;

                const sourceTeam = teams[sTeamIdx];
                const targetTeam = teams[targetTeamIdx];

                sourceTeam.members.forEach(member => {
                    if (!targetTeam.members.some(m => String(m.id) === String(member.id))) {
                        targetTeam.members.push(member);
                    }
                });

                sourceTeam.members = [];
                sourceTeam.con = false;
                return true;
            });
        }

        function getAvailableWeekKeys() {
            const set = new Set(Object.keys(state.weeksData || {}));
            const base = getTuesdayOfWeek();
            for (let i = -1; i <= 2; i++) {
                const d = new Date(base); 
                d.setDate(d.getDate() + i * 7);
                set.add(formatDateKey(d));
            }
            return Array.from(set).sort();
        }

        function selectWeek(wk) {
            if (!wk) return;
            transactionUpdate(data => {
                data.activeWeek = wk;
                if (!data.weeksData[wk]) data.weeksData[wk] = { groups: createDefaultWeekGroups(wk, false), groups2: createDefaultWeekGroups(wk, true) };
                return true;
            });
        }

        function switchWeekRelative(delta) {
            const [y, m, d] = state.activeWeek.split('-').map(Number);
            const t = y ? new Date(y, m - 1, d) : getTuesdayOfWeek();
            t.setDate(t.getDate() + delta * 7);
            selectWeek(formatDateKey(t));
        }

        function jumpToCurrentWeek() { 
            selectWeek(formatDateKey(getTuesdayOfWeek())); 
        }

        function deleteCurrentWeek() {
            const wk = state.activeWeek;
            if (!confirm(`確定要刪除「${getWeekDisplayTitle(wk)}」的週別資料嗎？`)) return;
            transactionUpdate(data => {
                delete data.weeksData[wk];
                data.activeWeek = formatDateKey(getTuesdayOfWeek());
                if (!data.weeksData[data.activeWeek]) data.weeksData[data.activeWeek] = { groups: createDefaultWeekGroups(data.activeWeek, false), groups2: createDefaultWeekGroups(data.activeWeek, true) };
                return true;
            });
        }

            else state.activeGroup = idx;

        function addTeamToCurrentGroup(isTeams2 = false) {
            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const g = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup];
                g.teams.push({ name: `第${g.teams.length + 1}隊`, emoji: "⚔️", time: "20:00", con: !isTeams2, members: [] });

        function removeTeamFromCurrentGroup(isTeams2 = false) {
            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const g = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup];
                if (g.teams.length === 0) {
                    alert("目前已經沒有隊伍！");
                    return false;
                }
                const lastTeam = g.teams[g.teams.length - 1];
                const hasMembers = lastTeam.members && lastTeam.members.length > 0;
                
                const msg = hasMembers 
                    ? `確定要移除【${lastTeam.name}】嗎？該隊伍內有 ${lastTeam.members.length} 名成員，移除後成員將回歸總名單。`
                    : `確定要移除【${lastTeam.name}】嗎？`;

                if (confirm(msg)) {
                    g.teams.pop();
                    return true;
                }
                return false;
            });

        function updateTeamName(tIdx, name, isTeams2 = false) {

                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;

                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx].time = String(time || "20:00");

            });

        function updateTeamCon(tIdx, con, isTeams2 = false) {
            transactionUpdate(data => { 
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx].con = Boolean(con); 
                return true;

        function updateGroupDate(idx, date, isTeams2 = false) {
            transactionUpdate(data => { 
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                groupsArr[idx].date = String(date); 
                return true; 
            });

        function updatePlayerField(id, field, val) {
            const norm = field === "level" ? normalizeLevel(val) : String(val);
            transactionUpdate(data => {
                const p = data.pool.find(item => String(item.id) === String(id));
                if (p) p[field] = norm;
                
                for (const wk in data.weeksData) {
                    const checkGs = (gs) => {
                        if (!gs) return;
                        gs.forEach(g => {
                            (g.teams || []).forEach(t => {
                                (t.members || []).forEach(m => { 
                                    if (String(m.id) === String(id)) m[field] = norm; 
                                });
                            });
                        });
                    };
                    checkGs(data.weeksData[wk].groups);
                    checkGs(data.weeksData[wk].groups2);
                }
                return true;
            });
        }

        // 新增：處理 6 人隊伍成員的前7 / 後7 場次勾選
        function updateTeamMemberPart(tIdx, mIdx, partVal, isTeams2 = false) {
            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const targetMember = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx].members[mIdx];
                if (targetMember) {
                    targetMember.part = targetMember.part === partVal ? "" : partVal;
                }
                return true;
            });

        function updateTeamMemberNote(tIdx, mIdx, val, isTeams2 = false) {
            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const targetMember = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx].members[mIdx];
                if (targetMember) {
                    targetMember.note = String(val || "");
                }
                return true;
            });
        }

        function updatePlayerTag(id, tagField, checked) {
            transactionUpdate(data => {
                const p = data.pool.find(item => String(item.id) === String(id));
                if (p) p[tagField] = Boolean(checked);
                
                for (const wk in data.weeksData) {
                    const checkGs = (gs) => {
                        if (!gs) return;
                        gs.forEach(g => {
                            (g.teams || []).forEach(t => {
                                (t.members || []).forEach(m => { 
                                    if (String(m.id) === String(id)) m[tagField] = Boolean(checked); 
                                });
                            });
                        });
                    };
                    checkGs(data.weeksData[wk].groups);
                    checkGs(data.weeksData[wk].groups2);
                }
                return true;
            });
        }

        function updatePlayerAvailability(id, dayIdx, val) {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                const update = (p) => {
                    if (!p.availability || Array.isArray(p.availability)) p.availability = { [wk]: ["", "", "", "", "", "", ""] };
                    if (!p.availability[wk]) p.availability[wk] = ["", "", "", "", "", "", ""];
                    p.availability[wk][dayIdx] = String(val);
                };
                
                const p = data.pool.find(item => String(item.id) === String(id));
                if (p) update(p);
                
                for (const w in data.weeksData) {
                    const checkGs = (gs) => {
                        if (!gs) return;
                        gs.forEach(g => {
                            (g.teams || []).forEach(t => {
                                (t.members || []).forEach(m => { 
                                    if (String(m.id) === String(id)) update(m); 
                                });
                            });
                        });
                    };
                    checkGs(data.weeksData[w].groups);
                    checkGs(data.weeksData[w].groups2);
                }
                return true;
            });
        }

        function addEmptyPoolPlayer() {
            transactionUpdate(data => {
                data.pool.push({
                    id: makeId(), level: "", name: "", job: "", position: "", rounds: "7", groupId: "", part: "",
                    treeKing: false, dragonKing: false,
                    availability: { [state.activeWeek]: ["", "", "", "", "", "", ""] }, note: ""
                });
                return true;
            });
        }

        function deletePoolPlayer(id) {
            if (!confirm("確定要刪除此成員嗎？")) return;
            transactionUpdate(data => {
                data.pool = data.pool.filter(p => String(p.id) !== String(id));
                for (const wk in data.weeksData) {
                    const cleanGs = (gs) => {
                        if (!gs) return;
                        gs.forEach(g => {
                            (g.teams || []).forEach(t => { 
                                t.members = (t.members || []).filter(m => String(m.id) !== String(id)); 
                            });
                        });
                    };
                    cleanGs(data.weeksData[wk].groups);
                    cleanGs(data.weeksData[wk].groups2);
                }
                return true;
            });
        }

        function sendToTeam(id, tIdx, isTeams2 = false) {
            transactionUpdate(data => {
                const p = data.pool.find(item => String(item.id) === String(id));
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const targetTeam = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx];
                
                // 12 人隊伍：同一玩家本週只能存在於 12 人隊伍中的一個安排。
                if (isTeams2 && isPlayerAssignedTo12Team(id, wData)) {
                    alert("此玩家已排入本週 12 人隊伍，請先從原隊伍移除後再重新安排！");
                    return false;
                }

                if (hasReachedWeeklyLimit(p, wData)) {
                    alert("此玩家本週已達出賽上限！");
                    return false;
                }
                if (targetTeam.members.some(m => String(m.id) === String(id))) return false;
                
                const newMember = { ...p };
                if (isTeams2) {
                    newMember.note = "";
                }

                targetTeam.members.push(newMember);
                return true; 
            });
        }

        function removeFromTeam(tIdx, mIdx, isTeams2 = false) {
            transactionUpdate(data => { 
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams[tIdx].members.splice(mIdx, 1); 
                return true; 
            });
        }

            const teamTypeText = isTeams2 ? "12人團隊" : "6人團隊";
            if (!confirm(`確定要清空當前${teamTypeText}的所有隊伍成員嗎？`)) return;
            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                (groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams || []).forEach(t => { 
                    t.members = []; 
                    t.time = "20:00"; 
                    t.con = false; 
                });
                return true; 
            });
        }

            let html = `<option value="" class="bg-slate-900 text-slate-500" ${!currentGroupId ? "selected" : ""}>選擇大小號</option>`;
            for (let i = 1; i <= 50; i++) {
                const gKey = `g${i}`;
                const isUsed = usedGroupMap.has(gKey);
                const usedByName = isUsed ? usedGroupMap.get(gKey) : '';
                
                const label = isUsed ? `大小號 ${i} (已使用${usedByName ? ': ' + usedByName : ''})` : `大小號 ${i}`;
                const optionClass = isUsed ? "bg-slate-900 text-slate-500 italic" : "bg-slate-900 text-amber-400 font-bold";

                    html += `
                        <div data-id="${escapeHtml(player.id)}" class="drag-item flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 p-2.5 text-sm">
                            <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                                <span class="text-xs text-slate-500">#${idx + 1}</span>
                                
                                <input type="text" value="${escapeHtml(getPlayerLevel(player))}" maxlength="3" onchange="updatePlayerField('${player.id}', 'level', this.value)" class="w-8 rounded border border-slate-800 bg-slate-900 px-1 py-0.5 text-center text-xs text-blue-400">
                                
                                <select onchange="updatePlayerField('${player.id}', 'job', this.value)" class="w-20 rounded border px-1 py-0.5 text-xs ${getJobColorClass(player.job)}">
                                    ${renderJobSelectOptions(player.job)}
                                </select>
                                
                                <input type="text" value="${escapeHtml(player.name)}" onchange="updatePlayerField('${player.id}', 'name', this.value)" class="w-20 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-200 font-bold">
                                
                                <input type="text" value="${escapeHtml(player.position)}" placeholder="AD/AP" onchange="updatePlayerField('${player.id}', 'position', this.value)" class="w-14 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-300">
                                
                                <select onchange="updatePlayerField('${player.id}', 'groupId', this.value)" class="w-32 rounded border border-amber-900 bg-amber-950/40 px-1 py-0.5 text-xs text-amber-300">
                                    ${renderGroupSelectOptions(player.groupId, player.id)}
                                </select>

                                <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded border border-slate-800">${renderAvailabilitySelects(player)}</div>

                                <select onchange="updatePlayerField('${player.id}', 'rounds', this.value)" class="rounded border border-slate-700 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-200">
                                    <option value="7" ${player.rounds === "7" ? "selected" : ""}>7場</option>
                                    <option value="14" ${player.rounds === "14" ? "selected" : ""}>14場</option>
                                </select>

                                <div class="flex items-center gap-1.5">
                                    ${SHARED_TAGS.map(tag => `
                                        <label class="flex items-center gap-1 text-[11px] px-2 py-0.5 rounded border cursor-pointer ${player[tag.key] ? tag.playerClass + ' font-bold' : 'bg-slate-900 border-slate-800 text-slate-500'}">
                                            <input type="checkbox" ${player[tag.key] ? "checked" : ""} onchange="updatePlayerTag('${player.id}', '${tag.key}', this.checked)"> ${escapeHtml(tag.filterLabel)}
                                        </label>
                                    `).join('')}
                                </div>

                                <input type="text" value="${escapeHtml(player.note || '')}" placeholder="備註" onchange="updatePlayerField('${player.id}', 'note', this.value)" class="w-35 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400">
                            </div>
                            <div class="flex items-center gap-1 shrink-0 ml-2">
                                ${!isMasterView ? teams.map((t, tIdx) => `<button onclick="sendToTeam('${player.id}', ${tIdx},${isTeams2})" class="rounded border border-blue-900 bg-blue-950 px-2 py-1 text-xs text-blue-300">+${escapeHtml(t.name)}</button>`).join('') : ''}
                                <button onclick="deletePoolPlayer('${player.id}')" class="rounded bg-slate-900 border border-slate-800 px-2 py-1 text-xs text-rose-400">✕</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            return html;
        }

        // ==========================================
        // 10. 拖曳元件初始化
        // Sortable.js 負責總名單 ↔ 隊伍之間的拖曳。
        // ==========================================
        function initSortables() {
            sortableInstances.forEach(i => i.destroy());
            sortableInstances = [];
            
            document.querySelectorAll(".sortable-list").forEach(el => {
                if (el.closest(".hidden")) return;
                
                const inst = new Sortable(el, {
                    group: { name: "artale-shared-lists", pull: (to, from) => from.el.dataset.listType === "pool" ? "clone" : true },
                    draggable: ".drag-item",
                    animation: 150,
                    filter: "input, button, select",
                    preventOnFilter: false,
                    ghostClass: "sortable-ghost",
                    dragClass: "sortable-drag",
                    onEnd: function(evt) {
                        const fromType = evt.from.dataset.listType;
                        const toType = evt.to.dataset.listType;
                        const itemId = evt.item?.dataset?.id;
                        const newIndex = evt.newDraggableIndex ?? evt.newIndex;
                        
                        if (!itemId || (fromType === toType && evt.oldDraggableIndex === newIndex)) return;

                        transactionUpdate(data => {
                            const p = data.pool.find(item => String(item.id) === String(itemId));
                            if (!p) return false;
                            
                            if (fromType === "pool" && toType === "pool") {
                                data.pool = data.pool.filter(item => String(item.id) !== String(itemId));
                                data.pool.splice(newIndex, 0, p);
                                return true;
                            }
                            
                            const wData = data.weeksData[state.activeWeek];
                            const isT2 = toType.startsWith("team2_");
                            const groupsArr = isT2 ? wData.groups2 : wData.groups;
                            const targetGroup = groupsArr[isT2 ? state.activeGroup2 : state.activeGroup];
                            
                            if (fromType === "pool" && (toType.startsWith("team_") || toType.startsWith("team2_"))) {
                                const tIdx = parseInt(toType.replace(/team2?_/, ""), 10);
                                if (hasReachedWeeklyLimit(p, wData)) { 
                                    alert("已達本週出賽上限！"); 
                                    return false; 
                                }
                                const newMember = { ...p };
                                if (isT2) newMember.note = "";
                                targetGroup.teams[tIdx].members.splice(newIndex, 0, newMember);
                                return true;
                            }
                            
                            if ((fromType.startsWith("team_") || fromType.startsWith("team2_")) && (toType.startsWith("team_") || toType.startsWith("team2_"))) {
                                const fromIsT2 = fromType.startsWith("team2_");
                                const fromGroups = fromIsT2 ? wData.groups2 : wData.groups;
                                const sTeam = fromGroups[fromIsT2 ? state.activeGroup2 : state.activeGroup].teams[parseInt(fromType.replace(/team2?_/, ""), 10)].members;
                                const tTeam = targetGroup.teams[parseInt(toType.replace(/team2?_/, ""), 10)].members;
                                const idx = sTeam.findIndex(item => String(item.id) === String(itemId));
                                
                                if (idx > -1) {
                                    const [moved] = sTeam.splice(idx, 1);
                                    tTeam.splice(newIndex, 0, moved);
                                    return true;
                                }
                            }
                            return false;
                        });
                    }
                });
                sortableInstances.push(inst);
            });
        }

        // ==========================================
        // 11. 圖片匯出與 Modal 功能
        // 產生隊伍圖片、預覽、複製與下載。
        // ==========================================
        function formatShareHeader(isTeams2 = false) {
            return `
                <div class="share-row-item" style="border-bottom: 1px solid #334155; padding-bottom: 2px; margin-bottom: 4px; font-weight: 700; color: #94a3b8; font-size: 13px;">
                    <div class="share-col-level">等級</div>
                    <div class="share-col-job">職業</div>
                    <div class="share-col-name">名字</div>
                    <div class="share-col-part">${isTeams2 ? '位置' : '場次'}</div>
                </div>
            `;
        }

        function formatShareLine(player, isTeams2 = false) {
            const level = getPlayerLevel(player);
            let nameStr = player.name || "";
            if (nameStr.length > 7) {
                nameStr = nameStr.slice(0, 7);
            }

            let lastColText = "";
            if (isTeams2) {
                lastColText = player.note || "";
            } else {
                if (player.part === "first") lastColText = "前7場";
                else if (player.part === "second") lastColText = "後7場";
            }

            return `
                <div class="share-row-item">
                    <div class="share-col-level">${escapeHtml(level || "---")}</div>
                    <div class="share-col-job">${escapeHtml(player.job || "")}</div>
                    <div class="share-col-name">${escapeHtml(nameStr)}</div>
                    <div class="share-col-part">${escapeHtml(lastColText)}</div>
                </div>
            `;
        }

        let imageGenSelectedIndices = [];
        let imageGenerationToken = 0;
        // 圖片內標題：可在預覽視窗自行輸入，例如「樹王團」或「龍王團」。
        let imageExportTitle = "";

        function renderImageDayButtons() {
            const container = document.getElementById("image-day-buttons");
            if (!container) return;

            const wData = currentWeekData();
            const groupsArr = pendingImageGenIsTeams2 ? wData.groups2 : wData.groups;
            let html = "";

            groupsArr.forEach((group, gIdx) => {
                const teams = group.teams || [];
                const hasTeamWithMembers = teams.some(t => (t.members || []).length > 0);
                const selected = imageGenSelectedIndices.includes(gIdx);
                const dayName = GROUP_NAMES[gIdx];
                const dateStr = group.date ? ` (${group.date})` : "";

                html += `
                    <button onclick="toggleImageDay(${gIdx})"
                        ${hasTeamWithMembers ? '' : 'disabled'}
                        class="rounded-lg border px-3 py-1.5 text-xs font-semibold transition ${selected ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-700 bg-slate-800 text-slate-400 hover:bg-slate-700'} ${hasTeamWithMembers ? '' : 'opacity-60 cursor-not-allowed'}">
                        ${dayName}${dateStr}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        async function openImageGenModal(isTeams2 = false) {
            pendingImageGenIsTeams2 = isTeams2;
            const wData = currentWeekData();
            const groupsArr = isTeams2 ? wData.groups2 : wData.groups;

            imageGenSelectedIndices = [];
            groupsArr.forEach((group, gIdx) => {
                const teams = group.teams || [];
                if (teams.some(t => (t.members || []).length > 0)) {
                    imageGenSelectedIndices.push(gIdx);
                }
            });

            await generateSelectedTeamsImage(false);
        }

        function toggleImageDay(gIdx) {
            const index = imageGenSelectedIndices.indexOf(gIdx);
            if (index > -1) {
                imageGenSelectedIndices.splice(index, 1);
            } else {
                imageGenSelectedIndices.push(gIdx);
            }

            renderImageDayButtons();
            generateSelectedTeamsImage(true);
        }

        async function generateSelectedTeamsImage(showAlertOnEmpty = true) {
            const generationToken = ++imageGenerationToken;
            const isTeams2 = pendingImageGenIsTeams2;
            const selectedIndices = [...imageGenSelectedIndices].sort((a, b) => a - b);

            if (selectedIndices.length === 0) {
                if (showAlertOnEmpty) alert("請至少選擇一個要產生的日期！");
                return false;
            }

            if (typeof html2canvas === "undefined") return false;
            const shareCard = document.getElementById("share-card");
            const wData = currentWeekData();
            const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
            let columnsHtml = "", count = 0;
            const exportTitle = String(imageExportTitle || "").trim();
            const titleHtml = exportTitle
                ? `<div class="share-export-title">${escapeHtml(exportTitle)}</div>`
                : "";

            selectedIndices.forEach((gIdx) => {
                const group = groupsArr[gIdx];
                if (!group) return;
                const teams = group.teams || [];
                if (!teams.some(t => (t.members || []).length > 0)) return;

                let colHtml = `<div class="share-group-column"><div class="share-group-header-text">${escapeHtml(group.date ? `${GROUP_NAMES[gIdx]} -${group.date}` : GROUP_NAMES[gIdx])}</div>`;
                teams.forEach((team) => {
                    if ((team.members || []).length > 0) {
                        colHtml += `<div class="share-team-wrapper"><div class="share-team-title-text">${team.emoji || "⚔️"} ${escapeHtml(team.name)} (${escapeHtml(team.time || "20:00")}) (${team.members.length}人)${team.con ? " (連14場)" : " (連7場)"}</div>`;
                        colHtml += formatShareHeader(isTeams2);
                        team.members.forEach((p, pIdx) => {
                            if (isTeams2 && pIdx > 0 && pIdx % 6 === 0) {
                                colHtml += `<div class="share-divider-line"></div>`;
                            }
                            colHtml += formatShareLine(p, isTeams2);
                        });
                        colHtml += `</div>`;
                    }
                });
                colHtml += `</div>`;
                columnsHtml += colHtml;
                count++;
            });

            if (count === 0) {
                if (showAlertOnEmpty) alert("所選的日期中無任何隊伍可產生圖片！");
                return false;
            }

            shareCard.innerHTML = `<div class="share-card-inner">${titleHtml}<div class="share-export-columns">${columnsHtml}</div></div>`;
            try {
                await new Promise(r => requestAnimationFrame(r));
                const canvas = await html2canvas(shareCard.firstElementChild, { scale: 2, useCORS: true, backgroundColor: "#111111", logging: false });

                // 如果使用者已經切換到新的日期選擇，忽略這次較晚完成的舊圖片。
                if (generationToken !== imageGenerationToken) return false;

                previewImages = [{ title: `${exportTitle ? exportTitle + " - " : ""}${isTeams2 ? '12人' : '6人'}全部隊伍 (${getWeekDisplayTitle(state.activeWeek)})`, dataUrl: canvas.toDataURL("image/png") }];
            } catch(e) {
                if (generationToken === imageGenerationToken) {
                    alert("圖片產生失敗，請稍後再試！");
                }
                return false;
            } finally {
                if (generationToken === imageGenerationToken) {
                    shareCard.innerHTML = "";
                }
            }

            if (generationToken !== imageGenerationToken) return false;

            currentImageIndex = 0;
            renderImageDayButtons();
            showModal();
            return true;
        }

        function showModal() {
            updateModalContent();
            updateImageTitleTags();
            document.getElementById("image-modal").classList.remove("hidden");
        }

        // 圖片標籤採用「篩選標籤」樣式，點擊後立即重新產生圖片。
        // 新增標籤時，只要在 Modal 的 image-title-tag 區塊新增一個 button 即可。
        async function applyImageExportTitle(title) {
            imageExportTitle = String(title || "").trim();
            updateImageTitleTags();
            await generateSelectedTeamsImage(false);
        }

        function updateImageTitleTags() {
            const container = document.getElementById('image-export-title');
            if (!container) return;

            const tags = [
                { label: '不顯示', value: '' },
                ...SHARED_TAGS.map(tag => ({ label: tag.imageLabel, value: tag.imageLabel }))
            ];

            container.innerHTML = tags.map(tag => {
                const selected = String(tag.value) === String(imageExportTitle || '');
                return `
                    <button type="button" data-image-title="${escapeHtml(tag.value)}" onclick="applyImageExportTitle('${String(tag.value).replaceAll("'", "\\'")}')"
                        class="image-title-tag rounded-full border px-3 py-1.5 text-xs font-bold transition ${selected ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-700 bg-slate-800 text-slate-300 hover:border-blue-500 hover:text-white'}">
                        ${escapeHtml(tag.label)}
                    </button>
                `;
            }).join('');
        }

        function closeModal() { 
            document.getElementById("image-modal").classList.add("hidden"); 
        }

        function updateModalContent() {
            const item = previewImages[currentImageIndex];
            if (!item) return;
            document.getElementById("modal-img").src = item.dataUrl;
            document.getElementById("modal-title").innerText = `圖片預覽 - ${item.title}`;
        }

        async function copyModalImage() {
            const btn = document.getElementById("btn-copy-img");
            try {
                const blob = await (await fetch(previewImages[currentImageIndex].dataUrl)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                btn.innerText = "✓ 已複製！";
                setTimeout(() => btn.innerText = "📋 複製圖片", 1500);
            } catch(e) { 
                btn.innerText = "✕ 失敗"; 
            }
        }

        function downloadModalImage() {
            const link = document.createElement("a");
            link.download = `Artale_${previewImages[currentImageIndex].title}.png`;
            link.href = previewImages[currentImageIndex].dataUrl;
            link.click();
        }

        // ==========================================
        // 12. 主渲染進入點
        // 根據目前分頁、週別與隊伍資料更新整個畫面。
        // ==========================================
        function render() {
            const weekKeys = getAvailableWeekKeys();
            document.getElementById("week-select").innerHTML = weekKeys.map(wk => `<option value="${wk}" ${wk === state.activeWeek ? "selected" : ""}>${getWeekDisplayTitle(wk)}</option>`).join("");
            
            const wData = currentWeekData();
            
            let totalM = 0; 
            (wData.groups || []).forEach(g => (g.teams || []).forEach(t => totalM += (t.members?.length || 0)));

            let totalM2 = 0; 
            (wData.groups2 || []).forEach(g => (g.teams || []).forEach(t => totalM2 += (t.members?.length || 0)));

            document.getElementById("master-tab-badge").innerText = `${state.pool.length}人`;
            document.getElementById("teams-tab-badge").innerText = `${totalM}/18`;
            document.getElementById("teams2-tab-badge").innerText = `${totalM2}/18`;

            const curGroup6 = currentGroup(false);
            const curGroup12 = currentGroup(true);

            document.getElementById("current-teams-count").innerText = (curGroup6.teams || []).length;
            const count2 = document.getElementById("current-teams-count-2");
            if (count2) count2.innerText = (curGroup12.teams || []).length;

            const isMaster = currentTab === "master";
            const isTeams = currentTab === "teams";
            const isTeams2 = currentTab === "teams2";

            document.getElementById("tab-btn-master").className = `flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200 ${isMaster ? "bg-blue-600 text-white shadow-md" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`;
            document.getElementById("tab-btn-teams").className = `flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200 ${isTeams ? "bg-blue-600 text-white shadow-md" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`;
            document.getElementById("tab-btn-teams2").className = `flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200 ${isTeams2 ? "bg-blue-600 text-white shadow-md" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`;

            document.getElementById("tab-content-master").classList.toggle("hidden", !isMaster);
            document.getElementById("tab-content-teams").classList.toggle("hidden", !isTeams);
            document.getElementById("tab-content-teams2").classList.toggle("hidden", !isTeams2);

            if (isMaster) {
                document.getElementById("master-view-container").innerHTML = renderPool(true, false);
            } else if (isTeams) {
                document.getElementById("group-tabs").innerHTML = GROUP_NAMES.map((name, i) => {
                    const g = wData.groups[i];
                    const active = state.activeGroup === i;
                    return `
                        <div class="flex items-center gap-1">
                            <button onclick="selectGroup(${i}, false)" class="rounded-lg px-4 py-2 text-xs font-bold transition ${active ? 'bg-blue-600 text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                ${name}
                            </button>
                            <input type="text" value="${escapeHtml(g.date || '')}" placeholder="日期" onchange="updateGroupDate(${i}, this.value, false)" class="w-14 rounded border border-slate-700 bg-slate-950 px-1 py-2 text-center text-xs text-slate-300">
                        </div>
                    `;
                }).join("");
                document.getElementById("teams-cards-container").innerHTML = renderTeamsContainer(false);
                document.getElementById("teams-pool-container").innerHTML = renderPool(false, false);
            } else if (isTeams2) {
                document.getElementById("group-tabs-2").innerHTML = GROUP_NAMES.map((name, i) => {
                    const g = wData.groups2[i];
                    const active = state.activeGroup2 === i;
                    return `
                        <div class="flex items-center gap-1">
                            <button onclick="selectGroup(${i}, true)" class="rounded-lg px-4 py-2 text-xs font-bold transition ${active ? 'bg-blue-600 text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                ${name}
                            </button>
                            <input type="text" value="${escapeHtml(g.date || '')}" placeholder="日期" onchange="updateGroupDate(${i}, this.value, true)" class="w-14 rounded border border-slate-700 bg-slate-950 px-1 py-2 text-center text-xs text-slate-300">
                        </div>
                    `;
                }).join("");
                document.getElementById("teams-cards-container-2").innerHTML = renderTeamsContainer(true);
                document.getElementById("teams-pool-container-2").innerHTML = renderPool(false, true);
            }

            setTimeout(initSortables, 50);
        }

        window.addEventListener("DOMContentLoaded", () => {
            initFirebaseListener();
        });
    </script>
</body>
</html>
