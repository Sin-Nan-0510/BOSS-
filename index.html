<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 成員時間填寫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="mx-auto max-w-xl w-full rounded-xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
        <header class="mb-6 text-center">
            <h1 class="mb-2 text-2xl font-bold tracking-wide text-blue-400 md:text-3xl">
                Artale 成員資料與時間填寫
            </h1>
            <p id="sync-status" class="mt-1 text-xs text-slate-500">☁ Firebase 連線中...</p>
        </header>

        <!-- 週別切換 -->
        <div class="mb-6 flex items-center justify-between gap-3 rounded-lg border border-slate-800 bg-slate-950 p-3">
            <span class="text-xs font-bold text-slate-300">📅 選擇填寫週別：</span>
            <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-900 px-3 py-1 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none">
            </select>
        </div>

        <!-- 填寫表單 -->
        <form id="register-form" onsubmit="submitForm(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">名字 / ID <span class="text-rose-500">*</span></label>
                    <input type="text" id="input-name" required placeholder="請輸入您的遊戲名稱" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">等級 (Lv.)</label>
                    <input type="text" id="input-level" placeholder="例如: 120" maxlength="3" inputmode="numeric" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">職業</label>
                    <select id="input-job" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
                        <option value="">請選擇職業</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">AD / AP</label>
                    <input type="text" id="input-position" placeholder="例如: AD" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">本/分號綁定群組 (選填)</label>
                <select id="input-group-id" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-amber-400 font-bold focus:border-blue-500 focus:outline-none">
                    <option value="">無綁定 (獨立)</option>
                </select>
            </div>

            <!-- 每週時間填寫 -->
            <div class="rounded-lg border border-slate-800 bg-slate-950 p-3">
                <label class="block text-xs font-bold text-blue-400 mb-2">⏰ 本週各天可配合時間填寫：</label>
                <div id="availability-container" class="grid grid-cols-7 gap-1.5 text-center">
                    <!-- 動態生成週二~週一的時間選單 -->
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">備註</label>
                <input type="text" id="input-note" placeholder="選填備註說明" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
            </div>

            <!-- 識別身分以防覆蓋別人的資料 -->
            <div class="rounded-lg border border-amber-900/50 bg-amber-950/20 p-3 text-xs text-amber-300">
                💡 若您之前已經填寫過，請在上方「名字/ID」輸入與之前相同的名字，送出後將自動更新您的資料與時間！
            </div>

            <button type="submit" class="w-full rounded-lg bg-blue-600 py-3 text-sm font-bold text-white hover:bg-blue-500 transition shadow-lg">
                💾 儲存並送出我的資料
            </button>
            <div id="submit-msg" class="text-center text-xs font-semibold"></div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const JOB_LIST = ["黑騎士", "聖騎士", "英雄", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        let database = null;
        let globalData = null;
        let activeWeekKey = "";

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            let diffToTuesday = (day >= 2) ? (2 - day) : (2 - day - 7);
            date.setDate(date.getDate() + diffToTuesday);
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return weekKey;
            const start = new Date(parts[0], parts[1] - 1, parts[2]);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            const startM = String(start.getMonth() + 1).padStart(2, '0');
            const startD = String(start.getDate()).padStart(2, '0');
            const startW = weekdays[start.getDay()];
            const endM = end.getMonth() + 1;
            const endD = String(end.getDate()).padStart(2, '0');
            const endW = weekdays[end.getDay()];
            return `${start.getFullYear()} ${startM}/${startD}(${startW}) ~ ${endM}/${endD}(${endW})`;
        }

        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }

        function initPage() {
            // 初始化職業下拉
            const jobSelect = document.getElementById("input-job");
            JOB_LIST.forEach(j => {
                const opt = document.createElement("option");
                opt.value = j;
                opt.textContent = j;
                jobSelect.appendChild(opt);
            });

            // 初始化綁定群組下拉
            const groupSelect = document.getElementById("input-group-id");
            for (let i = 1; i <= 10; i++) {
                const opt = document.createElement("option");
                opt.value = `g${i}`;
                opt.textContent = `本/分號 ${i}`;
                groupSelect.appendChild(opt);
            }

            // 監聽名字輸入，若已存在則自動帶入其基本資料
            document.getElementById("input-name").addEventListener("blur", (e) => {
                const name = e.target.value.trim();
                if (!name || !globalData || !globalData.pool) return;
                const found = globalData.pool.find(p => p.name === name);
                if (found) {
                    if (found.level) document.getElementById("input-level").value = found.level;
                    if (found.job) document.getElementById("input-job").value = found.job;
                    if (found.position) document.getElementById("input-position").value = found.position;
                    if (found.groupId) document.getElementById("input-group-id").value = found.groupId;
                    if (found.note) document.getElementById("input-note").value = found.note;
                    renderAvailabilityInputs(found.availability);
                }
            });

            if (database) {
                database.ref(FIREBASE_PATH).on("value", snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        globalData = data;
                        activeWeekKey = data.activeWeek || formatDateKey(getTuesdayOfWeek());
                        updateWeekSelect();
                        renderAvailabilityInputs();
                    }
                });
            }
        }

        function updateWeekSelect() {
            const select = document.getElementById("week-select");
            const keysSet = new Set(Object.keys(globalData.weeksData || {}));
            keysSet.add(activeWeekKey);
            const baseTue = getTuesdayOfWeek();
            for (let offset = -1; offset <= 2; offset++) {
                const d = new Date(baseTue);
                d.setDate(d.getDate() + offset * 7);
                keysSet.add(formatDateKey(d));
            }
            const weekKeys = Array.from(keysSet).sort();

            select.innerHTML = weekKeys.map(wk => `
                <option value="${wk}" ${wk === activeWeekKey ? "selected" : ""}>${getWeekDisplayTitle(wk)}</option>
            `).join("");
        }

        function selectWeek(wk) {
            activeWeekKey = wk;
            const name = document.getElementById("input-name").value.trim();
            if (name && globalData && globalData.pool) {
                const found = globalData.pool.find(p => p.name === name);
                if (found) {
                    renderAvailabilityInputs(found.availability);
                    return;
                }
            }
            renderAvailabilityInputs();
        }

        function renderAvailabilityInputs(userAvailability = null) {
            const container = document.getElementById("availability-container");
            let availArr = ["", "", "", "", "", "", ""];

            if (userAvailability) {
                if (Array.isArray(userAvailability)) {
                    availArr = userAvailability;
                } else if (typeof userAvailability === "object" && userAvailability[activeWeekKey]) {
                    availArr = userAvailability[activeWeekKey];
                }
            }

            container.innerHTML = WEEKDAYS.map((day, i) => {
                const val = availArr[i] || "";
                return `
                    <div class="flex flex-col items-center">
                        <span class="text-[11px] font-semibold text-blue-400 mb-1">${day}</span>
                        <select id="avail-${i}" class="w-full rounded border border-slate-700 bg-slate-900 px-1 py-1 text-xs text-slate-200 focus:border-blue-500 focus:outline-none text-center">
                            <option value="" ${val === "" ? "selected" : ""}>-</option>
                            <option value="20:00~" ${val === "20:00~" ? "selected" : ""}>20:00~</option>
                            <option value="21:00~" ${val === "21:00~" ? "selected" : ""}>21:00~</option>
                        </select>
                    </div>
                `;
            }).join("");
        }

        async function submitForm(e) {
            e.preventDefault();
            if (!database) {
                alert("未連線至資料庫");
                return;
            }

            const name = document.getElementById("input-name").value.trim();
            const level = document.getElementById("input-level").value.trim();
            const job = document.getElementById("input-job").value;
            const position = document.getElementById("input-position").value.trim();
            const groupId = document.getElementById("input-group-id").value;
            const note = document.getElementById("input-note").value.trim();

            const weekAvail = [];
            for (let i = 0; i < 7; i++) {
                weekAvail.push(document.getElementById(`avail-${i}`).value);
            }

            const ref = database.ref(FIREBASE_PATH);
            try {
                await ref.transaction(currentData => {
                    if (!currentData) return currentData;
                    if (!currentData.pool) currentData.pool = [];

                    let player = currentData.pool.find(p => p.name === name);
                    if (!player) {
                        player = {
                            id: Date.now() + "-" + Math.random().toString(36).substring(2, 10),
                            name, level, job, position, groupId, note,
                            availability: {}
                        };
                        currentData.pool.push(player);
                    } else {
                        player.level = level;
                        player.job = job;
                        player.position = position;
                        player.groupId = groupId;
                        player.note = note;
                    }

                    if (!player.availability) player.availability = {};
                    if (Array.isArray(player.availability)) {
                        player.availability = { [currentData.activeWeek || activeWeekKey]: player.availability };
                    }
                    player.availability[activeWeekKey] = weekAvail;

                    return currentData;
                });

                const msgEl = document.getElementById("submit-msg");
                msgEl.className = "text-center text-xs font-semibold text-emerald-400 mt-3";
                msgEl.textContent = "✓ 資料與時間已成功送出！";
                setTimeout(() => { msgEl.textContent = ""; }, 3000);
            } catch (err) {
                console.error("儲存失敗", err);
                alert("儲存失敗，請再試一次。");
            }
        }

        initPage();
    </script>
</body>
</html>
