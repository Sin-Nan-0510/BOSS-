<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 遠征團與總名單管理</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: max-content;
            pointer-events: none;
        }
        .share-card-inner {
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 28px;
            background: #111111;
            color: #d1d5db;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .share-group-column {
            width: 380px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 20px;
            flex-shrink: 0;
        }
        .share-group-header-text {
            font-size: 22px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
        }
        .share-team-title-text {
            font-size: 17px;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 14px;
            margin-bottom: 6px;
        }
        .share-row-item {
            display: flex;
            align-items: center;
            font-size: 15px;
            line-height: 1.5;
            color: #e5e7eb;
            margin-bottom: 4px;
        }
        .share-col-level {
            width: 60px;
            text-align: right;
            margin-right: 12px;
            color: #93c5fd;
            font-weight: 600;
            flex-shrink: 0;
        }
        .share-col-job {
            width: 100px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .share-col-name {
            flex: 1;
            word-break: break-all;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-7xl">
        <header class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-wide text-blue-400 md:text-4xl flex items-center gap-2">
                    <span>⚔️</span> Artale 遠征團與總名單管理
                </h1>
                <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
            </div>
        </header>

        <!-- 週別切換區塊 -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none">
                </select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
                <button id="btn-delete-week" onclick="deleteCurrentWeek()" class="hidden rounded-lg border border-rose-900 bg-rose-950/80 px-2.5 py-1.5 text-xs font-semibold text-rose-300 hover:bg-rose-900 transition">🗑️ 刪除此週</button>
            </div>
            <div class="text-xs text-slate-400">
                💡 切換週別時，等級/職業/名字全週保留，僅<span class="text-emerald-400 font-semibold">填寫時間與隊伍分配</span>按週獨立。
            </div>
        </div>

        <main class="space-y-6">
            <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h2 class="text-base font-bold text-slate-200">遠征團管理</h2>
                </div>
                <div id="group-tabs" class="mt-4 flex flex-wrap gap-3"></div>
            </div>

            <div id="teams-cards-container" class="space-y-6"></div>
            <div id="teams-pool-container"></div>
            <div id="master-view-container"></div>

            <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <button onclick="generateAllTeamsImage()" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                    <button onclick="clearCurrentGroup()" class="rounded-lg border border-slate-800 bg-slate-800 px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-700">🧹 清空當前團隊伍</button>
                </div>
            </div>
        </main>
    </div>

    <div id="share-card"></div>

    <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="relative flex max-h-[90vh] w-full max-w-5xl flex-col rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">團隊圖片預覽</h3>
                <button onclick="closeModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
            </div>
            <div class="relative flex flex-1 items-center justify-center overflow-auto rounded-lg bg-slate-950 p-2">
                <img id="modal-img" class="max-h-[65vh] rounded object-contain shadow-lg" src="" alt="團隊圖片預覽">
            </div>
            <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800 pt-4">
                <div class="flex items-center gap-2">
                    <button id="btn-prev" onclick="changeImage(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700 disabled:opacity-40">◀ 上一頁</button>
                    <span id="modal-page-info" class="text-xs font-semibold text-slate-400">1 / 1</span>
                    <button id="btn-next" onclick="changeImage(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700 disabled:opacity-40">下一頁 ▶</button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-copy-img" onclick="copyModalImage()" class="rounded-lg border border-blue-600 bg-blue-600/20 px-3 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-600/40 transition-colors">📋 複製圖片</button>
                    <button onclick="downloadModalImage()" class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500">💾 下載圖片</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const STORAGE_KEY = "artale_party_local_v3";
        const MAX_GROUPS = 7;
        const MAX_TEAM_SIZE = 6;
        const GROUP_NAMES = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const JOB_LIST = ["黑騎士", "聖騎士", "英雄", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        let database = null;
        let firebaseEnabled = false;
        let sortableInstances = [];
        let copyBtnTimer = null;
        let previewImages = [];
        let currentImageIndex = 0;

        let poolSortState = { field: null, direction: 'desc' };
        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            activeGroup: 0,
            filterAvailableOnly: true,
            pool: [],
            weeksData: {}
        };

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            let diffToTuesday = (day >= 2) ? (2 - day) : (2 - day - 7);
            date.setDate(date.getDate() + diffToTuesday);
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return weekKey;
            const start = new Date(parts[0], parts[1] - 1, parts[2]);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            const year = start.getFullYear();
            const startM = String(start.getMonth() + 1).padStart(2, '0');
            const startD = String(start.getDate()).padStart(2, '0');
            const startW = weekdays[start.getDay()];
            const endM = end.getMonth() + 1;
            const endD = String(end.getDate()).padStart(2, '0');
            const endW = weekdays[end.getDay()];
            return `${year} ${startM}/${startD}(${startW}) ~${endM}/${endD}(${endW})`;
        }

        function isTwoWeeksAgoOrEarlier(weekKey) {
            if (!weekKey) return false;
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return false;
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const twoWeeksAgo = getTuesdayOfWeek();
            twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
            return targetDate <= twoWeeksAgo;
        }

        function makeId() {
            return Date.now() + "-" + Math.random().toString(36).substring(2, 10);
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (!el) return;
            el.className = `mt-1 ${className}`;
            el.textContent = text;
        }

        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            firebaseEnabled = true;
        } catch (error) {
            firebaseEnabled = false;
            setSyncStatus("⚠ Firebase 初始化失敗，使用本機儲存", "text-[11px] text-rose-400");
        }

        if (firebaseEnabled) {
            database.ref(".info/connected").on("value", snapshot => {
                if (snapshot.val() === true) {
                    setSyncStatus("☁ 已連線到 Firebase", "text-[11px] text-emerald-400");
                } else {
                    setSyncStatus("☁ Firebase 連線中...", "text-[11px] text-amber-400");
                }
            });
        }

        function isLevel(value) { return /^(?:lv\.?\s*)?\d+$/i.test(String(value || "").trim()); }
        function normalizeLevel(value) { const m = String(value || "").trim().match(/\d+/); return m ? m[0] : ""; }

        function getPlayerLevel(player) {
            if (!player) return "";
            for (const v of [player.level, player.lv, player["等級"]]) {
                if (isLevel(v)) return normalizeLevel(v);
            }
            return "";
        }

        function normalizeAvailabilityArray(arr) {
            const defaultArr = ["", "", "", "", "", "", ""];
            if (!Array.isArray(arr)) return defaultArr;
            return defaultArr.map((_, i) => typeof arr[i] === "string" ? arr[i] : "");
        }

        function normalizePlayerAvailability(availObjOrArr, activeWeekKey) {
            if (Array.isArray(availObjOrArr)) return { [activeWeekKey]: normalizeAvailabilityArray(availObjOrArr) };
            if (availObjOrArr && typeof availObjOrArr === "object") {
                const res = {};
                for (const wk in availObjOrArr) res[wk] = normalizeAvailabilityArray(availObjOrArr[wk]);
                return res;
            }
            return { [activeWeekKey]: ["", "", "", "", "", "", ""] };
        }

        function getPlayerWeekAvailability(player, weekKey) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) return normalizeAvailabilityArray(player.availability);
            if (typeof player.availability === "object") return normalizeAvailabilityArray(player.availability[weekKey]);
            return ["", "", "", "", "", "", ""];
        }

        function createDefaultWeekGroups(weekKey) {
            const parts = (weekKey || formatDateKey(getTuesdayOfWeek())).split('-').map(Number);
            const startDate = (parts.length === 3) ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();
            return Array.from({ length: MAX_GROUPS }, (_, i) => {
                const targetDate = new Date(startDate);
                targetDate.setDate(startDate.getDate() + i);
                return {
                    team1: [], team2: [], team3: [],
                    time1: "20:00", time2: "20:00", time3: "20:00",
                    date: `${targetDate.getMonth() + 1}/${targetDate.getDate()}`
                };
            });
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const currentWeekKey = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            return {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "").trim(),
                position: String(player.position || player["AD/AP"] || "").trim(),
                groupId: String(player.groupId || "").trim(),
                availability: normalizePlayerAvailability(player.availability, currentWeekKey),
                note: String(player.note || player["備註"] || "").trim()
            };
        }

        function normalizeWeekGroupData(weekData, weekKey) {
            let groups = Array.isArray(weekData?.groups) ? weekData.groups.slice(0, MAX_GROUPS) : [];
            const defaultGroups = createDefaultWeekGroups(weekKey);
            while (groups.length < MAX_GROUPS) groups.push(defaultGroups[groups.length]);
            groups = groups.map((group, idx) => {
                if (!group || typeof group !== "object") return defaultGroups[idx];
                return {
                    team1: Array.isArray(group.team1) ? group.team1.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    team2: Array.isArray(group.team2) ? group.team2.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    team3: Array.isArray(group.team3) ? group.team3.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    time1: group.time1 || "20:00",
                    time2: group.time2 || "20:00",
                    time3: group.time3 || "20:00",
                    date: group.date || defaultGroups[idx].date
                };
            });
            return { groups };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            if (!data || typeof data !== "object") return { activeWeek: defaultWeekKey, pool: [], weeksData: { [defaultWeekKey]: { groups: createDefaultWeekGroups(defaultWeekKey) } } };
            let activeWeek = typeof data.activeWeek === "string" && data.activeWeek ? data.activeWeek : defaultWeekKey;
            let weeksData = {};
            if (data.weeksData && typeof data.weeksData === "object") {
                for (const wk in data.weeksData) weeksData[wk] = normalizeWeekGroupData(data.weeksData[wk], wk);
            }
            if (!weeksData[activeWeek]) weeksData[activeWeek] = { groups: createDefaultWeekGroups(activeWeek) };
            const pool = Array.isArray(data.pool) ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean) : [];
            return { activeWeek, weeksData, pool };
        }

        function applyFirebaseDataToLocal(data) {
            const normalized = normalizeFirebaseData(data);
            state.activeWeek = normalized.activeWeek;
            state.activeGroup = Math.min(Math.max(state.activeGroup || 0, 0), MAX_GROUPS - 1);
            state.pool = normalized.pool;
            state.weeksData = normalized.weeksData;
        }

        function saveLocalState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData }));
            } catch (e) {}
        }

        function loadLocalState() {
            try { applyFirebaseDataToLocal(JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")); }
            catch (e) { applyFirebaseDataToLocal(null); }
            render();
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const localData = normalizeFirebaseData({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData });
                if (mutator(localData) !== false) {
                    applyFirebaseDataToLocal(localData);
                    saveLocalState();
                    render();
                }
                return;
            }
            try {
                const ref = database.ref(FIREBASE_PATH);
                const res = await ref.transaction(curr => {
                    const fresh = curr === null ? normalizeFirebaseData(null) : normalizeFirebaseData(curr);
                    return mutator(fresh) === false ? curr : fresh;
                });
                if (res && res.snapshot) {
                    applyFirebaseDataToLocal(res.snapshot.val());
                    render();
                }
            } catch (e) { alert("同步失敗，請檢查網路連線。"); }
        }

        function initFirebaseListener() {
            if (!firebaseEnabled) { loadLocalState(); return; }
            database.ref(FIREBASE_PATH).on("value", snapshot => {
                applyFirebaseDataToLocal(snapshot.val());
                render();
            });
        }

        function currentWeekData() {
            return (state.weeksData && state.weeksData[state.activeWeek]) || { groups: createDefaultWeekGroups(state.activeWeek) };
        }
        function currentGroup() { return currentWeekData().groups[state.activeGroup] || { team1: [], team2: [], team3: [], time1: "20:00", time2: "20:00", time3: "20:00", date: "" }; }

        function selectWeek(weekKey) {
            if (!weekKey) return;
            transactionUpdate(data => {
                data.activeWeek = weekKey;
                if (!data.weeksData[weekKey]) data.weeksData[weekKey] = { groups: createDefaultWeekGroups(weekKey) };
                return true;
            });
        }

        function switchWeekRelative(delta) {
            const parts = state.activeWeek.split('-').map(Number);
            const curr = parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();
            curr.setDate(curr.getDate() + delta * 7);
            selectWeek(formatDateKey(curr));
        }

        function jumpToCurrentWeek() { selectWeek(formatDateKey(getTuesdayOfWeek())); }

        function deleteCurrentWeek() {
            const targetWeek = state.activeWeek;
            if (!isTwoWeeksAgoOrEarlier(targetWeek) || !confirm(`確定要刪除此週的隊伍分配紀錄嗎？`)) return;
            const thisTue = formatDateKey(getTuesdayOfWeek());
            transactionUpdate(data => {
                if (data.weeksData) delete data.weeksData[targetWeek];
                data.activeWeek = thisTue;
                if (!data.weeksData[thisTue]) data.weeksData[thisTue] = { groups: createDefaultWeekGroups(thisTue) };
                return true;
            });
        }

        function selectGroup(idx) { state.activeGroup = idx; render(); }
        function toggleFilterAvailable() { state.filterAvailableOnly = !state.filterAvailableOnly; render(); }

        function updateTeamTime(teamName, time) {
            const wk = state.activeWeek, gIdx = state.activeGroup, tKey = teamName === "team1" ? "time1" : (teamName === "team2" ? "time2" : "time3");
            transactionUpdate(data => {
                const g = data.weeksData[wk]?.groups[gIdx];
                if (g) g[tKey] = String(time || "20:00").trim();
                return true;
            });
        }

        function updateGroupDate(idx, date) {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                const g = data.weeksData[wk]?.groups[idx];
                if (g) g.date = String(date || "").trim();
                return true;
            });
        }

        function updatePlayerField(id, field, val) {
            const norm = field === "level" ? normalizeLevel(val) : String(val || "");
            transactionUpdate(data => {
                const p = data.pool.find(x => String(x.id) === String(id));
                if (p) p[field] = norm;
                return true;
            });
        }

        function updatePlayerAvailability(id, dayIdx, val) {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                const p = data.pool.find(x => String(x.id) === String(id));
                if (p) {
                    if (!p.availability) p.availability = {};
                    if (Array.isArray(p.availability)) p.availability = { [wk]: [...p.availability] };
                    if (!p.availability[wk]) p.availability[wk] = ["", "", "", "", "", "", ""];
                    p.availability[wk][dayIdx] = String(val || "");
                }
                return true;
            });
        }

        function addEmptyPoolPlayer() {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                data.pool.push({
                    id: makeId(), level: "", name: "", job: "", position: "", groupId: "",
                    availability: { [wk]: ["", "", "", "", "", "", ""] }, note: ""
                });
                return true;
            });
        }

        function deletePoolPlayer(id) {
            const p = state.pool.find(x => String(x.id) === String(id));
            if (!p || !confirm(`確定要刪除「${p.name || '未命名'}」嗎？`)) return;
            transactionUpdate(data => {
                data.pool = data.pool.filter(x => String(x.id) !== String(id));
                return true;
            });
        }

        function sendToTeam(playerId, targetTeam) {
            const player = state.pool.find(p => String(p.id) === String(playerId));
            if (!player) return;
            const wk = state.activeWeek, gIdx = state.activeGroup;
            transactionUpdate(data => {
                const group = data.weeksData[wk]?.groups[gIdx];
                if (!group) return false;
                if (!group[targetTeam]) group[targetTeam] = [];
                if (group[targetTeam].length >= MAX_TEAM_SIZE) { alert("名額已滿！"); return false; }
                if (group[targetTeam].some(item => String(item.id) === String(player.id))) { alert("已在該隊伍中！"); return false; }
                group[targetTeam].push({ ...player });
                return true;
            });
        }

        function removeFromTeam(teamName, idx) {
            const wk = state.activeWeek, gIdx = state.activeGroup;
            transactionUpdate(data => {
                const g = data.weeksData[wk]?.groups[gIdx];
                if (g && g[teamName]) g[teamName].splice(idx, 1);
                return true;
            });
        }

        function clearCurrentGroup() {
            const wk = state.activeWeek, gIdx = state.activeGroup;
            if (!confirm(`確定要清空 ${GROUP_NAMES[gIdx]} 的隊伍成員嗎？`)) return;
            transactionUpdate(data => {
                const g = data.weeksData[wk]?.groups[gIdx];
                if (g) { g.team1 = []; g.team2 = []; g.team3 = []; g.time1 = "20:00"; g.time2 = "20:00"; g.time3 = "20:00"; }
                return true;
            });
        }

        function sortPoolBy(field) {
            if (poolSortState.field === field) {
                poolSortState.direction = poolSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                poolSortState.field = field;
                poolSortState.direction = field === 'level' ? 'desc' : 'asc';
            }
            const dir = poolSortState.direction === 'asc' ? 1 : -1;
            transactionUpdate(data => {
                data.pool.sort((a, b) => {
                    if (field === 'level') return ((Number(getPlayerLevel(a)) || 0) - (Number(getPlayerLevel(b)) || 0)) * dir;
                    if (field === 'job') return String(a.job || '').localeCompare(String(b.job || ''), 'zh-TW') * dir;
                    return 0;
                });
                return true;
            });
        }

                case "火毒": case "冰雷": case "主教": return "bg-sky-900/80 border-sky-500 text-sky-200 font-bold";
                case "箭神": case "神射手": return "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold";

        function initSortables() {
            sortableInstances.forEach(i => i.destroy());
            sortableInstances = [];
            document.querySelectorAll(".sortable-list").forEach(el => {
                const instance = new Sortable(el, {
                    group: {
                        name: "artale-shared-lists",
                        pull: (to, from) => from.el.dataset.listType === "pool" ? "clone" : true,
                        put: (to) => {
                            const t = to.el.dataset.listType;
                            if (t === "pool") return false;
                            const group = currentGroup();
                            return group && group[t] && group[t].length < MAX_TEAM_SIZE;
                        }
                    },
                    draggable: ".drag-item",
                    animation: 150,
                    ghostClass: "sortable-ghost",
                    dragClass: "sortable-drag",
                    onEnd: function(evt) {
                        const fromType = evt.from.dataset.listType;
                        const toType = evt.to.dataset.listType;
                        const itemId = evt.item?.dataset?.id;
                        const newIndex = evt.newDraggableIndex ?? evt.newIndex;
                        if (!itemId || !toType || typeof newIndex !== "number") return;

                        const wk = state.activeWeek, gIdx = state.activeGroup;
                        transactionUpdate(data => {
                            const poolPlayer = data.pool.find(p => String(p.id) === String(itemId));
                            if (!poolPlayer) return false;
                            const targetGroup = data.weeksData[wk]?.groups[gIdx];
                            if (!targetGroup) return false;

                            const isTargetTeam = ["team1", "team2", "team3"].includes(toType);
                            const isSourceTeam = ["team1", "team2", "team3"].includes(fromType);

                            if (fromType === "pool" && isTargetTeam) {
                                if (!targetGroup[toType]) targetGroup[toType] = [];
                                if (targetGroup[toType].length >= MAX_TEAM_SIZE) { alert("名額已滿！"); return false; }
                                if (targetGroup[toType].some(item => String(item.id) === String(poolPlayer.id))) { alert("已在該隊伍中！"); return false; }
                                targetGroup[toType].splice(Math.max(0, Math.min(newIndex, targetGroup[toType].length)), 0, { ...poolPlayer });
                                return true;
                            }
                            if (isSourceTeam && isTargetTeam) {
                                const sourceTeam = targetGroup[fromType] || [];
                                const targetTeam = targetGroup[toType] || [];
                                const itemIdx = sourceTeam.findIndex(p => String(p.id) === String(itemId));
                                if (itemIdx < 0) return false;
                                const [moved] = sourceTeam.splice(itemIdx, 1);
                                if (fromType !== toType && targetTeam.length >= MAX_TEAM_SIZE) { sourceTeam.splice(itemIdx, 0, moved); return false; }
                                targetTeam.splice(Math.max(0, Math.min(newIndex, targetTeam.length)), 0, moved);
                                return true;
                            }
                            return false;
                        });
                    }
                });
                sortableInstances.push(instance);
            });
        }

        async function generateAllTeamsImage() {
            if (typeof html2canvas === "undefined") return;
            const shareCard = document.getElementById("share-card");
            const wData = currentWeekData();
            let columnsHtml = "", count = 0;

            wData.groups.forEach((group, idx) => {
                const has1 = group.team1?.length > 0, has2 = group.team2?.length > 0, has3 = group.team3?.length > 0;
                if (!has1 && !has2 && !has3) return;
                const weekday = getWeekday(group.date);
                const headerText = group.date ? `${GROUP_NAMES[idx]} - ${group.date}${weekday ? `（${weekday}）` : ""}` : GROUP_NAMES[idx];

                let col = `<div class="share-group-column"><div class="share-group-header-text">${escapeHtml(headerText)}</div>`;
                [[has1, "team1", "第一隊", group.time1], [has2, "team2", "第二隊", group.time2], [has3, "team3", "第三隊", group.time3]].forEach(([has, tName, tTitle, tTime]) => {
                    if (has) {
                        col += `<div class="share-team-title-text">⚔️ ${tTitle} (${escapeHtml(tTime || "20:00")}) (${group[tName].length}人)</div>`;
                        col += `<div class="share-row-item" style="border-bottom:1px solid #334155;padding-bottom:4px;margin-bottom:6px;font-weight:700;color:#94a3b8;font-size:13px;"><div class="share-col-level">等級</div><div class="share-col-job">職業</div><div class="share-col-name">名字</div></div>`;
                        group[tName].forEach(p => {
                            col += `<div class="share-row-item"><div class="share-col-level">${escapeHtml(getPlayerLevel(p) || "---")}</div><div class="share-col-job">${escapeHtml(p.job || "")}</div><div class="share-col-name">${escapeHtml(p.name || "")}</div></div>`;
                        });
                    }
                });
                col += `</div>`;
                columnsHtml += col;
                count++;
            });

            if (count === 0) { alert("本週尚無任何已分配的隊伍可產生圖片！"); return; }
            previewImages = [];
            shareCard.innerHTML = `<div class="share-card-inner">${columnsHtml}</div>`;
            await new Promise(r => requestAnimationFrame(r));
            const canvas = await html2canvas(shareCard.firstElementChild, { scale: 2, useCORS: true, backgroundColor: "#111111" });
            previewImages.push({ title: `本週全部隊伍 (${getWeekDisplayTitle(state.activeWeek)})`, dataUrl: canvas.toDataURL("image/png") });
            shareCard.innerHTML = "";
            currentImageIndex = 0;
            document.getElementById("image-modal").classList.remove("hidden");
            updateModalContent();
        }

        function closeModal() { document.getElementById("image-modal").classList.add("hidden"); }
        function updateModalContent() {
            const item = previewImages[currentImageIndex];
            if (!item) return;
            document.getElementById("modal-img").src = item.dataUrl;
            document.getElementById("modal-title").innerText = `圖片預覽 - ${item.title}`;
            document.getElementById("modal-page-info").innerText = `${currentImageIndex + 1} / ${previewImages.length}`;
            document.getElementById("btn-prev").disabled = currentImageIndex === 0;
            document.getElementById("btn-next").disabled = currentImageIndex === previewImages.length - 1;
        }
        function changeImage(step) {
            if (currentImageIndex + step >= 0 && currentImageIndex + step < previewImages.length) {
                currentImageIndex += step;
                updateModalContent();
            }
        }
        async function copyModalImage() {
            const btn = document.getElementById("btn-copy-img");
            try {
                const res = await fetch(previewImages[currentImageIndex].dataUrl);
                const blob = await res.blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                btn.innerText = "✓ 已複製！";
                setTimeout(() => btn.innerText = "📋 複製圖片", 1500);
            } catch (e) { alert("複製圖片失敗"); }
        }
        function downloadModalImage() {
            const link = document.createElement("a");
            link.download = `Artale_Teams.png`;
            link.href = previewImages[currentImageIndex].dataUrl;
            link.click();
        }

        function render() {
            const weekSelect = document.getElementById("week-select");
            if (weekSelect) {
                const keys = Array.from(new Set([...Object.keys(state.weeksData || {}), state.activeWeek])).sort();
                weekSelect.innerHTML = keys.map(k => `<option value="${k}" ${k === state.activeWeek ? "selected" : ""}>${getWeekDisplayTitle(k)}</option>`).join("");
            }

            const deleteWeekBtn = document.getElementById("btn-delete-week");
            if (deleteWeekBtn) {
                if (isTwoWeeksAgoOrEarlier(state.activeWeek)) deleteWeekBtn.classList.remove("hidden");
                else deleteWeekBtn.classList.add("hidden");
            }

            const wData = currentWeekData();
            const tabs = document.getElementById("group-tabs");
            tabs.innerHTML = wData.groups.map((group, index) => {
                const weekday = getWeekday(group.date);
                return `
                    <div class="flex flex-col items-center gap-1.5 rounded-lg border border-slate-800 bg-slate-950 p-2.5">
                        <button onclick="selectGroup(${index})" class="rounded-md px-3.5 py-1.5 text-xs font-semibold transition ${index === state.activeGroup ? "bg-blue-600 text-white shadow-sm" : "bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800"}">${GROUP_NAMES[index]}</button>
                        <div class="flex items-center gap-1">
                            <input type="text" value="${escapeHtml(group.date || "")}" placeholder="9/8" maxlength="5" inputmode="numeric" onchange="updateGroupDate(${index}, this.value)" class="w-20 rounded border border-slate-800 bg-slate-900 px-2 py-1 text-center text-xs text-slate-200 focus:outline-none">
                            ${weekday ? `<span class="text-xs font-medium text-blue-400">(${weekday})</span>` : ""}
                        </div>
                    </div>
                `;
            }).join("");

            document.getElementById("teams-cards-container").innerHTML = 
                renderTeam("team1", "第一隊", "⚔️", "time1") + 
                renderTeam("team2", "第二隊", "⚔️", "time2") + 
                renderTeam("team3", "第三隊", "⚔️", "time3");
            document.getElementById("teams-pool-container").innerHTML = renderPool();
            document.getElementById("master-view-container").innerHTML = renderMasterView();

            initSortables();
        }

        initFirebaseListener();
    </script>
</body>
</html>
