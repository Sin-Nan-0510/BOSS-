<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 遠征團名單 (填寫)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-6xl">
        <!-- 頂部標題區 -->
        <header class="mb-6 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wide text-blue-400 md:text-4xl">Artale 遠征團名單</h1>
            <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
        </header>

        <!-- 週別切換區塊 -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none"></select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
            </div>
            <div class="text-xs text-slate-400">
                💡 請填寫您的基本資料與本週可配合時間。
            </div>
        </div>

        <!-- 主內容區：總名單表格/列表 -->
        <main class="space-y-6">
            <div id="master-view-container"></div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const STORAGE_KEY = "artale_party_local_master_v3";
        const MAX_GROUPS = 7;
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const JOB_LIST = ["黑騎士", "聖騎士", "英雄", "火毒", "冰雷", "主教", "箭神", "神射手", "夜使者", "暗影神偷", "槍神", "拳霸"];

        const JOB_STYLE_MAP = {
            "黑騎士":   { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "聖騎士":   { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "英雄":     { class: "bg-rose-900/80 border-rose-500 text-rose-200 font-bold",       style: "background-color: #881337; color: #fecdd3;" },
            "火毒":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "冰雷":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "主教":     { class: "bg-sky-900/80 border-sky-500 text-sky-200 font-bold",         style: "background-color: #075985; color: #bae6fd;" },
            "箭神":     { class: "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold", style: "background-color: #701a75; color: #f5d0fe;" },
            "神射手":   { class: "bg-fuchsia-900/80 border-fuchsia-500 text-fuchsia-200 font-bold", style: "background-color: #701a75; color: #f5d0fe;" },
            "夜使者":   { class: "bg-orange-900/80 border-orange-500 text-orange-200 font-bold", style: "background-color: #7c2d12; color: #ffedd5;" },
            "暗影神偷": { class: "bg-orange-900/80 border-orange-500 text-orange-200 font-bold", style: "background-color: #7c2d12; color: #ffedd5;" },
            "槍神":     { class: "bg-emerald-900/80 border-emerald-500 text-emerald-200 font-bold", style: "background-color: #064e3b; color: #a7f3d0;" },
            "拳霸":     { class: "bg-emerald-900/80 border-emerald-500 text-emerald-200 font-bold", style: "background-color: #064e3b; color: #a7f3d0;" }
        };

        const DEFAULT_JOB_CLASS = "bg-slate-900 border-slate-800 text-slate-400";
        const DEFAULT_JOB_STYLE = "background-color: #0f172a; color: #94a3b8;";

        let database = null;
        let firebaseEnabled = false;
        let poolSortState = { field: null, direction: 'desc' };

        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            pool: [],
            weeksData: {}
        };

        function makeId() { return Date.now() + "-" + Math.random().toString(36).substring(2, 10); }

        function escapeHtml(str) {
            return String(str ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function isLevel(val) { return /^(?:lv\.?\s*)?\d+$/i.test(String(val || "").trim()); }
        function normalizeLevel(val) { const match = String(val || "").trim().match(/\d+/); return match ? match[0] : ""; }

        function getPlayerLevel(player) {
            if (!player) return "";
            for (const v of [player.level, player.lv, player["等級"], player.levelText]) {
                if (isLevel(v)) return normalizeLevel(v);
            }
            return "";
        }

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            date.setDate(date.getDate() + ((day >= 2) ? (2 - day) : (2 - day - 7)));
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const [y, m, d] = weekKey.split('-').map(Number);
            if (!y) return weekKey;
            const start = new Date(y, m - 1, d);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const rangeStr = `${start.getFullYear()} ${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')} ~ ${end.getMonth() + 1}/${String(end.getDate()).padStart(2, '0')}`;
            const thisKey = formatDateKey(getTuesdayOfWeek());
            if (weekKey === thisKey) return `${rangeStr} (本週)`;
            return rangeStr;
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (el) { el.className = `mt-1 ${className}`; el.textContent = text; }
        }

        function normalizeAvailabilityArray(arr) {
            const def = ["", "", "", "", "", "", ""];
            return Array.isArray(arr) ? def.map((_, i) => typeof arr[i] === "string" ? arr[i] : "") : def;
        }

        function normalizePlayerAvailability(avail, wk) {
            if (Array.isArray(avail)) return { [wk]: normalizeAvailabilityArray(avail) };
            if (avail && typeof avail === "object") {
                const res = {};
                for (const k in avail) res[k] = normalizeAvailabilityArray(avail[k]);
                return res;
            }
            return { [wk]: ["", "", "", "", "", "", ""] };
        }

        function getPlayerWeekAvailability(player, wk) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) return normalizeAvailabilityArray(player.availability);
            return normalizeAvailabilityArray(player.availability[wk]);
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const wk = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            return {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || "").trim(),
                job: String(player.job || "").trim(),
                position: String(player.position || "").trim(),
                rounds: String(player.rounds || "7").trim(),
                groupId: String(player.groupId || "").trim(),
                availability: normalizePlayerAvailability(player.availability, wk),
                note: String(player.note || "").trim()
            };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            if (!data || typeof data !== "object") return { activeWeek: defaultWeekKey, pool: [], weeksData: {} };
            const activeWeek = typeof data.activeWeek === "string" && data.activeWeek ? data.activeWeek : defaultWeekKey;
            const pool = Array.isArray(data.pool) ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean) : [];
            return { activeWeek, pool, weeksData: data.weeksData || {} };
        }

        function applyFirebaseDataToLocal(data) {
            const norm = normalizeFirebaseData(data);
            state.activeWeek = norm.activeWeek;
            state.pool = norm.pool;
            state.weeksData = norm.weeksData;
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const local = normalizeFirebaseData(state);
                if (mutator(local) !== false) {
                    applyFirebaseDataToLocal(local);
                    render();
                }
                return;
            }
            try {
                const ref = database.ref(FIREBASE_PATH);
                const res = await ref.transaction(cur => {
                    const latest = normalizeFirebaseData(cur);
                    return mutator(latest) === false ? cur : latest;
                });
                if (res?.snapshot) {
                    applyFirebaseDataToLocal(res.snapshot.val());
                    render();
                }
            } catch(err) {
                alert("資料同步失敗");
            }
        }

        function initFirebaseListener() {
            try {
                if (typeof firebase !== "undefined" && !firebase.apps.length) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                }
                database = firebase.database();
                firebaseEnabled = true;
            } catch (error) {
                firebaseEnabled = false;
                setSyncStatus("⚠ Firebase 初始化失敗", "text-[11px] text-rose-400");
            }

            if (!firebaseEnabled) return;

            database.ref(".info/connected").on("value", snap => {
                const isConn = snap.val() === true;
                setSyncStatus(isConn ? "☁ 已連線到 Firebase" : "☁ Firebase 連線中...", isConn ? "text-[11px] text-emerald-400" : "text-[11px] text-amber-400");
            });

            database.ref(FIREBASE_PATH).on("value", snap => {
                applyFirebaseDataToLocal(snap.val());
                render();
            });
        }

        function selectWeek(wk) {
            if (!wk) return;
            transactionUpdate(data => { data.activeWeek = wk; return true; });
        }

        function switchWeekRelative(delta) {
            const [y, m, d] = state.activeWeek.split('-').map(Number);
            const t = y ? new Date(y, m - 1, d) : getTuesdayOfWeek();
            t.setDate(t.getDate() + delta * 7);
            selectWeek(formatDateKey(t));
        }

        function jumpToCurrentWeek() { selectWeek(formatDateKey(getTuesdayOfWeek())); }

        function getJobColorClass(job) { return JOB_STYLE_MAP[job]?.class || DEFAULT_JOB_CLASS; }
        function getJobOptionStyle(job) { return JOB_STYLE_MAP[job]?.style || DEFAULT_JOB_STYLE; }

        function renderJobSelectOptions(currentJob) {
            let html = `<option value="" style="${DEFAULT_JOB_STYLE}" ${!currentJob ? "selected" : ""}>職業</option>`;
            JOB_LIST.forEach(job => {
                html += `<option value="${job}" style="${getJobOptionStyle(job)}" ${currentJob === job ? "selected" : ""}>${job}</option>`;
            });
            return html;
        }

        function renderGroupSelectOptions(currentGroupId) {
            let html = `<option value="" class="bg-slate-900 text-slate-500" ${!currentGroupId ? "selected" : ""}></option>`;
            for (let i = 1; i <= 15; i++) {
                html += `<option value="g${i}" class="bg-slate-900 text-amber-400 font-bold" ${currentGroupId === `g${i}` ? "selected" : ""}>大小號 ${i}</option>`;
            }
            return html;
        }

        function renderAvailabilitySelects(player) {
            const avail = getPlayerWeekAvailability(player, state.activeWeek);
            return WEEKDAYS.map((day, i) => `
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-blue-400 font-semibold mb-0.5">${day}</span>
                    <select onchange="updatePlayerAvailability('${player.id}', ${i}, this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-0.5 py-0.5 text-[11px] text-slate-200">
                        <option value="" ${!avail[i] ? "selected" : ""}></option>
                        <option value="19:00~" ${avail[i] === "19:00~" ? "selected" : ""}>19:00~</option>
                        <option value="20:00~" ${avail[i] === "20:00~" ? "selected" : ""}>20:00~</option>
                        <option value="21:00~" ${avail[i] === "21:00~" ? "selected" : ""}>21:00~</option>
                    </select>
                </div>
            `).join("");
        }

        function updatePlayerField(id, field, val) {
            const norm = field === "level" ? normalizeLevel(val) : String(val);
            transactionUpdate(data => {
                const p = data.pool.find(item => String(item.id) === String(id));
                if (p) p[field] = norm;
                return true;
            });
        }

        function updatePlayerAvailability(id, dayIdx, val) {
            const wk = state.activeWeek;
            transactionUpdate(data => {
                const p = data.pool.find(item => String(item.id) === String(id));
                if (p) {
                    if (!p.availability || Array.isArray(p.availability)) p.availability = { [wk]: ["", "", "", "", "", "", ""] };
                    if (!p.availability[wk]) p.availability[wk] = ["", "", "", "", "", "", ""];
                    p.availability[wk][dayIdx] = String(val);
                }
                return true;
            });
        }

        function addEmptyPoolPlayer() {
            transactionUpdate(data => {
                data.pool.push({
                    id: makeId(), level: "", name: "", job: "", position: "", rounds: "7", groupId: "",
                    availability: { [state.activeWeek]: ["", "", "", "", "", "", ""] }, note: ""
                });
                return true;
            });
        }

        function deletePoolPlayer(id) {
            if (!confirm("確定要刪除此成員嗎？")) return;
            transactionUpdate(data => {
                data.pool = data.pool.filter(p => String(p.id) !== String(id));
                return true;
            });
        }

        function sortPoolBy(field) {
            if (poolSortState.field === field) {
                poolSortState.direction = poolSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                poolSortState.field = field;
                poolSortState.direction = field === 'level' ? 'desc' : 'asc';
            }
            const dir = poolSortState.direction === 'asc' ? 1 : -1;
            state.pool.sort((a, b) => {
                if (field === 'level') return (Number(getPlayerLevel(b)) - Number(getPlayerLevel(a))) * dir;
                if (field === 'job') return String(a.job || '').localeCompare(String(b.job || ''), 'zh-TW') * dir;
                return 0;
            });
            render();
        }

        function getAvailableWeekKeys() {
            const set = new Set(Object.keys(state.weeksData || {}));
            const base = getTuesdayOfWeek();
            for (let i = -1; i <= 2; i++) {
                const d = new Date(base); d.setDate(d.getDate() + i * 7);
                set.add(formatDateKey(d));
            }
            return Array.from(set).sort();
        }

        function render() {
            const weekKeys = getAvailableWeekKeys();
            document.getElementById("week-select").innerHTML = weekKeys.map(wk => `<option value="${wk}" ${wk === state.activeWeek ? "selected" : ""}>${getWeekDisplayTitle(wk)}</option>`).join("");

            const getIcon = f => poolSortState.field !== f ? '↕️' : (poolSortState.direction === 'asc' ? '▲' : '▼');

            let html = `
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3 flex-wrap gap-3">
                        <h2 class="text-lg font-bold text-slate-200">👥 總名單成員 (${state.pool.length}人)</h2>
                        <div class="flex items-center gap-2 flex-wrap">
                            <button onclick="sortPoolBy('level')" class="rounded border border-slate-700 bg-slate-800 px-2 py-0.5 text-xs text-slate-200">等級 ${getIcon('level')}</button>
                            <button onclick="sortPoolBy('job')" class="rounded border border-slate-700 bg-slate-800 px-2 py-0.5 text-xs text-slate-200">職業 ${getIcon('job')}</button>
                            <button onclick="addEmptyPoolPlayer()" class="rounded border border-blue-600 bg-blue-600/20 px-3 py-1.5 text-xs font-bold text-blue-300">➕ 新增自己</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
            `;

            if (state.pool.length === 0) {
                html += `<p class="text-center text-sm text-slate-500 py-6">目前尚無成員，請點擊上方「➕ 新增自己」按鈕填寫資料。</p>`;
            } else {
                state.pool.forEach((player, idx) => {
                    html += `
                        <div class="flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 p-2.5 text-sm flex-wrap gap-2">
                            <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                                <span class="text-xs text-slate-500">#${idx + 1}</span>
                                <input type="text" value="${escapeHtml(getPlayerLevel(player))}" maxlength="3" onchange="updatePlayerField('${player.id}', 'level', this.value)" placeholder="等級" class="w-12 rounded border border-slate-800 bg-slate-900 px-1 py-1 text-center text-xs text-blue-400">
                                <select onchange="updatePlayerField('${player.id}', 'job', this.value)" class="w-24 rounded border px-1 py-1 text-xs ${getJobColorClass(player.job)}">
                                    ${renderJobSelectOptions(player.job)}
                                </select>
                                <input type="text" value="${escapeHtml(player.name)}" onchange="updatePlayerField('${player.id}', 'name', this.value)" placeholder="遊戲名字" class="w-24 rounded border border-slate-800 bg-slate-900 px-1.5 py-1 text-xs text-slate-200 font-bold">
                                <input type="text" value="${escapeHtml(player.position)}" placeholder="AD/AP" onchange="updatePlayerField('${player.id}', 'position', this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-1 text-xs text-slate-300">
                                <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded border border-slate-800">${renderAvailabilitySelects(player)}</div>
                                <select onchange="updatePlayerField('${player.id}', 'rounds', this.value)" class="rounded border border-slate-700 bg-slate-900 px-1.5 py-1 text-xs text-slate-200">
                                    <option value="7" ${player.rounds === "7" ? "selected" : ""}>7場</option>
                                    <option value="14" ${player.rounds === "14" ? "selected" : ""}>14場</option>
                                </select>
                                <select onchange="updatePlayerField('${player.id}', 'groupId', this.value)" class="w-22 rounded border border-amber-900 bg-amber-950/40 px-1 py-1 text-xs text-amber-300">
                                    ${renderGroupSelectOptions(player.groupId)}
                                </select>
                                <input type="text" value="${escapeHtml(player.note || '')}" placeholder="備註" onchange="updatePlayerField('${player.id}', 'note', this.value)" class="w-28 rounded border border-slate-800 bg-slate-900 px-1.5 py-1 text-xs text-slate-400">
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="deletePoolPlayer('${player.id}')" class="rounded bg-slate-900 border border-slate-800 px-2 py-1 text-xs text-rose-400 hover:bg-rose-950">刪除</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            document.getElementById("master-view-container").innerHTML = html;
        }

        initFirebaseListener();
    </script>
</body>
</html>
