<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 隊伍分配</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .share-export-title {
            /* 所有標籤圖片共用固定標題尺寸，避免不同標籤產生不同大小 */
            font-size: 22px !important;
            font-weight: 900;
            text-align: center;
            padding: 0 20px 4px;
            margin: 0;
            line-height: 1.2;
            color: #f8fafc;
            letter-spacing: 1px;
        }

        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: max-content;
            pointer-events: none;
        }
        .share-card-inner {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            padding: 16px 28px 28px;
            background: #111111;
            color: #d1d5db;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        /* 匯出圖片的團隊欄位橫向排列；標題獨立放在最上方置中。 */
        .share-export-columns {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
        }
        .share-group-column {
            width: 330px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 14px 16px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .share-group-header-text {
            font-size: 22px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }
        .share-team-wrapper {
            display: flex;
            flex-direction: column;
        }
        .share-team-title-text {
            font-size: 17px;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 0px;
            margin-bottom: 3px;
            line-height: 21px;
        }
        .share-row-item {
            display: flex;
            align-items: center;
            min-height: 28px;
            height: 28px;
            padding: 0;
            line-height: 20px;
            font-size: 15px;
            color: #e5e7eb;
            margin-bottom: 1px;
            overflow: visible;
        }
        .share-divider-line {
            height: 1px;
            background-color: #3b82f6;
            margin: 6px 0;
            opacity: 0.8;
        }
        .share-col-level {
            width: 48px;
            text-align: right;
            margin-right: 6px;
            color: #93c5fd;
            font-weight: 600;
            flex-shrink: 0;
        }
        .share-col-job {
            width: 72px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .share-col-name {
            width: 110px;
            margin-right: 6px;
            overflow: visible;
            text-overflow: clip;
            white-space: nowrap;
            line-height: 20px;
            min-height: 20px;
            flex-shrink: 0;
        }
        .share-col-part {
            width: 60px;
            color: #fde047;
            font-size: 14px;
            flex-shrink: 0;
        }




    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-7xl">
        <!-- 頂部標題區 -->
        <header class="mb-6 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wide text-blue-400 md:text-4xl">Artale 隊伍分配</h1>
            <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
        </header>

        <!-- 週別切換區塊 -->
        <div class="mb-6 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex w-full flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none"></select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
                <button id="btn-delete-week" onclick="deleteCurrentWeek()" class="hidden ml-auto shrink-0 rounded-lg border border-rose-900 bg-rose-950/80 px-2.5 py-1.5 text-xs font-semibold text-rose-300 hover:bg-rose-900 transition">🗑️ 刪除此週</button>
            </div>
            <div class="mt-3 w-full text-xs text-slate-400">
                💡 切換週別時，<span class="text-blue-400 font-semibold">等級/職業/名字/ADAP</span> 全週保留，僅<span class="text-emerald-400 font-semibold">填寫時間與隊伍分配</span>按週獨立。
            </div>
        </div>

        <!-- 分頁切換區塊 -->
        <div class="mb-6 grid grid-cols-1 gap-2 rounded-xl border border-slate-800 bg-slate-900/90 p-1.5 shadow-md">
            <button id="tab-btn-master" onclick="switchTab('master')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>📋</span> 總名單 <span id="master-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0人</span>
            </button>
            <button id="tab-btn-teams" onclick="switchTab('teams')" style="display:none" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>⚔️</span> 6人隊伍分配 <span id="teams-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0/18</span>
            </button>
            <button id="tab-btn-teams2" onclick="switchTab('teams2')" style="display:none" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>⚔</span> 12人隊伍分配 <span id="teams2-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0/18</span>
            </button>
        </div>

        <!-- 主內容區 -->
        <main class="space-y-6">
            <!-- 總名單頁面 -->
            <div id="tab-content-master" class="space-y-6 hidden">
                <div id="master-view-container"></div>
            </div>

            <!-- 隊伍分配頁面 1 (6人) -->
            <div id="tab-content-teams" class="space-y-6 hidden">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-base font-bold text-slate-200">遠征團管理 (6人)</h2>
                    </div>
                    <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <button onclick="openImageGenModal(false)" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                    </div>
                    <div id="group-tabs" class="mt-4 flex flex-wrap gap-3"></div>
                </div>

                <!-- 隊伍管理操作列 -->
                <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900 px-5 py-3 shadow-sm">
                    <div class="text-xs text-slate-400">
                        📌 當前遠征團共有 <span id="current-teams-count" class="text-blue-400 font-bold">3</span> 支隊伍
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addTeamToCurrentGroup(false)" class="rounded-lg border border-emerald-800 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-900/50 transition">➕ 新增隊伍</button>
                        <button onclick="removeTeamFromCurrentGroup(false)" class="rounded-lg border border-rose-900 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-900 transition">➖ 減少最後一隊</button>
                    </div>
                </div>

                <div id="teams-cards-container" class="space-y-6"></div>
                <div id="teams-pool-container"></div>

                <!-- 危險操作移至頁面最底部，避免誤觸 -->
                <div class="flex justify-end border-t border-slate-800/70 pt-4">
                    <button onclick="clearCurrentGroup(false)" class="rounded-lg border border-slate-800 bg-slate-900/60 px-3 py-2 text-xs text-slate-500 transition hover:border-rose-900 hover:bg-rose-950/40 hover:text-rose-300">🧹 清空當前團隊伍</button>
                </div>
            </div>

            <!-- 隊伍分配頁面 2 (12人，兩欄式緊湊版面) -->
            <div id="tab-content-teams2" class="space-y-6 hidden">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-base font-bold text-slate-200">遠征團管理 (12人)</h2>
                    </div>
                    <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <button onclick="openImageGenModal(true)" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                    </div>
                    <div id="group-tabs-2" class="mt-4 flex flex-wrap gap-3"></div>
                </div>

                <!-- 隊伍管理操作列 -->
                <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900 px-5 py-3 shadow-sm">
                    <div class="text-xs text-slate-400">
                        📌 當前遠征團共有 <span id="current-teams-count-2" class="text-blue-400 font-bold">3</span> 支隊伍
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addTeamToCurrentGroup(true)" class="rounded-lg border border-emerald-800 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-900/50 transition">➕ 新增隊伍</button>
                        <button onclick="removeTeamFromCurrentGroup(true)" class="rounded-lg border border-rose-900 bg-rose-950/60 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-900 transition">➖ 減少最後一隊</button>
                    </div>
                </div>

                <div id="teams-cards-container-2" class="space-y-6"></div>
                <div id="teams-pool-container-2"></div>

                <!-- 危險操作移至頁面最底部，避免誤觸 -->
                <div class="flex justify-end border-t border-slate-800/70 pt-4">
                    <button onclick="clearCurrentGroup(true)" class="rounded-lg border border-slate-800 bg-slate-900/60 px-3 py-2 text-xs text-slate-500 transition hover:border-rose-900 hover:bg-rose-950/40 hover:text-rose-300">🧹 清空當前團隊伍</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 圖片匯出暫存容器 -->
    <div id="share-card"></div>

    <!-- 從總名單快速挑選成員 -->
    <div id="roster-picker-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/75 backdrop-blur-sm p-3 md:p-6">
        <div class="flex max-h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-xl border border-slate-700 bg-slate-900 shadow-2xl">
            <div class="flex items-center justify-between gap-3 border-b border-slate-700 px-5 py-4">
                <div>
                    <h3 id="roster-picker-title" class="text-lg font-bold text-slate-100">從總名單加入成員</h3>
                    <p class="mt-1 text-xs text-slate-400">可用職業篩選或搜尋名字，按「＋加入」即可加入目前隊伍。</p>
                </div>
                <button onclick="closeRosterPicker()" class="rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
            </div>
            <div class="space-y-3 border-b border-slate-800 p-4">
                <input id="roster-picker-search" type="search" oninput="updateRosterPickerQuery(this.value)" placeholder="搜尋玩家名稱、職業或等級…" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-blue-500">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="space-y-2"><div id="roster-picker-jobs" class="flex flex-wrap gap-2"></div><div id="roster-picker-tags" class="flex flex-wrap gap-2"></div></div>
                    <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-emerald-800 bg-emerald-950/40 px-3 py-2 text-xs font-semibold text-emerald-200">
                        <input id="roster-picker-available-only" type="checkbox" onchange="toggleRosterPickerAvailableOnly(this.checked)" class="accent-emerald-500">
                        <span id="roster-picker-available-label">只顯示當週有填時間</span>
                    </label>
                </div>
            </div>
            <div id="roster-picker-list" class="min-h-0 flex-1 overflow-auto p-3"></div>
            <div class="flex items-center justify-between border-t border-slate-800 px-4 py-3">
                <span id="roster-picker-count" class="text-xs text-slate-400"></span>
                <button onclick="closeRosterPicker()" class="rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 text-sm text-slate-200 hover:bg-slate-700">完成</button>
            </div>
        </div>
    </div>

    <!-- 圖片預覽 Modal -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="relative flex max-h-[90vh] w-full max-w-5xl flex-col rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">團隊圖片預覽</h3>
                <button onclick="closeModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
            </div>
            <p class="mb-3 text-xs text-slate-400">系統會依照隊伍標籤自動產生多張圖片。可在每張圖片下方個別選擇日期，再複製或下載該張圖片。</p>
            <div id="image-list" class="min-h-0 flex-1 space-y-5 overflow-y-auto rounded-lg bg-slate-950 p-3"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 1. 常數與設定值

        // ==========================================
        const FIREBASE_CONFIG = {

        let rosterPickerQueryTimer = null;
        let currentTab = "master";
        let previewImages = [];
        let currentImageIndex = 0;
        let poolSortState = { field: null, direction: 'desc' };
        let poolJobFilters = [];
        let poolTagFilter = "all";
    // 總名單名稱搜尋：僅本機介面狀態，不寫入 Firebase / localStorage。
        let masterNameQuery = "";
        let masterNameComposing = false;
        // 6人／12人隊伍頁面的成員名單日期篩選：-1=全部，0~6=週二~週一
        let poolDayFilter = -1;
        let pendingImageGenIsTeams2 = false;
        let rosterPicker = { open: false, teamIdx: 0, isTeams2: false, job: "全部職業", tag: "全部標籤", query: "", availableOnly: false };

        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            activeGroup: 0,
            activeGroup2: 0,
            filterAvailableOnly: true,
            pool: [],
            weeksData: {},
            deletedWeeks: []
        };

        // ==========================================
        // 3. 通用工具與日期輔助函式 (Helper Utilities)
        // ==========================================
        function makeId() { 
            return Date.now() + "-" + Math.random().toString(36).substring(2, 10); 
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function isLevel(val) { 
            return /^(?:lv\.?\s*)?\d+$/i.test(String(val || "").trim()); 
        }

        function normalizeLevel(val) { 
            const match = String(val || "").trim().match(/\d+/); 
            return match ? match[0] : ""; 
        }

        function getPlayerLevel(player) {
            if (!player) return "";
            for (const v of [player.level, player.lv, player["等級"], player.levelText]) {
                if (isLevel(v)) return normalizeLevel(v);
            }
            return "";
        }

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            date.setDate(date.getDate() + ((day >= 2) ? (2 - day) : (2 - day - 7)));
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const [y, m, d] = weekKey.split('-').map(Number);
            if (!y) return weekKey;
            
            const start = new Date(y, m - 1, d);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            
            const rangeStr = `${start.getFullYear()} ${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')} ~ ${end.getMonth() + 1}/${String(end.getDate()).padStart(2, '0')}`;
            const thisKey = formatDateKey(getTuesdayOfWeek());
            
            if (weekKey === thisKey) return `${rangeStr} (本週)`;
            
            const nextTue = getTuesdayOfWeek(); 
            nextTue.setDate(nextTue.getDate() + 7);
            if (weekKey === formatDateKey(nextTue)) return `${rangeStr} (下週)`;
            
            const lastTue = getTuesdayOfWeek(); 
            lastTue.setDate(lastTue.getDate() - 7);
            if (weekKey === formatDateKey(lastTue)) return `${rangeStr} (上週)`;
            
            return rangeStr;
        }

        function getWeekday(date) {
            const parts = String(date).split("/");
            if (parts.length < 2) return "";
            const d = new Date(new Date().getFullYear(), Number(parts[0]) - 1, Number(parts[1]));
            return isNaN(d) ? "" : WEEKDAY_NAMES[d.getDay()];
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (el) { 
                el.className = `mt-1 ${className}`; 
                el.textContent = text; 
            }
        }

        // ==========================================
        // 4. 預設資料結構產生器 (Default Generators)
        // ==========================================
        function createDefaultTeams(isTeams2 = false) {
            // 6人隊伍預設「連14場」；12人隊伍預設「連7場」。
            const defaultCon = !isTeams2;
            return [
                { name: "第1隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] },
                { name: "第2隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] },
                { name: "第3隊", emoji: "⚔️", time: "20:00", con: defaultCon, members: [] }
            ];
        }

        function createDefaultWeekGroups(weekKey, isTeams2 = false) {
            const [y, m, d] = (weekKey || formatDateKey(getTuesdayOfWeek())).split('-').map(Number);
            const startDate = y ? new Date(y, m - 1, d) : getTuesdayOfWeek();
            return Array.from({ length: MAX_GROUPS }, (_, i) => {
                const targetDate = new Date(startDate);
                targetDate.setDate(startDate.getDate() + i);
                return { teams: createDefaultTeams(isTeams2), date: `${targetDate.getMonth() + 1}/${targetDate.getDate()}` };
            });
        }

        function createEmptyFirebaseData() {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            return { 
                activeWeek: defaultWeekKey, 
                pool: [], 
                weeksData: { [defaultWeekKey]: { groups: createDefaultWeekGroups(defaultWeekKey, false), groups2: createDefaultWeekGroups(defaultWeekKey, true) } },
                deletedWeeks: []
            };
        }

        // ==========================================
        // 5. 資料規格化邏輯
        // Firebase / 舊資料載入時，統一整理成目前程式使用的格式。
        // ==========================================
        function normalizeAvailabilityArray(arr) {
            const def = ["", "", "", "", "", "", ""];
            return Array.isArray(arr) ? def.map((_, i) => typeof arr[i] === "string" ? arr[i] : "") : def;
        }

        function normalizePlayerAvailability(avail, wk) {
            if (Array.isArray(avail)) return { [wk]: normalizeAvailabilityArray(avail) };
            if (avail && typeof avail === "object") {
                const res = {};
                for (const k in avail) res[k] = normalizeAvailabilityArray(avail[k]);
                return res;
            }
            return { [wk]: ["", "", "", "", "", "", ""] };
        }

        function getPlayerWeekAvailability(player, wk) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) return normalizeAvailabilityArray(player.availability);
            return normalizeAvailabilityArray(player.availability[wk]);
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const wk = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            return {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "").trim(),
                position: String(player.position || player["AD/AP"] || "").trim(),
                rounds: String(player.rounds || "7").trim(),
                groupId: String(player.groupId || "").trim(),
                part: String(player.part || ""),
                treeKing: Boolean(player.treeKing), 
                dragonKing: Boolean(player.dragonKing), 
                ...Object.fromEntries(SHARED_TAGS.map(tag => [tag.key, Boolean(player[tag.key])])),
                availability: normalizePlayerAvailability(player.availability, wk),
                note: String(player.note || player["備註"] || "").trim()
            };
        }

        function normalizeGroupsData(rawGroups, wk, isTeams2 = false) {
            let groups = Array.isArray(rawGroups) ? rawGroups.slice(0, MAX_GROUPS) : [];
            const defGroups = createDefaultWeekGroups(wk, isTeams2);
            
            while (groups.length < MAX_GROUPS) {
                groups.push(defGroups[groups.length]);
            }

            return groups.map((g, idx) => {
                const teams = Array.isArray(g?.teams) ? g.teams.map((t, tIdx) => ({
                    name: t.name || `第${tIdx + 1}隊`,
                    emoji: t.emoji || "⚔️",
                    time: t.time || "20:00",
                    con: Boolean(t.con),
                    tag: SHARED_TAGS.some(tag => tag.key === t.tag) ? t.tag : "",
                    members: Array.isArray(t.members) ? t.members.map(p => normalizePlayer(p, wk)).filter(Boolean) : []
                })) : createDefaultTeams(isTeams2);
                
                return { teams, date: typeof g?.date === "string" && g.date ? g.date : defGroups[idx].date };
            });
        }

        function normalizeWeekGroupData(weekData, wk) {
            return {
                groups: normalizeGroupsData(weekData?.groups, wk, false),
                groups2: normalizeGroupsData(weekData?.groups2 || weekData?.groups, wk, true)
            };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            if (!data || typeof data !== "object") return createEmptyFirebaseData();

            const requestedActiveWeek = typeof data.activeWeek === "string" && data.activeWeek
                ? data.activeWeek
                : defaultWeekKey;
            const deletedWeeks = Array.isArray(data.deletedWeeks)
                ? [...new Set(data.deletedWeeks.map(String))]
                : [];
            const deletedSet = new Set(deletedWeeks);
            const weeksData = {};

            // 載入時保留所有未刪除週別的原始資料；已明確刪除的週不再自動建立。
            if (data.weeksData && typeof data.weeksData === "object") {
                for (const wk of Object.keys(data.weeksData)) {
                    if (deletedSet.has(String(wk))) continue;
                    weeksData[wk] = normalizeWeekGroupData(data.weeksData[wk], wk);
                }
            }

            let activeWeek = requestedActiveWeek;
            if (deletedSet.has(String(activeWeek)) || !weeksData[activeWeek]) {
                const existingKeys = Object.keys(weeksData).sort();
                if (existingKeys.length) {
                    // 優先選擇日期最接近原 activeWeek 的「既有」週，避免切到空白資料。
                    const targetTime = Date.parse(`${activeWeek}T00:00:00`) || Date.now();
                    activeWeek = existingKeys.reduce((best, key) => {
                        const bestTime = Date.parse(`${best}T00:00:00`) || 0;
                        const keyTime = Date.parse(`${key}T00:00:00`) || 0;
                        return Math.abs(keyTime - targetTime) < Math.abs(bestTime - targetTime) ? key : best;
                    }, existingKeys[0]);
                } else {
                    // 只有完全沒有可用週別時才建立一個空白週；絕不重建已刪除的週。
                    let candidate = defaultWeekKey;
                    if (deletedSet.has(candidate)) {
                        const baseDateParts = defaultWeekKey.split('-').map(Number);
                        const baseDate = new Date(baseDateParts[0], baseDateParts[1] - 1, baseDateParts[2]);
                        candidate = "";
                        for (let offset = 1; offset <= 5200 && !candidate; offset++) {
                            const future = new Date(baseDate);
                            future.setDate(future.getDate() + offset * 7);
                            const futureKey = formatDateKey(future);
                            if (!deletedSet.has(futureKey)) { candidate = futureKey; break; }
                            const past = new Date(baseDate);
                            past.setDate(past.getDate() - offset * 7);
                            const pastKey = formatDateKey(past);
                            if (!deletedSet.has(pastKey)) { candidate = pastKey; break; }
                        }
                        if (!candidate) candidate = defaultWeekKey;
                    }
                    activeWeek = candidate;
                    weeksData[activeWeek] = {
                        groups: createDefaultWeekGroups(activeWeek, false),
                        groups2: createDefaultWeekGroups(activeWeek, true)
                    };
                }
            }

            const pool = Array.isArray(data.pool) ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean) : [];
            return { activeWeek, weeksData, pool, deletedWeeks };
        }

        function applyFirebaseDataToLocal(data) {
            const norm = normalizeFirebaseData(data);
            state = {
                activeWeek: norm.activeWeek,
                activeGroup: Math.min(Math.max(state.activeGroup || 0, 0), MAX_GROUPS - 1),
                activeGroup2: Math.min(Math.max(state.activeGroup2 || 0, 0), MAX_GROUPS - 1),
                filterAvailableOnly: typeof state.filterAvailableOnly === "boolean" ? state.filterAvailableOnly : true,
                pool: norm.pool,
                weeksData: norm.weeksData,
                deletedWeeks: norm.deletedWeeks || []
            };
        }

        function currentWeekData() { 
            return state.weeksData[state.activeWeek] || { groups: createDefaultWeekGroups(state.activeWeek, false), groups2: createDefaultWeekGroups(state.activeWeek, true) }; 
        }
        
        function currentGroup(isTeams2 = false) { 
            const w = currentWeekData();
            return (isTeams2 ? w.groups2 : w.groups)[isTeams2 ? state.activeGroup2 : state.activeGroup] || { teams: createDefaultTeams(), date: "" }; 
        }

        // ==========================================
        // 6. 資料庫與狀態同步
        // Firebase 開啟時同步雲端；失敗時退回 localStorage。
        // ==========================================
        function saveLocalState() {
            try { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeWeek: state.activeWeek, pool: state.pool, weeksData: state.weeksData, deletedWeeks: state.deletedWeeks || [] })); 
            } catch(e) {}
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const local = normalizeFirebaseData(state);
                if (mutator(local) !== false) {
                    applyFirebaseDataToLocal(local);
                    saveLocalState();
                    render();
                }
                return;
            }
            try {
                const ref = database.ref(FIREBASE_PATH);
                const res = await ref.transaction(cur => {
                    const latest = normalizeFirebaseData(cur);
                    return mutator(latest) === false ? cur : latest;
                });
                if (res?.snapshot) {
                    applyFirebaseDataToLocal(res.snapshot.val());
                    saveLocalState();
                    render();
                }
            } catch(err) {
                // 雲端交易失敗時，將本次變更套用到本機狀態並快取，避免輸入內容直接遺失。
                try {
                    const fallback = normalizeFirebaseData(state);
                    if (mutator(fallback) !== false) {
                        applyFirebaseDataToLocal(fallback);
                        saveLocalState();
                        render();
                    } else {
                        saveLocalState();
                    }
                } catch(localErr) {
                    saveLocalState();
                    console.error("Local fallback failed:", localErr);
                }
                setSyncStatus("⚠ 雲端同步失敗，已保留本機資料", "text-[11px] text-amber-500");
                console.error("Firebase transaction failed:", err);
                alert("資料同步失敗；本次變更已盡可能保留在本機，請確認連線與 Firebase 權限。 ");
            }
        }

        function initFirebaseListener() {
            try {
                if (typeof firebase !== "undefined" && !firebase.apps.length) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                }
                database = firebase.database();
                firebaseEnabled = true;
            } catch (error) {
                firebaseEnabled = false;
                setSyncStatus("⚠ Firebase 初始化失敗，使用本機儲存", "text-[11px] text-rose-400");
            }

            if (!firebaseEnabled) { 
                loadLocalState(); 
                return; 
            }

            database.ref(".info/connected").on("value", snap => {
                const isConn = snap.val() === true;
                setSyncStatus(isConn ? "☁ 已連線到 Firebase" : "☁ Firebase 連線中...", isConn ? "text-[11px] text-emerald-400" : "text-[11px] text-amber-400");
            });

            database.ref(FIREBASE_PATH).on("value", snap => {
                applyFirebaseDataToLocal(snap.val());
                saveLocalState();
                render();
            }, error => {
                setSyncStatus("⚠ 無法讀取雲端資料，請檢查 Firebase 權限", "text-[11px] text-amber-500");
                console.error("Firebase listener failed:", error);
            });
            
            database.ref(FIREBASE_PATH).transaction(cur => cur === null ? createEmptyFirebaseData() : cur);
        }

        function loadLocalState() {
            try { 
                applyFirebaseDataToLocal(JSON.parse(localStorage.getItem(STORAGE_KEY))); 
            } catch(e) { 
                applyFirebaseDataToLocal(null); 
            }
            render();
        }

        // ==========================================
        // 7. 商業邏輯運算
        // 隊伍限制、玩家是否已安排等「規則」集中在這裡。
        // ==========================================
        function getPlayerWeeklyTeamCount(playerId, weekData) {
            if (!weekData) return 0;
            let count = 0;
            const checkGroups = (gs) => {
                if (!gs) return;
                gs.forEach(group => {
                    (group.teams || []).forEach(team => {
                        if (team && team.members && team.members.some(p => String(p.id) === String(playerId))) {
                            count += team.con ? 2 : 1;
                        }
                    });
                });
            };
            checkGroups(weekData.groups);
            checkGroups(weekData.groups2);
            return count;
        }

        // ----------------------------------------------------------
        // 取得玩家在「12人隊伍」中的排隊狀態
        // 規則：只要玩家已經被排進本週任何一個 12 人隊伍，
        // 就不再顯示於 12 人頁面的「待排名單」。
        // 移出 12 人隊伍後，玩家會自動重新出現在名單。
        // ----------------------------------------------------------
        function isPlayerAssignedTo12Team(playerId, weekData) {
            if (!weekData?.groups2) return false;

            return weekData.groups2.some(group =>
                (group.teams || []).some(team =>
                    (team.members || []).some(member =>
                        String(member.id) === String(playerId)
                    )
                )
            );
        }

        function hasReachedWeeklyLimit(player, weekData) {
            const rounds = String(player.rounds || "7");
            const assignedCount = getPlayerWeeklyTeamCount(player.id, weekData);
            if (rounds === "14" && assignedCount >= 2) return true;
            if (rounds === "7" && assignedCount >= 1) return true;
            return false;
        }

        function sortPoolBy(field) {
            if (poolSortState.field === field) {
                poolSortState.direction = poolSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                poolSortState.field = field;
                poolSortState.direction = field === 'level' ? 'desc' : 'asc';
            }
            const dir = poolSortState.direction === 'asc' ? 1 : -1;

            transactionUpdate(data => {
                const groupsMap = new Map();
                data.pool.forEach((player, idx) => {
                    const gId = player.groupId ? String(player.groupId).trim() : null;
                    if (gId) {
                        if (!groupsMap.has(gId)) groupsMap.set(gId, []);
                        groupsMap.get(gId).push(player);
                    } else {
                        groupsMap.set(`_single_${idx}_${player.id}`, [player]);
                    }
                });

                const groupList = Array.from(groupsMap.values()).map(members => {
                    let sortKey;
                    if (field === 'level') {
                        const levels = members.map(m => Number(getPlayerLevel(m)) || 0);
                        sortKey = dir === 1 ? Math.min(...levels) : Math.max(...levels);
                    } else if (field === 'job') {
                        const getJobIndex = (jobName) => {
                            const idx = JOB_LIST.indexOf(jobName);
                            return idx === -1 ? 999 : idx;
                        };
                        const indices = members.map(m => getJobIndex(String(m.job || '')));
                        sortKey = dir === 1 ? Math.min(...indices) : Math.max(...indices);
                    }
                    return { members, sortKey };
                });

                groupList.sort((a, b) => {
                    if (field === 'level') return (a.sortKey - b.sortKey) * dir;
                    if (field === 'job') return (a.sortKey - b.sortKey) * dir;
                    return 0;
                });

                data.pool = [];
                groupList.forEach(group => data.pool.push(...group.members));
                return true;
            });
        }

        // ==========================================
        // 8. 介面事件處理與動作
        // 按鈕、拖曳、玩家資料修改等操作都在這裡。
        // ==========================================
        function toggleJobFilter(job) {
            const idx = poolJobFilters.indexOf(job);
            if (idx > -1) {
                poolJobFilters.splice(idx, 1);
            } else {
                poolJobFilters.push(job);
            }
            render();
        }

        function clearAllJobFilters() {
            poolJobFilters = [];
            render();
        }

        function setPoolTagFilter(val) {
            poolTagFilter = val;
            render();
        }

        // 總名單名稱搜尋：只改變目前頁面的 DOM 顯示，不觸發 render()。
        // 這樣中文輸入法（注音／倉頡等）在組字時不會被任何 DOM 重建打斷。
        function applyMasterNameSearch(input, event) {
            if (!input) return;

            const value = String(input.value || "").trim().toLocaleLowerCase();
            // 只有組字中的 input 事件不更新正式搜尋狀態；compositionend 會強制套用完成的中文。
            const isTypingComposition = Boolean(event && event.type === "input" && event.isComposing);
            if (!isTypingComposition) masterNameQuery = value;

            const list = document.getElementById("pool-list-master")
                || document.querySelector("#master-view-container [data-list-type='pool']");
            if (!list) return;

            // 先用專用標記找列；若頁面模板／舊快取沒有標記，退回所有成員列，避免整個搜尋失效。
            let rows = Array.from(list.querySelectorAll("[data-master-player-row='1']"));
            if (rows.length === 0) rows = Array.from(list.querySelectorAll(".drag-item[data-id]"));

            let count = 0;
            rows.forEach(row => {
                let nameInput = row.querySelector("[data-master-player-name='1']");
                if (!nameInput) {
                    nameInput = Array.from(row.querySelectorAll("input")).find(el =>
                        String(el.getAttribute("onchange") || "").includes("'name'")
                    );
                }
                const name = String(nameInput ? nameInput.value : "").toLocaleLowerCase();
                const matched = !value || name.includes(value);
                row.style.display = matched ? "flex" : "none";
                if (matched) count++;
            });

            let emptyHint = document.getElementById("master-name-search-empty");
            if (count === 0 && value) {
                if (!emptyHint) {
                    emptyHint = document.createElement("p");
                    emptyHint.id = "master-name-search-empty";
                    emptyHint.className = "text-center text-sm text-slate-500 py-6";
                    emptyHint.textContent = "找不到符合名稱的成員";
                }
                if (emptyHint.parentElement !== list) list.appendChild(emptyHint);
            } else if (emptyHint) {
                emptyHint.remove();
            }

            const countEl = document.getElementById("master-name-search-count");
            if (countEl) countEl.textContent = `符合 ${count} 人`;

            const clearBtn = document.getElementById("master-name-search-clear");
            if (clearBtn) clearBtn.classList.toggle("hidden", !value);
        }

        function clearMasterNameSearch() {
            masterNameQuery = "";
            const input = document.getElementById("master-name-search");
            if (input) {
                input.value = "";
                applyMasterNameSearch(input, null);
                input.focus();
            }
        }

        function setPoolDayFilter(dayIdx) {
            poolDayFilter = Number(dayIdx);
            render();
        }

        function moveEntireTeamToTargetGroup(sTeamIdx, targetGroupIdx, isTeams2 = false) {
            if (targetGroupIdx === "" || isNaN(targetGroupIdx)) return;
            const targetGIdx = parseInt(targetGroupIdx, 10);
            const activeG = isTeams2 ? state.activeGroup2 : state.activeGroup;
            if (targetGIdx === activeG) {
                alert("該隊伍已經在當前星期！");
                return;
            }

            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const srcGroup = groupsArr[activeG];
                const targetGroup = groupsArr[targetGIdx];

                if (!srcGroup || !srcGroup.teams[sTeamIdx]) return false;

                const movingTeam = srcGroup.teams[sTeamIdx];
                if (!targetGroup.teams) targetGroup.teams = [];

                const emptyTeamIdx = targetGroup.teams.findIndex(t => !t.members || t.members.length === 0);

                if (emptyTeamIdx !== -1) {
                    targetGroup.teams[emptyTeamIdx].members = JSON.parse(JSON.stringify(movingTeam.members || []));
                    targetGroup.teams[emptyTeamIdx].con = Boolean(movingTeam.con);
                } else {
                    const newTeam = JSON.parse(JSON.stringify(movingTeam));
                    newTeam.name = `第${targetGroup.teams.length + 1}隊`;
                    targetGroup.teams.push(newTeam);
                }

                srcGroup.teams[sTeamIdx].members = [];
                srcGroup.teams[sTeamIdx].con = false;

                alert(`成功將【${movingTeam.name}】成員搬移至 ${GROUP_NAMES[targetGIdx]}！`);
                return true;
            });

        function moveTeamToTeam(sTeamIdx, targetTeamIdxStr, isTeams2 = false) {
            if (targetTeamIdxStr === "") return;
            const targetTeamIdx = parseInt(targetTeamIdxStr, 10);
            if (sTeamIdx === targetTeamIdx) {
                alert("無法移動至同一隊！");
                return;
            }

            transactionUpdate(data => {
                const wData = data.weeksData[state.activeWeek];
                const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
                const teams = groupsArr[isTeams2 ? state.activeGroup2 : state.activeGroup].teams;
                if (!teams[sTeamIdx] || !teams[targetTeamIdx]) return false;

                const sourceTeam = teams[sTeamIdx];
                const targetTeam = teams[targetTeamIdx];

                sourceTeam.members.forEach(member => {
                    if (!targetTeam.members.some(m => String(m.id) === String(member.id))) {
                        targetTeam.members.push(member);
                    }
                });

                sourceTeam.members = [];
                sourceTeam.con = false;
                return true;
            });
        }

        function getWeekKeyOffset(weekKey, offsetWeeks) {
            const parts = String(weekKey || formatDateKey(getTuesdayOfWeek())).split('-').map(Number);
            const date = parts[0] ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();
            date.setDate(date.getDate() + Number(offsetWeeks || 0) * 7);
            return formatDateKey(date);
        }

        // 判斷某週是否真的有可切換查看的內容，而不只是一筆空白預設週資料。
        // 任一 6人／12人隊伍有成員、隊伍有自訂設定，或總名單填過該週出席時間，都算有資料。
        function hasWeekData(weekKey) {
            const key = String(weekKey || '');
            if (!key || (state.deletedWeeks || []).map(String).includes(key)) return false;
            const week = state.weeksData && state.weeksData[key];
            if (!week) return false;

            const groupsHaveData = (groups, isTeams2) => (groups || []).some((group, gIdx) => {
                const baseParts = key.split('-').map(Number);
                const baseDate = baseParts[0] ? new Date(baseParts[0], baseParts[1] - 1, baseParts[2]) : getTuesdayOfWeek();
                baseDate.setDate(baseDate.getDate() + gIdx);
                const defaultDate = `${baseDate.getMonth() + 1}/${baseDate.getDate()}`;
                if (String(group.date || '') !== defaultDate) return true;
                return (group.teams || []).some((team, tIdx) => {
                    if ((team.members || []).length > 0) return true;
                    if (String(team.tag || '').trim()) return true;
                    if (String(team.name || `第${tIdx + 1}隊`) !== `第${tIdx + 1}隊`) return true;
                    if (String(team.time || '20:00') !== '20:00') return true;
                    // 不以連場選項單獨判定，避免舊資料缺少 groups2 時把複製的預設值誤認成有資料。
                    return false;
                });
            });

            if (groupsHaveData(week.groups, false) || groupsHaveData(week.groups2, true)) return true;

            return (state.pool || []).some(player =>
                getPlayerWeekAvailability(player, key).some(value => String(value || '').trim() !== '')
            );
        }

        function getAvailableWeekKeys() {
            const deleted = new Set((state.deletedWeeks || []).map(String));
            const set = new Set(Object.keys(state.weeksData || {}).filter(wk => !deleted.has(String(wk))));
            const base = getTuesdayOfWeek();
            // 只提供本週與未來兩週的快速建立入口，不再自動加入不存在的「上週」。
            for (let i = 0; i <= 2; i++) {
                const d = new Date(base);
                d.setDate(d.getDate() + i * 7);
                const key = formatDateKey(d);
                if (!deleted.has(key)) set.add(key);
            }
            return Array.from(set).sort();
        }

        function selectWeek(wk) {
            if (!wk) return;
            wk = String(wk);
            if ((state.deletedWeeks || []).map(String).includes(wk)) return;

            // 若選擇的是歷史週，必須已有資料；避免下拉選單把不存在的舊週建立成空白週。
            if (!state.weeksData?.[wk] && wk < formatDateKey(getTuesdayOfWeek())) return;

            transactionUpdate(data => {
                const deleted = new Set((data.deletedWeeks || []).map(String));
                if (deleted.has(wk)) return false;
                data.deletedWeeks = Array.isArray(data.deletedWeeks) ? data.deletedWeeks.map(String) : [];
                // 週別只在使用者明確選到本週／未來週時才允許建立；歷史週不得憑空建立。
                if (!data.weeksData[wk] && wk < formatDateKey(getTuesdayOfWeek())) return false;
                data.activeWeek = wk;
                if (!data.weeksData[wk]) {
                    data.weeksData[wk] = {
                        groups: createDefaultWeekGroups(wk, false),
                        groups2: createDefaultWeekGroups(wk, true)
                    };
                }
                return true;
            });
        }

        function switchWeekRelative(delta) {
            if (!delta) return;
            const step = delta > 0 ? 1 : -1;
            const currentKey = String(state.activeWeek || formatDateKey(getTuesdayOfWeek()));
            const deleted = new Set((state.deletedWeeks || []).map(String));

            if (step < 0) {
                // 上一週只允許前一個日曆週確實有內容；沒有資料或已刪除時按鈕會停用。
                const previousKey = getWeekKeyOffset(currentKey, -1);
                if (deleted.has(previousKey) || !hasWeekData(previousKey)) return;
                selectWeek(previousKey);
                return;
            }

            // 下一週維持原本可往未來建立週別的行為，並跳過明確刪除的週。
            let nextKey = '';
            for (let offset = 1; offset <= 5200; offset++) {
                const candidate = getWeekKeyOffset(currentKey, offset);
                if (!deleted.has(candidate)) { nextKey = candidate; break; }
            }
            if (nextKey) selectWeek(nextKey);
        }

        function jumpToCurrentWeek() {
            const currentKey = formatDateKey(getTuesdayOfWeek());
            if (!(state.deletedWeeks || []).map(String).includes(currentKey)) {
                selectWeek(currentKey);
                return;
            }
            // 如果本週已被刪除，跳到選單中日期最近、且沒有被刪除的週別。
            const keys = getAvailableWeekKeys();
            if (!keys.length) return;
            const targetTime = Date.parse(`${currentKey}T00:00:00`) || Date.now();
            const nearest = keys.reduce((best, key) => {
                const bestTime = Date.parse(`${best}T00:00:00`) || 0;
                const keyTime = Date.parse(`${key}T00:00:00`) || 0;
                return Math.abs(keyTime - targetTime) < Math.abs(bestTime - targetTime) ? key : best;
            }, keys[0]);
            selectWeek(nearest);
        }

        function deleteCurrentWeek() {
            const wk = String(state.activeWeek || '');
            if (!wk) return;
            if (!confirm(`確定要刪除「${getWeekDisplayTitle(wk)}」的週別資料嗎？`)) return;

            transactionUpdate(data => {
                if (!Array.isArray(data.deletedWeeks)) data.deletedWeeks = [];
                data.deletedWeeks = [...new Set(data.deletedWeeks.map(String))];
                if (!data.deletedWeeks.includes(wk)) data.deletedWeeks.push(wk);
                delete data.weeksData[wk];

                const currentKey = formatDateKey(getTuesdayOfWeek());
                const deleted = new Set(data.deletedWeeks);
                const remainingKeys = Object.keys(data.weeksData || {})
                    .filter(key => !deleted.has(String(key)))
                    .sort();

                if (!deleted.has(currentKey)) {
                    // 保留原本的行為：刪除後回本週；若本週尚未建立，只建立本週空白資料。
                    if (!data.weeksData[currentKey]) {
                        data.weeksData[currentKey] = {
                            groups: createDefaultWeekGroups(currentKey, false),
                            groups2: createDefaultWeekGroups(currentKey, true)
                        };
                    }
                    data.activeWeek = currentKey;
                } else if (remainingKeys.length) {
                    // 本週也在刪除清單時，選擇最近的既有週，不建立任何已刪除週。
                    const targetTime = Date.parse(`${currentKey}T00:00:00`) || Date.now();
                    data.activeWeek = remainingKeys.reduce((best, key) => {
                        const bestTime = Date.parse(`${best}T00:00:00`) || 0;
                        const keyTime = Date.parse(`${key}T00:00:00`) || 0;
                        return Math.abs(keyTime - targetTime) < Math.abs(bestTime - targetTime) ? key : best;
                    }, remainingKeys[0]);
                } else {
                    // 若所有既有週都已刪除，建立最近一個「未被刪除」的新週以維持介面可用。
                    const baseParts = currentKey.split('-').map(Number);
                    const baseDate = new Date(baseParts[0], baseParts[1] - 1, baseParts[2]);
                    let candidate = '';
                    for (let offset = 1; offset <= 5200 && !candidate; offset++) {
                        const future = new Date(baseDate);
                        future.setDate(future.getDate() + offset * 7);
                        const futureKey = formatDateKey(future);
                        if (!deleted.has(futureKey)) { candidate = futureKey; break; }
                        const past = new Date(baseDate);
                        past.setDate(past.getDate() - offset * 7);
                        const pastKey = formatDateKey(past);
                        if (!deleted.has(pastKey)) { candidate = pastKey; break; }
                    }
                    if (!candidate) candidate = currentKey;
                    data.weeksData[candidate] = {
                        groups: createDefaultWeekGroups(candidate, false),
                        groups2: createDefaultWeekGroups(candidate, true)
                    };
                    data.activeWeek = candidate;
                }
                return true;
            });
        }

        function isBlankPoolPlayer(p) {
            if (!p) return false;

            const textFieldsBlank =
                !String(p.level || "").trim() &&
                !String(p.name || "").trim() &&
                !String(p.job || "").trim() &&

            );

            const tagsBlank = !p.treeKing && !p.dragonKing;
            const defaultRounds = String(p.rounds || "7") === "7";

                const label = isUsed ? `大小號 ${i} (已使用${usedByName ? ': ' + usedByName : ''})` : `大小號 ${i}`;

                html += `<option value="${gKey}" class="${optionClass}" ${currentGroupId === gKey ? "selected" : ""}>${label}</option>`;

        function renderRosterPicker() {
            const { teamIdx, isTeams2, job, tag, query, availableOnly } = rosterPicker;

            const activeGroupIdx = isTeams2 ? state.activeGroup2 : state.activeGroup;

            const title = document.getElementById("roster-picker-title");
            if (title) title.textContent = `從總名單加入成員${team ? "－" + team.name : ""}`;
            const jobs = ["全部職業", ...JOB_LIST];
            const jobWrap = document.getElementById("roster-picker-jobs");
            if (jobWrap) jobWrap.innerHTML = jobs.map(j => `<button onclick="setRosterPickerJob('${j}')" class="rounded-md border px-3 py-1.5 text-xs font-semibold transition ${job === j ? "border-blue-500 bg-blue-600 text-white" : "border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700"}">${j}</button>`).join("");
            const tagWrap = document.getElementById("roster-picker-tags");
            const pickerTags = ["全部標籤", ...SHARED_TAGS.map(t => t.key === "treeKing" ? "樹王" : t.key === "dragonKing" ? "龍王" : t.filterLabel)];
            if (tagWrap) tagWrap.innerHTML =  pickerTags.map(label => `<button onclick="setRosterPickerTag('${label}')" class="rounded-md border px-3 py-1.5 text-xs font-semibold transition ${tag === label ? "border-violet-500 bg-violet-600 text-white" : "border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700"}">${escapeHtml(label)}</button>`).join("");

            const assigned = new Set((team?.members || []).map(p => String(p.id)));
            const weekData = state.weeksData?.[state.activeWeek] || {};
            const players = (state.pool || []).filter(p => {
                // 本週已達出賽場次上限的玩家，不顯示在可加入名單中。
                if (hasReachedWeeklyLimit(p, weekData)) return false;
                if (job !== "全部職業" && p.job !== job) return false;
                if (tag !== "全部標籤") {
                    const selectedTag = SHARED_TAGS.find(t => t.filterLabel === tag || (t.key === "treeKing" && tag === "樹王") || (t.key === "dragonKing" && tag === "龍王"));
                    const hasTag = selectedTag ? Boolean(p[selectedTag.key]) || (selectedTag.key === "treeKing" && Boolean(p.treeKing)) || (selectedTag.key === "dragonKing" && Boolean(p.dragonKing)) : false;
                    if (!hasTag) return false;
                }
                if (availableOnly) {
                    const availability = getPlayerWeekAvailability(p, state.activeWeek);
                    if (!String(availability[activeGroupIdx] || "").trim()) return false;
                }
                const haystack = [p.name, p.job, getPlayerLevel(p), p.position].join(" ").toLowerCase();
                return !query || haystack.includes(query);
            });
            const list = document.getElementById("roster-picker-list");

            if (!list) return;
            if (!players.length) {
                list.innerHTML = `<div class="p-10 text-center text-sm text-slate-500">沒有符合條件的玩家</div>`;

                const tags = SHARED_TAGS.filter(t => p[t.key]).map(t => t.filterLabel);
                if (p.treeKing && !tags.includes("樹王")) tags.push("樹王");
                if (p.dragonKing && !tags.includes("龍王")) tags.push("龍王");
                const already = assigned.has(String(p.id));
                const playerAvailability = getPlayerWeekAvailability(p, state.activeWeek);
                const playerDayTime = String(playerAvailability[activeGroupIdx] || "").trim();
                return `<tr class="border-b border-slate-800 hover:bg-slate-800/60"><td class="p-3 text-slate-300">${escapeHtml(getPlayerLevel(p) || "—")}</td><td class="p-3"><span class="rounded border px-2 py-1 text-xs ${getJobColorClass(p.job)}">${escapeHtml(p.job || "未設定")}</span></td><td class="p-3 font-semibold text-slate-100"><span class="inline-block w-[5em] max-w-[5em] truncate align-bottom" title="${escapeHtml(p.name || "未命名")}">${escapeHtml(p.name || "未命名")}</span></td><td class="p-3 whitespace-nowrap text-emerald-300">${escapeHtml(playerDayTime || "—")}</td><td class="p-3 text-slate-300">${escapeHtml(p.position || "—")}</td><td class="p-3 text-amber-300">${escapeHtml(p.rounds || "7")}場</td><td class="p-3 text-xs text-slate-400">${escapeHtml(tags.join("、") || "—")}</td><td class="p-3 text-right">${already ? `<span class="text-xs text-slate-500">已在此隊</span>` : `<button onclick="addRosterPlayerToTeam('${String(p.id).replaceAll("'", "\\'")}')" class="rounded-md border border-emerald-700 bg-emerald-950/60 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-900">＋ 加入</button>`}</td></tr>`;
            }).join("")}</tbody></table></div>`;

        function renderPool(isMasterView, isTeams2 = false) {
            const idSuffix = isMasterView ? "master" : (isTeams2 ? "teams2" : "teams");
            const wData = currentWeekData();
            
            // ------------------------------------------------------
            // 待排名單顯示規則
            // 6人頁：依原本的「本週出賽上限」過濾。
            // 12人頁：除了原本的上限外，只要已排進 12 人隊伍，
            // 就直接從待排名單隱藏，避免同一玩家重複安排。
            // 總名單頁：維持顯示全部玩家。
            // ------------------------------------------------------
            let displayPool = isMasterView
                ? state.pool
                : state.pool.filter(p => !hasReachedWeeklyLimit(p, wData));

            if (isTeams2 && !isMasterView) {
                displayPool = displayPool.filter(p => !isPlayerAssignedTo12Team(p.id, wData));
            }

            if (poolJobFilters.length > 0) {
                displayPool = displayPool.filter(p => poolJobFilters.includes(String(p.job || "").trim()));
            }

            if (poolTagFilter !== "all") {
                const selectedTag = SHARED_TAGS.find(tag => tag.key === poolTagFilter);
                if (selectedTag) {
                    displayPool = displayPool.filter(p => Boolean(p[selectedTag.key]));
                }
            }

            // 只有總名單套用名稱搜尋；搜尋條件僅存在本機介面狀態，不同步到 Firebase。
            if (isMasterView && masterNameQuery) {
                displayPool = displayPool.filter(p =>
                    String(p.name || "").toLowerCase().includes(masterNameQuery)
                );
            }

            // 只有 6人／12人隊伍頁面的成員名單套用日期篩選；總名單維持原本顯示方式。
            if (!isMasterView && poolDayFilter >= 0 && poolDayFilter <= 6) {
                displayPool = displayPool.filter(p => {
                    const availability = getPlayerWeekAvailability(p, state.activeWeek);
                    return String(availability[poolDayFilter] || "").trim() !== "";
                });
            }

            const getIcon = f => poolSortState.field !== f ? '↕️' : (poolSortState.direction === 'asc' ? '▲' : '▼');
            const teams = currentGroup(isTeams2).teams || [];

            let filterBarHtml = `
                <div class="flex flex-col gap-2 bg-slate-950 p-2.5 rounded-lg border border-slate-800 mb-3">
                    <div class="flex flex-wrap items-center gap-1.5">
                        <span class="text-xs text-slate-400 mr-1 font-semibold">標籤篩選：</span>
                        <button onclick="setPoolTagFilter('all')" class="text-[11px] px-2.5 py-1 rounded transition border ${poolTagFilter === 'all' ? 'bg-blue-600 border-blue-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'}">全部</button>
                        ${SHARED_TAGS.map(tag => `
                            <button onclick="setPoolTagFilter('${tag.key}')" class="text-[11px] px-2.5 py-1 rounded transition border ${poolTagFilter === tag.key ? tag.activeClass : `bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700`}">${escapeHtml(tag.filterLabel)}</button>

        // ==========================================
        // 10. 拖曳元件初始化
        // Sortable.js 負責總名單 ↔ 隊伍之間的拖曳。
        // ==========================================
        function initSortables() {
            sortableInstances.forEach(i => i.destroy());
            sortableInstances = [];
            
            document.querySelectorAll(".sortable-list").forEach(el => {
                if (el.closest(".hidden")) return;
                
                const inst = new Sortable(el, {
                    group: { name: "artale-shared-lists", pull: (to, from) => from.el.dataset.listType === "pool" ? "clone" : true },
                    draggable: ".drag-item",
                    animation: 150,
                    filter: "input, button, select",
                    preventOnFilter: false,
                    ghostClass: "sortable-ghost",
                    dragClass: "sortable-drag",
                    onEnd: function(evt) {
                        const fromType = evt.from.dataset.listType;
                        const toType = evt.to.dataset.listType;
                        const itemId = evt.item?.dataset?.id;
                        const newIndex = evt.newDraggableIndex ?? evt.newIndex;
                        
                        if (!itemId || (fromType === toType && evt.oldDraggableIndex === newIndex)) return;

                        transactionUpdate(data => {
                            const p = data.pool.find(item => String(item.id) === String(itemId));
                            if (!p) return false;
                            
                            if (fromType === "pool" && toType === "pool") {
                                data.pool = data.pool.filter(item => String(item.id) !== String(itemId));
                                data.pool.splice(newIndex, 0, p);
                                return true;
                            }
                            
                            const wData = data.weeksData[state.activeWeek];
                            const isT2 = toType.startsWith("team2_");
                            const groupsArr = isT2 ? wData.groups2 : wData.groups;
                            const targetGroup = groupsArr[isT2 ? state.activeGroup2 : state.activeGroup];
                            
                            if (fromType === "pool" && (toType.startsWith("team_") || toType.startsWith("team2_"))) {
                                const tIdx = parseInt(toType.replace(/team2?_/, ""), 10);
                                if (hasReachedWeeklyLimit(p, wData)) { 
                                    alert("已達本週出賽上限！"); 
                                    return false; 
                                }
                                const newMember = { ...p };
                                if (isT2) newMember.note = "";
                                targetGroup.teams[tIdx].members.splice(newIndex, 0, newMember);
                                return true;
                            }
                            
                            if ((fromType.startsWith("team_") || fromType.startsWith("team2_")) && (toType.startsWith("team_") || toType.startsWith("team2_"))) {
                                const fromIsT2 = fromType.startsWith("team2_");
                                const fromGroups = fromIsT2 ? wData.groups2 : wData.groups;
                                const sTeam = fromGroups[fromIsT2 ? state.activeGroup2 : state.activeGroup].teams[parseInt(fromType.replace(/team2?_/, ""), 10)].members;
                                const tTeam = targetGroup.teams[parseInt(toType.replace(/team2?_/, ""), 10)].members;
                                const idx = sTeam.findIndex(item => String(item.id) === String(itemId));
                                
                                if (idx > -1) {
                                    const [moved] = sTeam.splice(idx, 1);
                                    tTeam.splice(newIndex, 0, moved);
                                    return true;
                                }
                            }
                            return false;
                        });
                    }
                });
                sortableInstances.push(inst);
            });
        }

        // ==========================================
        // 11. 圖片匯出與 Modal 功能
        // 產生隊伍圖片、預覽、複製與下載。
        // ==========================================
        function formatShareHeader(isTeams2 = false) {
            return `
                <div class="share-row-item" style="border-bottom: 1px solid #334155; padding-bottom: 2px; margin-bottom: 4px; font-weight: 700; color: #94a3b8; font-size: 13px;">
                    <div class="share-col-level">等級</div>
                    <div class="share-col-job">職業</div>
                    <div class="share-col-name">名字</div>
                    <div class="share-col-part">${isTeams2 ? '位置' : '場次'}</div>
                </div>
            `;
        }

        function formatShareLine(player, isTeams2 = false) {
            const level = getPlayerLevel(player);
            let nameStr = player.name || "";
            if (nameStr.length > 7) {
                nameStr = nameStr.slice(0, 7);
            }

            let lastColText = "";
            if (isTeams2) {
                lastColText = player.note || "";
            } else {
                if (player.part === "first") lastColText = "前7場";
                else if (player.part === "second") lastColText = "後7場";
            }

            return `
                <div class="share-row-item">
                    <div class="share-col-level">${escapeHtml(level || "---")}</div>
                    <div class="share-col-job">${escapeHtml(player.job || "")}</div>
                    <div class="share-col-name">${escapeHtml(nameStr)}</div>
                    <div class="share-col-part">${escapeHtml(lastColText)}</div>
                </div>
            `;
        }

        let imageGenSelectedIndices = [];
        let imageGenerationToken = 0;
        // 圖片內標題：可在預覽視窗自行輸入，例如「樹王團」或「龍王團」。
        let imageExportTitle = "";
        let imageExportTagFilter = "";

        function renderImageDayButtons() { /* 每張圖片的日期按鈕由 renderImageCards 個別繪製 */ }

        async function openImageGenModal(isTeams2 = false) {
            pendingImageGenIsTeams2 = isTeams2;
            imageExportTagFilter = "";
            imageExportTitle = "";
            const wData = currentWeekData();
            const groupsArr = isTeams2 ? wData.groups2 : wData.groups;
            imageGenSelectedIndices = groupsArr.map((g, i) => ({g, i})).filter(x => (x.g.teams || []).some(t => (t.members || []).length > 0)).map(x => x.i);
            await generateSelectedTeamsImage(false);
        }

        async function toggleImageTagDay(tagKey, gIdx) {
            const item = previewImages.find(x => x.tagKey === tagKey);
            if (!item) return;
            const idx = item.selectedIndices.indexOf(gIdx);
            if (idx >= 0) item.selectedIndices.splice(idx, 1);
            else item.selectedIndices.push(gIdx);
            item.selectedIndices.sort((a,b) => a-b);
            await regenerateTagImage(tagKey);
        }

        function buildTagImageMarkup(tag, selectedIndices, isTeams2, groupsArr) {
            let columnsHtml = "", count = 0;
            selectedIndices.forEach(gIdx => {
                const group = groupsArr[gIdx];
                if (!group) return;
                const filteredTeams = (group.teams || []).filter(t => (t.members || []).length > 0 && t.tag === tag.key);
                if (!filteredTeams.length) return;
                let colHtml = `<div class="share-group-column"><div class="share-group-header-text">${escapeHtml(group.date ? `${GROUP_NAMES[gIdx]} -${group.date}` : GROUP_NAMES[gIdx])}</div>`;
                filteredTeams.forEach(team => {
                    colHtml += `<div class="share-team-wrapper"><div class="share-team-title-text">${team.emoji || "⚔️"} ${escapeHtml(team.name)} (${escapeHtml(team.time || "20:00")}) (${team.members.length}人)${team.con ? " (連14場)" : " (連7場)"}</div>`;
                    colHtml += formatShareHeader(isTeams2);
                    team.members.forEach((p, pIdx) => {
                        if (isTeams2 && pIdx > 0 && pIdx % 6 === 0) colHtml += `<div class="share-divider-line"></div>`;
                        colHtml += formatShareLine(p, isTeams2);
                    });
                    colHtml += `</div>`;
                });
                colHtml += `</div>`;
                columnsHtml += colHtml;
                count++;
            });
            if (!count) return "";
            const titleHtml = `<div class="share-export-title">${escapeHtml(tag.imageLabel)}</div>`;
            return `<div class="share-card-inner">${titleHtml}<div class="share-export-columns">${columnsHtml}</div></div>`;
        }

        async function generateSelectedTeamsImage(showAlertOnEmpty = true) {
            const generationToken = ++imageGenerationToken;
            if (typeof html2canvas === "undefined") return false;
            const wData = currentWeekData();
            const groupsArr = pendingImageGenIsTeams2 ? wData.groups2 : wData.groups;
            const shareCard = document.getElementById("share-card");
            const newImages = [];
            for (const tag of SHARED_TAGS) {
                const availableIndices = groupsArr.map((g, i) => ({g, i})).filter(x => (x.g.teams || []).some(t => t.tag === tag.key && (t.members || []).length > 0)).map(x => x.i);
                if (!availableIndices.length) continue;
                const markup = buildTagImageMarkup(tag, availableIndices, pendingImageGenIsTeams2, groupsArr);
                if (!markup) continue;
                shareCard.innerHTML = markup;
                try {
                    await new Promise(r => requestAnimationFrame(r));
                    const canvas = await html2canvas(shareCard.firstElementChild, { scale: 2, useCORS: true, backgroundColor: "#111111", logging: false });
                    if (generationToken !== imageGenerationToken) return false;
                    newImages.push({ tagKey: tag.key, title: tag.imageLabel, dataUrl: canvas.toDataURL("image/png"), selectedIndices: [...availableIndices] });
                } catch(e) {
                    if (generationToken === imageGenerationToken) alert("圖片產生失敗，請稍後再試！");
                    return false;
                } finally {
                    shareCard.innerHTML = "";
                }
            }
            if (generationToken !== imageGenerationToken) return false;
            if (!newImages.length) {
                if (showAlertOnEmpty) alert("目前沒有已設定標籤且有成員的隊伍可產生圖片。");
                return false;
            }
            previewImages = newImages;
            renderImageCards();
            showModal();
            return true;
        }

        async function regenerateTagImage(tagKey) {
            const item = previewImages.find(x => x.tagKey === tagKey);
            const tag = SHARED_TAGS.find(x => x.key === tagKey);
            if (!item || !tag || typeof html2canvas === "undefined") return;
            const token = ++imageGenerationToken;
            const wData = currentWeekData();
            const groupsArr = pendingImageGenIsTeams2 ? wData.groups2 : wData.groups;
            const markup = buildTagImageMarkup(tag, item.selectedIndices, pendingImageGenIsTeams2, groupsArr);
            if (!markup) {
                item.dataUrl = "";
            } else {
                const shareCard = document.getElementById("share-card");
                shareCard.innerHTML = markup;
                try {
                    await new Promise(r => requestAnimationFrame(r));
                    const canvas = await html2canvas(shareCard.firstElementChild, { scale: 2, useCORS: true, backgroundColor: "#111111", logging: false });
                    if (token !== imageGenerationToken) return;
                    item.dataUrl = canvas.toDataURL("image/png");
                } catch(e) { alert("圖片更新失敗，請稍後再試！"); }
                finally { shareCard.innerHTML = ""; }
            }
            if (token === imageGenerationToken) renderImageCards();
        }

        function renderImageCards() {
            const container = document.getElementById("image-list");
            if (!container) return;
            const wData = currentWeekData();
            const groupsArr = pendingImageGenIsTeams2 ? wData.groups2 : wData.groups;
            container.innerHTML = previewImages.map((item, idx) => {
                const tag = SHARED_TAGS.find(t => t.key === item.tagKey);
                const dateButtons = groupsArr.map((group, gIdx) => {
                    const has = (group.teams || []).some(t => t.tag === item.tagKey && (t.members || []).length > 0);
                    const selected = item.selectedIndices.includes(gIdx);
                    return `<button type="button" onclick="toggleImageTagDay('${item.tagKey}',${gIdx})" ${has ? "" : "disabled"} class="rounded-lg border px-2.5 py-1.5 text-xs font-semibold ${selected ? "border-blue-600 bg-blue-600 text-white" : "border-slate-700 bg-slate-800 text-slate-300"} ${has ? "" : "cursor-not-allowed opacity-40"}">${GROUP_NAMES[gIdx]}${group.date ? ` (${escapeHtml(group.date)})` : ""}</button>`;
                }).join("");
                return `<section class="rounded-xl border border-slate-700 bg-slate-900 p-4">
                    <h4 class="mb-3 text-base font-bold text-slate-100">${escapeHtml(item.title)}</h4>
                    ${item.dataUrl ? `<div class="mb-3 flex justify-center rounded-lg bg-black/30 p-2"><img class="max-h-[48vh] max-w-full rounded object-contain" src="${item.dataUrl}" alt="${escapeHtml(item.title)}"></div>` : `<div class="mb-3 rounded-lg bg-slate-950 p-6 text-center text-sm text-slate-400">請至少選擇一個有此標籤的日期</div>`}
                    <div class="mb-3 flex flex-wrap gap-2">${dateButtons}</div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="copyPreviewImage(${idx})" ${item.dataUrl ? "" : "disabled"} class="rounded-lg border border-blue-600 bg-blue-600/20 px-3 py-1.5 text-xs font-semibold text-blue-300 disabled:opacity-40">📋 複製圖片</button>
                        <button type="button" onclick="downloadPreviewImage(${idx})" ${item.dataUrl ? "" : "disabled"} class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-40">💾 下載圖片</button>
                    </div>
                </section>`;
            }).join("");
        }

        async function copyPreviewImage(index) {
            const item = previewImages[index];
            if (!item || !item.dataUrl) return;
            try {
                const blob = await (await fetch(item.dataUrl)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                alert(`已複製「${item.title}」圖片！`);
            } catch(e) { alert("複製失敗，請確認瀏覽器允許剪貼簿權限。"); }
        }

        function downloadPreviewImage(index) {
            const item = previewImages[index];
            if (!item || !item.dataUrl) return;
            const link = document.createElement("a");
            link.download = `Artale_${item.title.replace(/[\\/:*?"<>|]/g, "_")}.png`;
            link.href = item.dataUrl;
            link.click();
        }
