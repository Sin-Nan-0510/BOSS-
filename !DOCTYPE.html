<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 隊伍分配</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        button, input, textarea, select { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .drag-item { cursor: grab; }
        .drag-item:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }
        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: 600px;
            pointer-events: none;
        }
        .share-card-inner {
            width: 600px;
            padding: 24px 28px;
            background: #111111;
            color: #d1d5db;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .share-group-header-text {
            font-size: 26px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .share-team-title-text {
            font-size: 21px;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 14px;
            margin-bottom: 6px;
        }
        .share-row-item {
            display: flex;
            align-items: center;
            font-size: 16px;
            line-height: 1.55;
            color: #e5e7eb;
            margin-bottom: 4px;
        }
        .share-col-level {
            width: 80px;
            text-align: right;
            margin-right: 16px;
            color: #93c5fd;
            font-weight: 600;
            flex-shrink: 0;
        }
        .share-col-job {
            width: 120px;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .share-col-name {
            flex: 1;
            word-break: break-all;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">
    <div class="mx-auto max-w-7xl">
        <header class="mb-6 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wide text-blue-400 md:text-4xl">
                Artale 隊伍分配
            </h1>
            <p id="sync-status" class="mt-1 text-[11px] text-slate-500">☁ Firebase 連線中...</p>
        </header>

        <!-- 週別切換區塊 -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 p-4 shadow-md">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-bold text-slate-300">📅 切換週別：</span>
                <button onclick="switchWeekRelative(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">◀ 上一週</button>
                <select id="week-select" onchange="selectWeek(this.value)" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-1.5 text-sm font-bold text-blue-400 focus:border-blue-500 focus:outline-none">
                </select>
                <button onclick="switchWeekRelative(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">下一週 ▶</button>
                <button onclick="jumpToCurrentWeek()" class="rounded-lg border border-blue-900 bg-blue-950 px-2.5 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-900/50 transition">回到本週</button>
                <button id="btn-delete-week" onclick="deleteCurrentWeek()" class="hidden rounded-lg border border-rose-900 bg-rose-950/80 px-2.5 py-1.5 text-xs font-semibold text-rose-300 hover:bg-rose-900 transition">🗑️ 刪除此週</button>
            </div>
            <div class="text-xs text-slate-400">
                💡 切換週別時，<span class="text-blue-400 font-semibold">等級/職業/名字/ADAP</span> 全週保留，僅<span class="text-emerald-400 font-semibold">填寫時間與隊伍分配</span>按週獨立。
            </div>
        </div>

        <div class="mb-6 grid grid-cols-2 gap-2 rounded-xl border border-slate-800 bg-slate-900/90 p-1.5 shadow-md">
            <button id="tab-btn-master" onclick="switchTab('master')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>📋</span> 總名單 <span id="master-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0人</span>
            </button>
            <button id="tab-btn-teams" onclick="switchTab('teams')" class="flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold transition-all duration-200">
                <span>⚔️</span> 隊伍分配 <span id="teams-tab-badge" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">0/18</span>
            </button>
        </div>

        <main class="space-y-6">
            <div id="tab-content-master" class="space-y-6 hidden">
                <div id="master-view-container"></div>
            </div>

            <div id="tab-content-teams" class="space-y-6 hidden">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-base font-bold text-slate-200">遠征團管理</h2>
                    </div>
                    <div id="group-tabs" class="mt-4 flex flex-wrap gap-3"></div>
                </div>

                <div id="teams-cards-container" class="space-y-6"></div>
                <div id="teams-pool-container"></div>

                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                        <button onclick="generateAllTeamsImage()" class="rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">🖼️ 產生全部團隊圖片</button>
                        <button onclick="clearCurrentGroup()" class="rounded-lg border border-slate-800 bg-slate-800 px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-700">🧹 清空當前團隊伍</button>
                        <button onclick="clearAllData()" class="rounded-lg border border-slate-800 bg-slate-800 px-4 py-3 text-sm font-medium text-rose-400 transition hover:bg-slate-700">⚠️ 清空全部資料</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="share-card"></div>

    <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="relative flex max-h-[90vh] w-full max-w-4xl flex-col rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">團隊圖片預覽</h3>
                <button onclick="closeModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
            </div>
            <div class="relative flex flex-1 items-center justify-center overflow-auto rounded-lg bg-slate-950 p-2">
                <img id="modal-img" class="max-h-[60vh] rounded object-contain shadow-lg" src="" alt="團隊圖片預覽">
            </div>
            <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800 pt-4">
                <div class="flex items-center gap-2">
                    <button id="btn-prev" onclick="changeImage(-1)" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700 disabled:opacity-40">◀ 上一頁</button>
                    <span id="modal-page-info" class="text-xs font-semibold text-slate-400">1 / 1</span>
                    <button id="btn-next" onclick="changeImage(1)" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700 disabled:opacity-40">下一頁 ▶</button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-copy-img" onclick="copyModalImage()" class="rounded-lg border border-blue-600 bg-blue-600/20 px-3 py-1.5 text-xs font-semibold text-blue-300 hover:bg-blue-600/40 transition-colors">📋 複製圖片</button>
                    <button onclick="downloadModalImage()" class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500">💾 下載圖片</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbD0DlTCKkDzjkyADmovtjSe6j6blClZI",
            authDomain: "boss-3a974.firebaseapp.com",
            databaseURL: "https://boss-3a974-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "boss-3a974",
            storageBucket: "boss-3a974.firebasestorage.app",
            messagingSenderId: "603044171845",
            appId: "1:603044171845:web:555b0aacbf90b8699b532c"
        };

        const FIREBASE_PATH = "artale_party_state_v3";
        const STORAGE_KEY = "artale_party_local_v3";
        const MAX_GROUPS = 7;
        const MAX_TEAM_SIZE = 6;
        const GROUP_NAMES = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];
        const WEEKDAYS = ["週二", "週三", "週四", "週五", "週六", "週日", "週一"];

        let database = null;
        let firebaseEnabled = false;
        let sortableInstances = [];
        let currentTab = "master";
        let copyBtnTimer = null;
        let previewImages = [];
        let currentImageIndex = 0;

        let state = {
            activeWeek: formatDateKey(getTuesdayOfWeek()),
            activeGroup: 0,
            filterAvailableOnly: true,
            pool: [],
            weeksData: {}
        };

        function getTuesdayOfWeek(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            let diffToTuesday = (day >= 2) ? (2 - day) : (2 - day - 7);
            date.setDate(date.getDate() + diffToTuesday);
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getWeekDisplayTitle(weekKey) {
            if (!weekKey) return "";
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return weekKey;
            const start = new Date(parts[0], parts[1] - 1, parts[2]);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            const year = start.getFullYear();
            
            const startM = String(start.getMonth() + 1).padStart(2, '0');
            const startD = String(start.getDate()).padStart(2, '0');
            const startW = weekdays[start.getDay()];

            const endM = end.getMonth() + 1;
            const endD = String(end.getDate()).padStart(2, '0');
            const endW = weekdays[end.getDay()];

            const startStr = `${year} ${startM}/${startD}(${startW})`;
            const endStr = `${endM}/${endD}(${endW})`;
            
            const thisTuesdayKey = formatDateKey(getTuesdayOfWeek());
            let tag = "";
            if (weekKey === thisTuesdayKey) {
                tag = " (本週)";
            } else {
                const nextTuesday = getTuesdayOfWeek();
                nextTuesday.setDate(nextTuesday.getDate() + 7);
                if (weekKey === formatDateKey(nextTuesday)) {
                    tag = " (下週)";
                } else {
                    const lastTuesday = getTuesdayOfWeek();
                    lastTuesday.setDate(lastTuesday.getDate() - 7);
                    if (weekKey === formatDateKey(lastTuesday)) {
                        tag = " (上週)";
                    }
                }
            }
            return `${startStr} ~${endStr}${tag}`;
        }

        function isTwoWeeksAgoOrEarlier(weekKey) {
            if (!weekKey) return false;
            const parts = weekKey.split('-').map(Number);
            if (parts.length < 3) return false;
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const twoWeeksAgo = getTuesdayOfWeek();
            twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
            return targetDate <= twoWeeksAgo;
        }

        function makeId() {
            return Date.now() + "-" + Math.random().toString(36).substring(2, 10);
        }

        function emptyGroup() {
            return { team1: [], team2: [], team3: [], time1: "20:00", time2: "20:00", time3: "20:00", date: "" };
        }

        function createDefaultWeekGroups(weekKey) {
            const parts = (weekKey || formatDateKey(getTuesdayOfWeek())).split('-').map(Number);
            const startDate = (parts.length === 3) ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();

            return Array.from({ length: MAX_GROUPS }, (_, i) => {
                const targetDate = new Date(startDate);
                targetDate.setDate(startDate.getDate() + i);
                const dateStr = `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
                return {
                    team1: [], team2: [], team3: [],
                    time1: "20:00", time2: "20:00", time3: "20:00",
                    date: dateStr
                };
            });
        }

        function createEmptyFirebaseData() {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            return {
                activeWeek: defaultWeekKey,
                pool: [],
                weeksData: {
                    [defaultWeekKey]: { groups: createDefaultWeekGroups(defaultWeekKey) }
                }
            };
        }

        function setSyncStatus(text, className = "text-[11px] text-slate-500") {
            const el = document.getElementById("sync-status");
            if (!el) return;
            el.className = `mt-1 ${className}`;
            el.textContent = text;
        }

        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            firebaseEnabled = true;
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
            firebaseEnabled = false;
            setSyncStatus("⚠ Firebase 初始化失敗，使用本機儲存", "text-[11px] text-rose-400");
        }

        if (firebaseEnabled) {
            database.ref(".info/connected").on("value", snapshot => {
                if (snapshot.val() === true) {
                    setSyncStatus("☁ 已連線到 Firebase", "text-[11px] text-emerald-400");
                } else {
                    setSyncStatus("☁ Firebase 連線中...", "text-[11px] text-amber-400");
                }
            });
        }

        function isLevel(value) {
            return /^(?:lv\.?\s*)?\d+$/i.test(String(value || "").trim());
        }

        function normalizeLevel(value) {
            const text = String(value || "").trim();
            const match = text.match(/\d+/);
            return match ? match[0] : "";
        }

        function getPlayerLevel(player) {
            if (!player) return "";
            const possibleFields = [
                player.level, player.lv, player["等級"],
                player.levelText, player.levelDisplay,
                player.levelNumber, player.levelValue, player["等級數字"]
            ];
            for (const value of possibleFields) {
                if (isLevel(value)) {
                    const level = normalizeLevel(value);
                    if (level) return level;
                }
            }
            return "";
        }

        function normalizeAvailabilityArray(arr) {
            const defaultArr = ["", "", "", "", "", "", ""];
            if (!Array.isArray(arr)) return defaultArr;
            return defaultArr.map((_, i) => typeof arr[i] === "string" ? arr[i] : "");
        }

        function normalizePlayerAvailability(availObjOrArr, activeWeekKey) {
            if (Array.isArray(availObjOrArr)) {
                return {
                    [activeWeekKey]: normalizeAvailabilityArray(availObjOrArr)
                };
            }
            if (availObjOrArr && typeof availObjOrArr === "object") {
                const res = {};
                for (const wk in availObjOrArr) {
                    res[wk] = normalizeAvailabilityArray(availObjOrArr[wk]);
                }
                return res;
            }
            return {
                [activeWeekKey]: ["", "", "", "", "", "", ""]
            };
        }

        function getPlayerWeekAvailability(player, weekKey) {
            if (!player || !player.availability) return ["", "", "", "", "", "", ""];
            if (Array.isArray(player.availability)) {
                return normalizeAvailabilityArray(player.availability);
            }
            if (typeof player.availability === "object") {
                return normalizeAvailabilityArray(player.availability[weekKey]);
            }
            return ["", "", "", "", "", "", ""];
        }

        function normalizePlayer(player, activeWeekKey) {
            if (!player || typeof player !== "object") return null;
            const currentWeekKey = activeWeekKey || formatDateKey(getTuesdayOfWeek());
            
            const result = {
                id: String(player.id || makeId()),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "").trim(),
                position: String(player.position || player["AD/AP"] || player["位置"] || "").trim(),
                availability: normalizePlayerAvailability(player.availability, currentWeekKey),
                note: String(player.note || player["備註"] || "").trim()
            };

            if (!player.position && !player["AD/AP"] && !player["位置"] && result.job) {
                const match = result.job.match(/^(.*?)\s*\((.*?)\)\s*$/);
                if (match) {
                    result.job = match[1].trim();
                    result.position = match[2].trim();
                }
            }
            return result;
        }

        function normalizeWeekGroupData(weekData, weekKey) {
            if (!weekData || typeof weekData !== "object") {
                return { groups: createDefaultWeekGroups(weekKey) };
            }
            let groups = Array.isArray(weekData.groups) ? weekData.groups.slice(0, MAX_GROUPS) : [];
            const defaultGroups = createDefaultWeekGroups(weekKey);

            while (groups.length < MAX_GROUPS) {
                groups.push(defaultGroups[groups.length]);
            }

            groups = groups.map((group, idx) => {
                if (!group || typeof group !== "object") return defaultGroups[idx];
                return {
                    team1: Array.isArray(group.team1) ? group.team1.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    team2: Array.isArray(group.team2) ? group.team2.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    team3: Array.isArray(group.team3) ? group.team3.map(p => normalizePlayer(p, weekKey)).filter(Boolean) : [],
                    time1: typeof group.time1 === "string" && group.time1 ? group.time1 : (typeof group.time === "string" && group.time ? group.time : "20:00"),
                    time2: typeof group.time2 === "string" && group.time2 ? group.time2 : (typeof group.time === "string" && group.time ? group.time : "20:00"),
                    time3: typeof group.time3 === "string" && group.time3 ? group.time3 : (typeof group.time === "string" && group.time ? group.time : "20:00"),
                    date: typeof group.date === "string" && group.date ? group.date : defaultGroups[idx].date
                };
            });

            return { groups };
        }

        function normalizeFirebaseData(data) {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());

            if (!data || typeof data !== "object") {
                return createEmptyFirebaseData();
            }

            let activeWeek = typeof data.activeWeek === "string" && data.activeWeek ? data.activeWeek : defaultWeekKey;

            let weeksData = {};
            if (data.weeksData && typeof data.weeksData === "object") {
                for (const wk in data.weeksData) {
                    weeksData[wk] = normalizeWeekGroupData(data.weeksData[wk], wk);
                }
            } else if (Array.isArray(data.groups)) {
                weeksData[defaultWeekKey] = normalizeWeekGroupData({ groups: data.groups }, defaultWeekKey);
            }

            if (!weeksData[activeWeek]) {
                weeksData[activeWeek] = { groups: createDefaultWeekGroups(activeWeek) };
            }

            const pool = Array.isArray(data.pool)
                ? data.pool.map(p => normalizePlayer(p, activeWeek)).filter(Boolean)
                : [];

            return {
                activeWeek,
                weeksData,
                pool
            };
        }

        function applyFirebaseDataToLocal(data) {
            const normalized = normalizeFirebaseData(data);
            const activeGroup = Math.min(
                Math.max(Number.isInteger(state.activeGroup) ? state.activeGroup : 0, 0),
                MAX_GROUPS - 1
            );
            state = {
                activeWeek: normalized.activeWeek,
                activeGroup,
                filterAvailableOnly: typeof state.filterAvailableOnly === "boolean" ? state.filterAvailableOnly : true,
                pool: normalized.pool,
                weeksData: normalized.weeksData
            };
        }

        function currentWeekData() {
            if (!state.weeksData || !state.weeksData[state.activeWeek]) {
                return { groups: createDefaultWeekGroups(state.activeWeek) };
            }
            return state.weeksData[state.activeWeek];
        }

        function currentGroup() {
            const wData = currentWeekData();
            return wData.groups[state.activeGroup] || emptyGroup();
        }

        function saveLocalState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    activeWeek: state.activeWeek,
                    pool: state.pool,
                    weeksData: state.weeksData
                }));
            } catch (error) {
                console.error("LocalStorage 儲存失敗：", error);
            }
        }

        function loadLocalState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
                applyFirebaseDataToLocal(saved);
            } catch (error) {
                applyFirebaseDataToLocal(null);
            }
            render();
        }

        async function transactionUpdate(mutator) {
            if (!firebaseEnabled) {
                const localData = normalizeFirebaseData({
                    activeWeek: state.activeWeek,
                    pool: state.pool,
                    weeksData: state.weeksData
                });
                const changed = mutator(localData);
                if (changed !== false) {
                    applyFirebaseDataToLocal(localData);
                    saveLocalState();
                    render();
                }
                return;
            }

            try {
                const ref = database.ref(FIREBASE_PATH);
                const result = await ref.transaction(currentData => {
                    if (currentData === null) {
                        const fresh = createEmptyFirebaseData();
                        const changed = mutator(fresh);
                        return changed === false ? null : fresh;
                    }

                    const latest = normalizeFirebaseData(currentData);
                    const changed = mutator(latest);
                    return changed === false ? currentData : latest;
                });

                if (result && result.snapshot) {
                    applyFirebaseDataToLocal(result.snapshot.val());
                    render();
                }
            } catch (error) {
                console.error("Firebase transaction 失敗：", error);
                alert("資料同步失敗，請確認 Firebase 連線。");
            }
        }

        function initFirebaseListener() {
            if (!firebaseEnabled) {
                loadLocalState();
                return;
            }

            database.ref(FIREBASE_PATH).on("value", snapshot => {
                applyFirebaseDataToLocal(snapshot.val());
                render();
            }, error => {
                console.error("Firebase 讀取失敗：", error);
                setSyncStatus("⚠ Firebase 讀取失敗", "text-[11px] text-rose-400");
            });

            database.ref(FIREBASE_PATH).transaction(currentData => {
                return currentData === null ? createEmptyFirebaseData() : currentData;
            }).catch(error => {
                console.error("Firebase 初始化資料失敗：", error);
            });
        }

        function getAvailableWeekKeys() {
            const keysSet = new Set(Object.keys(state.weeksData || {}));
            const baseTue = getTuesdayOfWeek();
            for (let offset = -1; offset <= 2; offset++) {
                const d = new Date(baseTue);
                d.setDate(d.getDate() + offset * 7);
                keysSet.add(formatDateKey(d));
            }
            return Array.from(keysSet).sort();
        }

        function selectWeek(weekKey) {
            if (!weekKey) return;
            transactionUpdate(data => {
                data.activeWeek = weekKey;
                if (!data.weeksData) data.weeksData = {};
                if (!data.weeksData[weekKey]) {
                    data.weeksData[weekKey] = { groups: createDefaultWeekGroups(weekKey) };
                }
                return true;
            });
        }

        function switchWeekRelative(delta) {
            const parts = state.activeWeek.split('-').map(Number);
            const currTue = (parts.length === 3) ? new Date(parts[0], parts[1] - 1, parts[2]) : getTuesdayOfWeek();
            currTue.setDate(currTue.getDate() + delta * 7);
            const targetKey = formatDateKey(currTue);
            selectWeek(targetKey);
        }

        function jumpToCurrentWeek() {
            const thisTueKey = formatDateKey(getTuesdayOfWeek());
            selectWeek(thisTueKey);
        }

        function deleteCurrentWeek() {
            const targetWeek = state.activeWeek;
            if (!isTwoWeeksAgoOrEarlier(targetWeek)) return;

            const title = getWeekDisplayTitle(targetWeek);
            if (!confirm(`確定要刪除「${title}」的週別資料嗎？\n\n刪除後該週的隊伍分配與時間填寫紀錄將被清除，此操作無法復原。`)) {
                return;
            }

            const thisTueKey = formatDateKey(getTuesdayOfWeek());

            transactionUpdate(data => {
                if (data.weeksData && data.weeksData[targetWeek]) {
                    delete data.weeksData[targetWeek];
                }

                if (data.pool) {
                    data.pool.forEach(player => {
                        if (player.availability && typeof player.availability === 'object' && !Array.isArray(player.availability)) {
                            delete player.availability[targetWeek];
                        }
                    });
                }

                data.activeWeek = thisTueKey;
                if (!data.weeksData[thisTueKey]) {
                    data.weeksData[thisTueKey] = { groups: createDefaultWeekGroups(thisTueKey) };
                }
                return true;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            render();
        }

        function selectGroup(index) {
            if (index < 0 || index >= MAX_GROUPS) return;
            state.activeGroup = index;
            render();
        }

        function toggleFilterAvailable() {
            state.filterAvailableOnly = !state.filterAvailableOnly;
            render();
        }

        function updateTeamTime(teamName, time) {
            const activeWeekKey = state.activeWeek;
            const groupIndex = state.activeGroup;
            const timeKey = teamName === "team1" ? "time1" : (teamName === "team2" ? "time2" : "time3");
            transactionUpdate(data => {
                if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                const group = data.weeksData[activeWeekKey].groups[groupIndex];
                if (!group) return false;
                group[timeKey] = String(time || "20:00").trim();
                return true;
            });
        }

        function updateGroupDate(index, date) {
            const activeWeekKey = state.activeWeek;
            transactionUpdate(data => {
                if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                const group = data.weeksData[activeWeekKey].groups[index];
                if (!group) return false;
                group.date = String(date || "").trim();
                return true;
            });
        }

        function getWeekday(date) {
            if (!date) return "";
            const parts = String(date).split("/");
            if (parts.length < 2) return "";
            const month = Number(parts[0]);
            const day = Number(parts[1]);
            const year = new Date().getFullYear();
            const d = new Date(year, month - 1, day);
            if (d.getMonth() !== month - 1 || d.getDate() !== day) return "";
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            return weekdays[d.getDay()];
        }

        function updatePlayerField(playerId, field, value) {
            const normalizedValue = field === "level" ? normalizeLevel(value) : String(value || "");

            transactionUpdate(data => {
                const poolPlayer = data.pool.find(p => String(p.id) === String(playerId));
                if (poolPlayer) {
                    poolPlayer[field] = normalizedValue;
                }

                if (data.weeksData) {
                    for (const wk in data.weeksData) {
                        const wData = data.weeksData[wk];
                        if (wData && wData.groups) {
                            wData.groups.forEach(group => {
                                ["team1", "team2", "team3"].forEach(teamKey => {
                                    if (group[teamKey]) {
                                        group[teamKey].forEach(teamPlayer => {
                                            if (String(teamPlayer.id) === String(playerId)) {
                                                teamPlayer[field] = normalizedValue;
                                            }
                                        });
                                    }
                                });
                            });
                        }
                    }
                }
                return true;
            });
        }

        function updatePlayerAvailability(playerId, dayIndex, value) {
            const currentWeekKey = state.activeWeek;
            transactionUpdate(data => {
                const updateTarget = (p) => {
                    if (!p.availability) p.availability = {};
                    if (Array.isArray(p.availability)) {
                        p.availability = { [currentWeekKey]: [...p.availability] };
                    }
                    if (!p.availability[currentWeekKey]) {
                        p.availability[currentWeekKey] = ["", "", "", "", "", "", ""];
                    }
                    p.availability[currentWeekKey][dayIndex] = String(value || "");
                };

                const poolPlayer = data.pool.find(p => String(p.id) === String(playerId));
                if (poolPlayer) updateTarget(poolPlayer);

                if (data.weeksData) {
                    for (const wk in data.weeksData) {
                        const wData = data.weeksData[wk];
                        if (wData && wData.groups) {
                            wData.groups.forEach(group => {
                                ["team1", "team2", "team3"].forEach(teamKey => {
                                    if (group[teamKey]) {
                                        group[teamKey].forEach(teamPlayer => {
                                            if (String(teamPlayer.id) === String(playerId)) {
                                                updateTarget(teamPlayer);
                                            }
                                        });
                                    }
                                });
                            });
                        }
                    }
                }
                return true;
            });
        }

        function addEmptyPoolPlayer() {
            const currentWeekKey = state.activeWeek;
            const newPlayer = {
                id: makeId(),
                level: "",
                name: "",
                job: "",
                position: "",
                availability: {
                    [currentWeekKey]: ["", "", "", "", "", "", ""]
                },
                note: ""
            };

            transactionUpdate(data => {
                data.pool.push(newPlayer);
                return true;
            });
        }

        function deletePoolPlayer(playerId) {
            const player = state.pool.find(p => String(p.id) === String(playerId));
            if (!player) return;
            const name = player.name || "未命名玩家";
            if (!confirm(`確定要刪除「${name}」嗎？\n這將會同步從所有週別與隊伍中刪除此成員。`)) return;

            transactionUpdate(data => {
                data.pool = data.pool.filter(item => String(item.id) !== String(playerId));
                
                if (data.weeksData) {
                    for (const wk in data.weeksData) {
                        const wData = data.weeksData[wk];
                        if (wData && wData.groups) {
                            wData.groups.forEach(g => {
                                if (g.team1) g.team1 = g.team1.filter(item => String(item.id) !== String(playerId));
                                if (g.team2) g.team2 = g.team2.filter(item => String(item.id) !== String(playerId));
                                if (g.team3) g.team3 = g.team3.filter(item => String(item.id) !== String(playerId));
                            });
                        }
                    }
                }

                return true;
            });
        }

        function sendToTeam(playerId, targetTeam) {
            const player = state.pool.find(p => String(p.id) === String(playerId));
            if (!player) return;
            const activeWeekKey = state.activeWeek;
            const groupIndex = state.activeGroup;

            transactionUpdate(data => {
                if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                const group = data.weeksData[activeWeekKey].groups[groupIndex];
                if (!group) return false;
                if (!group[targetTeam]) group[targetTeam] = [];
                if (group[targetTeam].length >= MAX_TEAM_SIZE) {
                    const label = targetTeam === "team1" ? "第一隊" : (targetTeam === "team2" ? "第二隊" : "第三隊");
                    alert(`${label}已滿（6人）`);
                    return false;
                }

                if (group[targetTeam].some(item => String(item.id) === String(player.id))) {
                    alert(`「${player.name || '此玩家'}」已經在該隊伍中！`);
                    return false;
                }

                group[targetTeam].push({ ...player });
                return true;
            });
        }

        function removeFromTeam(teamName, teamIndex) {
            const activeWeekKey = state.activeWeek;
            const groupIndex = state.activeGroup;
            transactionUpdate(data => {
                if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                const group = data.weeksData[activeWeekKey].groups[groupIndex];
                if (!group || !group[teamName]) return false;
                group[teamName].splice(teamIndex, 1);
                return true;
            });
        }

        function clearCurrentGroup() {
            const activeWeekKey = state.activeWeek;
            const groupIndex = state.activeGroup;
            const group = currentGroup();
            if (!group) return;

            const total = (group.team1?.length || 0) + (group.team2?.length || 0) + (group.team3?.length || 0);
            const groupName = GROUP_NAMES[groupIndex] || `第 ${groupIndex + 1} 團`;
            if (!confirm(`確定要清空 ${groupName} 的隊伍成員嗎？\n\n目前共有 ${total} 人。\n（總名單不受影響）`)) return;

            transactionUpdate(data => {
                if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                const target = data.weeksData[activeWeekKey].groups[groupIndex];
                if (!target) return false;
                target.team1 = [];
                target.team2 = [];
                target.team3 = [];
                target.time1 = "20:00";
                target.time2 = "20:00";
                target.time3 = "20:00";
                return true;
            });
        }

        function clearAllData() {
            if (!confirm("確定要清空全部資料（含總名單與所有週別隊伍）嗎？\n\n清空後會恢復成預設空白。")) return;

            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            transactionUpdate(data => {
                data.pool = [];
                data.activeWeek = defaultWeekKey;
                data.weeksData = {
                    [defaultWeekKey]: { groups: createDefaultWeekGroups(defaultWeekKey) }
                };
                return true;
            }).then(() => {
                state.activeGroup = 0;
                render();
            });
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderAvailabilitySelects(player) {
            const availArr = getPlayerWeekAvailability(player, state.activeWeek);
            return WEEKDAYS.map((day, i) => {
                const val = availArr[i] || "";
                return `
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-blue-400 font-semibold mb-0.5">${day}</span>
                        <select onchange="updatePlayerAvailability('${player.id}', ${i}, this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-0.5 py-0.5 text-[11px] text-slate-200 focus:border-blue-500 focus:outline-none">
                            <option value="" ${val === "" ? "selected" : ""}></option>
                            <option value="20:00~" ${val === "20:00~" ? "selected" : ""}>20:00~</option>
                            <option value="21:00~" ${val === "21:00~" ? "selected" : ""}>21:00~</option>
                        </select>
                    </div>
                `;
            }).join("");
        }

        function memberCard(player, index, teamName) {
            const level = getPlayerLevel(player);
            return `
                <div data-id="${escapeHtml(player.id)}" class="drag-item flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 p-2.5 transition hover:border-slate-700">
                    <div class="min-w-0 pr-1 flex-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-xs font-semibold text-slate-500 select-none">#${index + 1}</span>
                            <div class="flex items-center">
                                <span class="text-xs text-slate-500 select-none">Lv.</span>
                                <input type="text" value="${escapeHtml(level)}" placeholder="-" maxlength="3" inputmode="numeric" onchange="updatePlayerField('${player.id}', 'level', this.value)" class="w-8 rounded border border-slate-800 bg-slate-900 px-1 py-0.5 text-center text-xs font-semibold text-blue-400 focus:border-blue-500 focus:outline-none" title="點擊修改等級">
                            </div>
                            <input type="text" value="${escapeHtml(player.job)}" placeholder="職業" onchange="updatePlayerField('${player.id}', 'job', this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400 focus:border-blue-500 focus:outline-none" title="點擊修改職業">
                            <input type="text" value="${escapeHtml(player.name)}" placeholder="名字" onchange="updatePlayerField('${player.id}', 'name', this.value)" class="w-20 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs font-bold text-slate-200 focus:border-blue-500 focus:outline-none" title="點擊修改名字">
                            <input type="text" value="${escapeHtml(player.position)}" placeholder="AD/AP" onchange="updatePlayerField('${player.id}', 'position', this.value)" class="w-14 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-300 focus:border-blue-500 focus:outline-none" title="點擊修改 AD/AP">
                            
                            <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded border border-slate-800/80">
                                ${renderAvailabilitySelects(player)}
                            </div>

                            <input type="text" value="${escapeHtml(player.note || '')}" placeholder="備註" onchange="updatePlayerField('${player.id}', 'note', this.value)" class="w-20 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400 focus:border-blue-500 focus:outline-none" title="點擊修改備註">
                        </div>
                    </div>
                    <div class="flex shrink-0 gap-1 ml-1">
                        <button onclick="removeFromTeam('${teamName}', ${index})" title="從隊伍移除" class="rounded bg-slate-900 border border-slate-800 px-2 py-1 text-xs text-rose-400 hover:bg-rose-950 transition">✕ 退出</button>
                    </div>
                </div>
            `;
        }

        function renderTeam(teamName, title, emoji, timeKey) {
            const group = currentGroup();
            const members = group && group[teamName] ? group[teamName] : [];
            const teamTime = group && group[timeKey] ? group[timeKey] : "20:00";

            let html = `
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">

                        <div class="flex flex-wrap items-center gap-3">
                            <h2 class="flex items-center gap-2 text-lg font-bold text-slate-200">

                                ${title}
                                <span class="text-xs font-normal text-slate-500">(上限 6 人)</span>

                            <div class="flex items-center gap-1.5 bg-slate-950/80 px-2.5 py-1 rounded-lg border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">⏰ 時間:</span>
                                <input type="text" value="${escapeHtml(teamTime)}" placeholder="20:00" maxlength="5" inputmode="numeric" onchange="updateTeamTime('${teamName}', this.value)" class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-center text-xs font-bold text-blue-400 focus:border-blue-500 focus:outline-none" title="設定此隊伍時間">

                        <span class="rounded-full bg-slate-800 px-2.5 py-1 text-xs font-semibold text-slate-300">${members.length} / 6</span>
                    </div>
                    <div id="${teamName}-list" data-list-type="${teamName}" class="sortable-list grid min-h-[100px] grid-cols-1 gap-3">
            `;

                html += `<p class="empty-msg col-span-full py-4 text-center text-xs text-slate-500">此隊伍目前暫無成員（可從下方總名單拖拽加入）。</p>`;
            }

            html += `</div></div>`;
            return html;
        }

                            <span class="rounded-full bg-blue-950 px-2.5 py-1 text-xs font-semibold text-blue-400">

                                    <button onclick="sendToTeam('${player.id}', 'team2')" class="rounded border border-indigo-900 bg-indigo-950/70 px-2 py-1 text-xs font-medium text-indigo-300 hover:bg-indigo-900/50">+隊2</button>
                                    <button onclick="sendToTeam('${player.id}', 'team3')" class="rounded border border-purple-900 bg-purple-950/70 px-2 py-1 text-xs font-medium text-purple-300 hover:bg-purple-900/50">+隊3</button>
                                ` : ''}
                                <button onclick="deletePoolPlayer('${player.id}')" title="從總名單刪除此成員" class="ml-1 rounded bg-slate-900 border border-slate-800 px-2 py-1 text-xs text-rose-400 hover:bg-rose-950 transition">✕</button>
                            </div>

            html += `</div></div>`;
            return html;
        }

        function initSortables() {
            sortableInstances.forEach(instance => instance.destroy());
            sortableInstances = [];

            document.querySelectorAll(".sortable-list").forEach(el => {
                if (el.closest(".hidden")) return;

                const instance = new Sortable(el, {
                    group: {
                        name: "artale-shared-lists",
                        pull: function(to, from) {
                            return (from.el.dataset.listType === "pool" && to.el.dataset.listType !== "pool") ? "clone" : true;
                        },
                        put: function(to, from) {
                            const listType = to.el.dataset.listType;
                            const fromType = from.el.dataset.listType;
                            if (listType === "pool") {
                                return fromType === "pool";
                            }
                            if (listType === "team1" || listType === "team2" || listType === "team3") {
                                const group = currentGroup();
                                return !!group && group[listType] && group[listType].length < MAX_TEAM_SIZE;
                            }
                            return true;
                        }
                    },
                    draggable: ".drag-item",
                    animation: 150,
                    filter: "input, button, select",
                    preventOnFilter: false,
                    ghostClass: "sortable-ghost",
                    dragClass: "sortable-drag",
                    onEnd: function(evt) {
                        const fromType = evt.from.dataset.listType;
                        const toType = evt.to.dataset.listType;
                        const itemId = evt.item && evt.item.dataset ? evt.item.dataset.id : "";
                        const newIndex = typeof evt.newDraggableIndex === "number" ? evt.newDraggableIndex : evt.newIndex;

                        if (!itemId || !fromType || !toType || typeof newIndex !== "number") return;
                        if (fromType === toType && evt.oldDraggableIndex === evt.newDraggableIndex) return;

                        const activeWeekKey = state.activeWeek;
                        const groupIndex = state.activeGroup;

                        transactionUpdate(data => {
                            const poolPlayer = data.pool.find(p => String(p.id) === String(itemId));
                            if (!poolPlayer) return false;

                            if (fromType === "pool" && toType === "pool") {
                                const oldIdx = data.pool.findIndex(p => String(p.id) === String(itemId));
                                if (oldIdx === -1) return false;

                                const [moved] = data.pool.splice(oldIdx, 1);
                                
                                let targetIdx = newIndex;
                                if (state.filterAvailableOnly && currentTab !== "master") {
                                    const dayAvail = state.activeGroup;
                                    const filteredPool = data.pool.filter(p => {
                                        const avail = getPlayerWeekAvailability(p, activeWeekKey);
                                        return avail[dayAvail] && avail[dayAvail].trim() !== "";
                                    });
                                    if (newIndex < filteredPool.length) {
                                        const targetItem = filteredPool[newIndex];
                                        targetIdx = data.pool.findIndex(p => String(p.id) === String(targetItem.id));
                                    } else {
                                        targetIdx = data.pool.length;
                                    }
                                }
                                if (targetIdx < 0) targetIdx = 0;
                                data.pool.splice(targetIdx, 0, moved);
                                return true;
                            }

                            if (!data.weeksData || !data.weeksData[activeWeekKey]) return false;
                            const targetGroup = data.weeksData[activeWeekKey].groups[groupIndex];
                            if (!targetGroup) return false;

                            const isTargetTeam = toType === "team1" || toType === "team2" || toType === "team3";
                            const isSourceTeam = fromType === "team1" || fromType === "team2" || fromType === "team3";

                            if (fromType === "pool" && isTargetTeam) {
                                if (!targetGroup[toType]) targetGroup[toType] = [];
                                if (targetGroup[toType].length >= MAX_TEAM_SIZE) return false;
                                if (targetGroup[toType].some(p => String(p.id) === String(itemId))) {
                                    return false;
                                }
                                const safeIndex = Math.max(0, Math.min(newIndex, targetGroup[toType].length));
                                targetGroup[toType].splice(safeIndex, 0, { ...poolPlayer });
                                return true;
                            }

                            if (isSourceTeam && isTargetTeam) {
                                const sourceTeam = targetGroup[fromType] || [];
                                const targetTeam = targetGroup[toType] || [];

                                const itemIdx = sourceTeam.findIndex(p => String(p.id) === String(itemId));
                                if (itemIdx < 0) return false;

                                const [movedItem] = sourceTeam.splice(itemIdx, 1);

                                if (fromType !== toType && targetTeam.length >= MAX_TEAM_SIZE) {
                                    sourceTeam.splice(itemIdx, 0, movedItem);
                                    return false;
                                }

                                const safeIndex = Math.max(0, Math.min(newIndex, targetTeam.length));
                                targetTeam.splice(safeIndex, 0, movedItem);
                                return true;
                            }

                            return false;
                        });
                    }
                });

                sortableInstances.push(instance);
            });
        }

        function formatShareHeader() {
            return `
                <div class="share-row-item" style="border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; color: #94a3b8;">
                    <div class="share-col-level">等級</div>
                    <div class="share-col-job">職業</div>
                    <div class="share-col-name">名字</div>
                </div>
            `;
        }

        function formatShareLine(player) {
            const level = getPlayerLevel(player);

            return `
                <div class="share-row-item">
                    <div class="share-col-level">${escapeHtml(level || "---")}</div>
                    <div class="share-col-job">${escapeHtml(player.job || "")}</div>
                    <div class="share-col-name">${escapeHtml(player.name || "")}</div>
                </div>
            `;
        }

        async function generateAllTeamsImage() {
            if (typeof html2canvas === "undefined") return;

            const shareCard = document.getElementById("share-card");
            const activeGroups = [];
            const wData = currentWeekData();

            wData.groups.forEach((group, groupIndex) => {
                const hasTeam1 = group.team1 && group.team1.length > 0;
                const hasTeam2 = group.team2 && group.team2.length > 0;
                const hasTeam3 = group.team3 && group.team3.length > 0;
                if (hasTeam1 || hasTeam2 || hasTeam3) activeGroups.push({ groupIndex, group });
            });

            if (activeGroups.length === 0) {
                alert("本週目前沒有任何已分配的隊伍可產生圖片！");
                return;
            }

            previewImages = [];

            for (const { groupIndex, group } of activeGroups) {
                const weekday = getWeekday(group.date);
                const dateText = group.date ? `${group.date}${weekday ? `（${weekday}）` : ""}` : "";
                const groupTitle = GROUP_NAMES[groupIndex] || `第${groupIndex + 1}團`;
                
                const headerInfo = dateText || groupTitle;

                let contentHtml = `<div class="share-group-header-text">${escapeHtml(headerInfo)}</div>`;

                if (group.team1 && group.team1.length > 0) {
                    const t1Time = group.time1 || "20:00";
                    contentHtml += `<div class="share-team-title-text">⚔️ 第一隊 (${escapeHtml(t1Time)}) (${group.team1.length}人)</div>`;
                    contentHtml += formatShareHeader();
                    group.team1.forEach(player => contentHtml += formatShareLine(player));
                }

                if (group.team2 && group.team2.length > 0) {
                    const t2Time = group.time2 || "20:00";
                    contentHtml += `<div class="share-team-title-text" style="margin-top:20px;">⚔️ 第二隊 (${escapeHtml(t2Time)}) (${group.team2.length}人)</div>`;
                    contentHtml += formatShareHeader();
                    group.team2.forEach(player => contentHtml += formatShareLine(player));
                }

                if (group.team3 && group.team3.length > 0) {
                    const t3Time = group.time3 || "20:00";
                    contentHtml += `<div class="share-team-title-text" style="margin-top:20px;">⚔️ 第三隊 (${escapeHtml(t3Time)}) (${group.team3.length}人)</div>`;
                    contentHtml += formatShareHeader();
                    group.team3.forEach(player => contentHtml += formatShareLine(player));
                }

                shareCard.innerHTML = `<div class="share-card-inner">${contentHtml}</div>`;

                try {
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    const canvas = await html2canvas(shareCard.firstElementChild, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#111111",
                        logging: false,
                        imageTimeout: 0
                    });

                    previewImages.push({
                        title: headerInfo,
                        dataUrl: canvas.toDataURL("image/png")
                    });

                    await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                    console.error("產生團隊圖片失敗：", error);
                }
            }

            shareCard.innerHTML = "";
            if (previewImages.length > 0) {
                currentImageIndex = 0;
                showModal();
            }
        }

        function showModal() {
            updateModalContent();
            document.getElementById("image-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("image-modal").classList.add("hidden");
        }

        function updateModalContent() {
            const item = previewImages[currentImageIndex];
            if (!item) return;
            document.getElementById("modal-img").src = item.dataUrl;
            document.getElementById("modal-title").innerText = `圖片預覽 - ${item.title}`;
            document.getElementById("modal-page-info").innerText = `${currentImageIndex + 1} / ${previewImages.length}`;
            document.getElementById("btn-prev").disabled = currentImageIndex === 0;
            document.getElementById("btn-next").disabled = currentImageIndex === previewImages.length - 1;
        }

        function changeImage(step) {
            const newIndex = currentImageIndex + step;
            if (newIndex >= 0 && newIndex < previewImages.length) {
                currentImageIndex = newIndex;
                updateModalContent();
            }
        }

        async function copyModalImage() {
            const copyBtn = document.getElementById("btn-copy-img");
            try {
                if (!navigator.clipboard || typeof ClipboardItem === "undefined") {
                    throw new Error("此瀏覽器不支援圖片剪貼簿 API");
                }
                const item = previewImages[currentImageIndex];
                const res = await fetch(item.dataUrl);
                const blob = await res.blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);

                if (copyBtn) {
                    copyBtn.innerText = "✓ 已複製！";
                    copyBtn.classList.remove("border-blue-600", "bg-blue-600/20", "text-blue-300");
                    copyBtn.classList.add("border-emerald-500", "bg-emerald-600/20", "text-emerald-300");
                    if (copyBtnTimer) clearTimeout(copyBtnTimer);
                    copyBtnTimer = setTimeout(() => {
                        copyBtn.innerText = "📋 複製圖片";
                        copyBtn.classList.remove("border-emerald-500", "bg-emerald-600/20", "text-emerald-300");
                        copyBtn.classList.add("border-blue-600", "bg-blue-600/20", "text-blue-300");
                    }, 1500);
                }
            } catch (err) {
                console.error("複製失敗：", err);
                if (copyBtn) {
                    copyBtn.innerText = "✕ 複製失敗";
                    setTimeout(() => { copyBtn.innerText = "📋 複製圖片"; }, 1500);
                }
            }
        }

        function downloadModalImage() {
            const item = previewImages[currentImageIndex];
            if (!item) return;
            const link = document.createElement("a");
            link.download = `Artale_${item.title}.png`;
            link.href = item.dataUrl;
            link.click();
        }

        function render() {
            const defaultWeekKey = formatDateKey(getTuesdayOfWeek());
            state = state || {
                activeWeek: defaultWeekKey,
                activeGroup: 0,
                filterAvailableOnly: true,
                pool: [],
                weeksData: {}
            };

            const weekSelect = document.getElementById("week-select");
            if (weekSelect) {
                const weekKeys = getAvailableWeekKeys();
                weekSelect.innerHTML = weekKeys.map(wk => {
                    const title = getWeekDisplayTitle(wk);
                    return `<option value="${wk}" ${wk === state.activeWeek ? "selected" : ""}>${title}</option>`;
                }).join("");
            }

            const deleteWeekBtn = document.getElementById("btn-delete-week");
            if (deleteWeekBtn) {
                if (isTwoWeeksAgoOrEarlier(state.activeWeek)) {
                    deleteWeekBtn.classList.remove("hidden");
                } else {
                    deleteWeekBtn.classList.add("hidden");
                }
            }

            const wData = currentWeekData();
            const curGroup = currentGroup();
            const groupTeamTotal = (curGroup.team1?.length || 0) + (curGroup.team2?.length || 0) + (curGroup.team3?.length || 0);

            document.getElementById("master-tab-badge").innerText = `${state.pool.length}人`;
            document.getElementById("teams-tab-badge").innerText = `${groupTeamTotal}/18`;

            const btnMaster = document.getElementById("tab-btn-master");
            const btnTeams = document.getElementById("tab-btn-teams");
            const contentMaster = document.getElementById("tab-content-master");
            const contentTeams = document.getElementById("tab-content-teams");

            if (currentTab === "master") {
                btnMaster.className = "flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold bg-blue-600 text-white shadow-md transition-all duration-200";
                btnTeams.className = "flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all duration-200";
                contentMaster.classList.remove("hidden");
                contentTeams.classList.add("hidden");
            } else {
                btnTeams.className = "flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold bg-blue-600 text-white shadow-md transition-all duration-200";
                btnMaster.className = "flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all duration-200";
                contentTeams.classList.remove("hidden");
                contentMaster.classList.add("hidden");
            }

            const tabs = document.getElementById("group-tabs");
            tabs.innerHTML = wData.groups.map((group, index) => {
                const weekday = getWeekday(group.date);
                const gName = GROUP_NAMES[index] || `第 ${index + 1} 團`;
                return `
                    <div class="flex flex-col items-center gap-1.5 rounded-lg border border-slate-800 bg-slate-950 p-2.5">
                        <button onclick="selectGroup(${index})" class="rounded-md px-3.5 py-1.5 text-xs font-semibold transition ${index === state.activeGroup ? "bg-blue-600 text-white shadow-sm" : "bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800"}">${gName}</button>
                        <div class="flex items-center gap-1">
                            <input type="text" value="${escapeHtml(group.date || "")}" placeholder="9/8" maxlength="5" inputmode="numeric" onchange="updateGroupDate(${index}, this.value)" class="w-24 rounded border border-slate-800 bg-slate-900 px-2 py-1 text-center text-xs text-slate-200 focus:border-blue-500 focus:outline-none" title="設定日期">
                            ${weekday ? `<span class="text-xs font-medium text-blue-400">(${weekday})</span>` : ""}
                        </div>
                    </div>
                `;
            }).join("");

            document.getElementById("master-view-container").innerHTML = renderPool(true);
            document.getElementById("teams-cards-container").innerHTML = 
                renderTeam("team1", "第一隊", "⚔️", "time1") + 
                renderTeam("team2", "第二隊", "⚔️", "time2") + 
                renderTeam("team3", "第三隊", "⚔️", "time3");
            document.getElementById("teams-pool-container").innerHTML = renderPool(false);

            initSortables();
        }

        initFirebaseListener();
    </script>
</body>
